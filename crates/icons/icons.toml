# icons.toml - custom icon set for Quai des Orfèvres 36.
#
# Built by fonts_rs_generator::IconSetBuild in build.rs. The whitelist
# `name` is the upstream SVG file stem; `rename` becomes the exported
# base name (`qdo-<rename>-symbolic`).
#
# Inventory: concepts/planned/ARTWORK.md section 1.

[iconset]
name = "Qdo36Icons"
display_name = "Quai des Orfèvres 36 Icons"
icon_prefix = "qdo"
gresource_prefix = "/io/github/smearor/qdo36/icons"
icons_context = "actions"

