<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <!-- Dark Noir / Midnight Gradient for Corbeau Identity -->
    <linearGradient id="corbeauBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <!-- Ornate Gold/Bronze Accents -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Glowing Eye & Reveal Burst Accent -->
    <radialGradient id="revealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fff5d1" />
      <stop offset="70%" stop-color="#dfbe6f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Role Card Body (Private Zone Header / Identity Card) -->
  <rect x="15" y="15" width="470" height="270" rx="8" ry="8" fill="url(#corbeauBg)" stroke="url(#goldAcc)" stroke-width="3" filter="url(#cardShadow)" />

  <!-- Inner Fine Filigree Border -->
  <rect x="25" y="25" width="450" height="250" rx="4" ry="4" fill="none" stroke="#2c3848" stroke-width="1.5" />
  <rect x="29" y="29" width="442" height="242" rx="3" ry="3" fill="none" stroke="url(#goldAcc)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Corner Flourishes (Art Nouveau) -->
  <g fill="none" stroke="url(#goldAcc)" stroke-width="1.5">
    <!-- Top-Left -->
    <path d="M 32,52 C 32,35 35,32 52,32 M 32,60 C 32,40 40,32 60,32" />
    <circle cx="38" cy="38" r="3" fill="url(#goldAcc)" />
    <!-- Top-Right -->
    <path d="M 468,52 C 468,35 465,32 448,32 M 468,60 C 468,40 460,32 440,32" />
    <circle cx="462" cy="38" r="3" fill="url(#goldAcc)" />
    <!-- Bottom-Left -->
    <path d="M 32,248 C 32,265 35,268 52,268 M 32,240 C 32,260 40,268 60,268" />
    <circle cx="38" cy="262" r="3" fill="url(#goldAcc)" />
    <!-- Bottom-Right -->
    <path d="M 468,248 C 468,265 465,268 448,268 M 468,240 C 468,260 460,268 440,268" />
    <circle cx="462" cy="262" r="3" fill="url(#goldAcc)" />
  </g>

  <!-- Top Private Zone Header Banner -->
  <g transform="translate(250, 50)">
    <path d="M -160,-14 Q 0,-18 160,-14 Q 160,14 160,14 Q 0,18 -160,14 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.5" />
    <text x="0" y="4" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="11" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="3">
      DOSSIER SECRET · RÔLE PRINCIPAL
    </text>
  </g>

  <!-- Central Emblem: Reveal Flash / Radial Burst behind Corbeau Silhouette -->
  <g transform="translate(250, 148)">
    <!-- Radial Burst Rays -->
    <g fill="url(#goldAcc)" opacity="0.4" filter="url(#glowFilter)">
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(45)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(90)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(135)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(180)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(225)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(270)" />
      <path d="M 0,0 L -5,-75 L 0,-90 L 5,-75 Z" transform="rotate(315)" />
    </g>

    <!-- Background Halo Ring -->
    <circle r="52" fill="url(#revealGlow)" opacity="0.6" />
    <circle r="44" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Raven Head Silhouette (Corbeau) Facing Left -->
    <g transform="translate(0, 4) scale(1.1)" filter="url(#cardShadow)">
      <!-- Head and Crown Profile -->
      <path d="M -22,-28 C -12,-34 10,-32 20,-22 C 28,-14 32,-4 30,6 C 28,14 20,22 8,26 C -2,29 -18,28 -28,24 C -24,18 -20,10 -22,2 C -24,-8 -22,-20 -22,-28 Z" fill="#080b10" stroke="url(#goldAcc)" stroke-width="2" />
      <!-- Sharp Beak -->
      <path d="M 20,-22 C 32,-18 52,-8 58,-2 C 50,0 36,2 30,6 C 28,0 24,-10 20,-22 Z" fill="#141a26" stroke="url(#goldAcc)" stroke-width="1.5" />
    </g>

    <!-- Single Luminous Eye Accent (Piercing Golden/White Glint) -->
    <circle cx="12" cy="-9" r="4.5" fill="#ffffff" filter="url(#glowFilter)" />
    <circle cx="12" cy="-9" r="2" fill="#dfbe6f" />
  </g>

  <!-- Role Title Banner (CORBEAU) -->
  <text x="250" y="235" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="28" font-weight="bold" fill="#fef0cd" text-anchor="middle" letter-spacing="6">
    CORBEAU
  </text>

  <!-- Subtitle / Fugitive Description -->
  <text x="250" y="255" font-family="&#39;Courier Prime&#39;, monospace" font-size="10.5" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="2">
    LE FUGITIF · MAÎTRE DE L'ÉVASION
  </text>
</svg>