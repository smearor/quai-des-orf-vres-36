<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 0,150 L 500,150 M 250,0 L 250,300" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Plaque Outer Frame -->
    <rect x="15" y="15" width="470" height="270" rx="8" ry="8" fill="#0B1020" stroke="#A78BFA" stroke-width="2.5" filter="url(#neonGlow)" />
    <rect x="23" y="23" width="454" height="254" rx="4" ry="4" fill="#0F1730" stroke="#16224A" stroke-width="1.5" />

    <!-- Inner Dashed Neon Border -->
    <rect x="29" y="29" width="442" height="242" rx="2" ry="2" fill="none" stroke="#FFE066" stroke-width="1" stroke-dasharray="6,4" opacity="0.8" filter="url(#neonGlow)" />

    <!-- Corner Circuit Terminals -->
    <circle cx="40" cy="40" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="460" cy="40" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="40" cy="260" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="460" cy="260" r="3" fill="#FFE066" filter="url(#neonGlow)" />

    <!-- Top Label / Header Box -->
    <rect x="80" y="45" width="340" height="40" rx="4" ry="4" fill="#0B1020" stroke="#4D7CFE" stroke-width="1.5" filter="url(#neonGlow)" />
    <text x="250" y="71" font-family="&#39;Orbitron&#39;, &#39;Share Tech Mono&#39;, monospace" font-size="14" font-weight="bold" fill="#C9D4FF" text-anchor="middle" letter-spacing="3" filter="url(#neonGlow)">
      CORBEAU_EMBLEM
    </text>

    <!-- Central Emblem: Glowing Neon Compass & Lit Silhouette -->
    <g transform="translate(250, 165)" filter="url(#neonGlow)">
      <!-- Radial Neon Rays -->
      <g fill="#A78BFA" stroke="#C9D4FF" stroke-width="1">
        <polygon points="0,-65 3,-45 -3,-45" />
        <polygon points="0,65 3,45 -3,45" />
        <polygon points="-65,0 -45,3 -45,-3" />
        <polygon points="65,0 45,3 45,-3" />
        <polygon points="-46,-46 -32,-32 -36,-38" />
        <polygon points="46,46 32,32 38,36" />
        <polygon points="-46,46 -32,32 -38,36" />
        <polygon points="46,-46 32,-32 26,-38" />
      </g>

      <!-- Inner Neon Ring -->
      <circle cx="0" cy="0" r="38" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#4D7CFE" stroke-width="1" stroke-dasharray="3,2" />

      <!-- Lit Silhouette (Corbeau / #F9FAFB) -->
      <path d="M -16,-14 C -16,-26 12,-26 18,-14 C 22,-4 32,0 40,2 C 32,4 20,8 14,16 C 6,20 -16,16 -16,-14 Z" fill="#F9FAFB" stroke="#C9D4FF" stroke-width="1" />
      
      <!-- Glowing Eye Dot -->
      <circle cx="-2" cy="-6" r="3" fill="#0B1020" stroke="#FFE066" stroke-width="1.5" />
      <circle cx="-2" cy="-6" r="1" fill="#FFE066" />
    </g>
  </g>
</svg>