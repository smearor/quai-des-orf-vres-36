<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#B6BD00" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M0.33,-8.32 Q0.96,-8.32 1.14,-7.41 Q1.27,-3.17 1.27,1.84 Q1.27,6.84 1.22,7.62 Q1.16,8.40 0.88,8.71 Q0.59,9.03 -0.16,9.03 Q-0.84,9.03 -0.84,8.19 L-0.84,2.32 Q-0.84,0.89 -0.89,-0.62 Q-0.94,-2.13 -0.94,-2.52 Q-1.83,-1.01 -3.28,-0.04 Q-4.74,0.94 -6.53,0.94 Q-8.33,0.94 -9.55,-0.54 Q-9.60,1.04 -9.60,3.21 Q-9.60,5.39 -9.57,7.78 Q-9.57,8.43 -10.00,8.73 Q-10.43,9.03 -10.98,9.03 Q-11.68,9.03 -11.68,8.17 Q-11.65,5.83 -11.65,0.76 L-11.65,-6.63 Q-11.65,-7.07 -11.36,-7.48 Q-11.06,-7.90 -10.65,-7.90 Q-10.25,-7.90 -9.91,-7.68 Q-9.57,-7.46 -9.55,-7.02 Q-9.44,-4.13 -8.61,-2.73 Q-7.78,-1.32 -6.64,-1.32 Q-5.49,-1.32 -4.67,-1.70 Q-3.85,-2.08 -3.32,-2.57 Q-2.79,-3.06 -2.29,-3.97 Q-1.59,-5.27 -0.94,-7.17 Q-0.55,-8.32 0.33,-8.32 ZM12.28,-4.55 L12.25,-1.95 Q12.25,-1.06 12.25,2.97 L12.30,7.91 Q12.30,8.38 11.90,8.68 Q11.50,8.97 11.15,8.97 Q10.80,8.97 10.59,8.65 Q10.38,8.32 10.35,7.91 Q10.17,4.09 10.17,0.00 Q9.50,0.89 7.44,0.89 Q6.04,0.89 5.13,-0.57 Q4.22,-2.02 4.22,-3.71 Q4.22,-5.95 5.61,-7.13 Q7.00,-8.32 9.13,-8.32 Q11.26,-8.32 12.07,-6.68 Q12.28,-6.24 12.28,-4.55 ZM10.22,-3.92 L10.25,-5.20 Q10.25,-5.82 10.15,-6.01 Q10.04,-6.21 9.89,-6.31 Q9.70,-6.50 9.46,-6.50 Q9.21,-6.50 8.81,-6.40 Q8.40,-6.31 7.77,-6.04 Q7.13,-5.77 6.65,-5.13 Q6.17,-4.49 6.17,-3.48 Q6.17,-2.47 6.69,-1.82 Q7.21,-1.17 7.78,-1.17 Q7.94,-1.17 8.12,-1.22 Q9.68,-1.63 10.22,-2.05 L10.22,-3.92 Z"/></g>
  </g>
</svg>
