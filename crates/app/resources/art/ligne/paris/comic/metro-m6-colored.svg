<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#6ECA97" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M-0.08,-8.32 Q0.54,-8.32 0.72,-7.41 Q0.85,-3.17 0.85,1.84 Q0.85,6.84 0.80,7.62 Q0.75,8.40 0.46,8.71 Q0.18,9.03 -0.58,9.03 Q-1.25,9.03 -1.25,8.19 L-1.25,2.32 Q-1.25,0.89 -1.31,-0.62 Q-1.36,-2.13 -1.36,-2.52 Q-2.24,-1.01 -3.70,-0.04 Q-5.15,0.94 -6.95,0.94 Q-8.74,0.94 -9.96,-0.54 Q-10.02,1.04 -10.02,3.21 Q-10.02,5.39 -9.99,7.78 Q-9.99,8.43 -10.42,8.73 Q-10.85,9.03 -11.39,9.03 Q-12.10,9.03 -12.10,8.17 Q-12.07,5.83 -12.07,0.76 L-12.07,-6.63 Q-12.07,-7.07 -11.77,-7.48 Q-11.47,-7.90 -11.07,-7.90 Q-10.67,-7.90 -10.33,-7.68 Q-9.99,-7.46 -9.96,-7.02 Q-9.86,-4.13 -9.03,-2.73 Q-8.20,-1.32 -7.05,-1.32 Q-5.91,-1.32 -5.09,-1.70 Q-4.27,-2.08 -3.74,-2.57 Q-3.20,-3.06 -2.71,-3.97 Q-2.01,-5.27 -1.36,-7.17 Q-0.97,-8.32 -0.08,-8.32 ZM8.18,-3.19 Q6.79,-0.41 6.66,0.13 Q7.75,-0.15 8.88,-0.15 Q10.02,-0.15 11.00,0.47 Q12.62,1.54 12.62,3.90 Q12.62,9.08 7.57,9.10 Q7.55,9.10 7.49,9.10 Q5.65,9.10 4.84,7.82 Q4.04,6.53 3.96,4.40 Q3.96,-0.54 7.68,-6.50 Q8.30,-7.54 8.77,-7.85 Q9.24,-8.16 9.51,-8.16 Q9.78,-8.16 10.07,-7.95 Q10.35,-7.74 10.35,-7.38 Q10.35,-7.02 9.96,-6.50 Q9.57,-5.98 8.18,-3.19 ZM10.08,2.45 Q9.50,1.88 8.51,1.88 Q7.52,1.88 7.05,2.03 Q6.69,2.19 6.48,2.44 Q6.27,2.68 6.10,3.20 Q5.93,3.72 5.93,4.62 Q5.93,5.52 6.44,6.18 Q6.95,6.84 7.68,6.84 Q9.13,6.84 9.90,5.98 Q10.67,5.13 10.67,4.07 Q10.67,3.02 10.08,2.45 Z"/></g>
  </g>
</svg>
