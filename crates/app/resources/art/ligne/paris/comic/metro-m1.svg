<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M0.38,-8.32 Q1.01,-8.32 1.19,-7.41 Q1.32,-3.17 1.32,1.84 Q1.32,6.84 1.27,7.62 Q1.22,8.40 0.93,8.71 Q0.64,9.03 -0.11,9.03 Q-0.79,9.03 -0.79,8.19 L-0.79,2.32 Q-0.79,0.89 -0.84,-0.62 Q-0.89,-2.13 -0.89,-2.52 Q-1.77,-1.01 -3.23,-0.04 Q-4.69,0.94 -6.48,0.94 Q-8.27,0.94 -9.50,-0.54 Q-9.55,1.04 -9.55,3.21 Q-9.55,5.39 -9.52,7.78 Q-9.52,8.43 -9.95,8.73 Q-10.38,9.03 -10.93,9.03 Q-11.63,9.03 -11.63,8.17 Q-11.60,5.83 -11.60,0.76 L-11.60,-6.63 Q-11.60,-7.07 -11.30,-7.48 Q-11.00,-7.90 -10.60,-7.90 Q-10.20,-7.90 -9.86,-7.68 Q-9.52,-7.46 -9.50,-7.02 Q-9.39,-4.13 -8.56,-2.73 Q-7.73,-1.32 -6.58,-1.32 Q-5.44,-1.32 -4.62,-1.70 Q-3.80,-2.08 -3.27,-2.57 Q-2.74,-3.06 -2.24,-3.97 Q-1.54,-5.27 -0.89,-7.17 Q-0.50,-8.32 0.38,-8.32 ZM11.73,7.78 Q11.73,9.05 10.35,9.05 Q10.07,9.05 9.85,8.80 Q9.63,8.56 9.63,8.04 L9.55,1.43 Q9.55,-1.84 9.63,-4.73 Q8.74,-3.95 7.91,-2.93 Q7.08,-1.92 6.78,-1.58 Q6.48,-1.24 6.00,-0.92 Q5.52,-0.59 5.10,-0.59 Q4.69,-0.59 4.44,-0.88 Q4.19,-1.17 4.19,-1.58 Q4.19,-2.00 4.80,-2.71 Q5.41,-3.43 9.31,-7.56 Q9.91,-8.11 10.82,-8.11 Q11.26,-8.11 11.55,-7.85 Q11.84,-7.59 11.84,-7.25 L11.65,-0.26 L11.73,7.78 Z"/></g>
  </g>
</svg>
