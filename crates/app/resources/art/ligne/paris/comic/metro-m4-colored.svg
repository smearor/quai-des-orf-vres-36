<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#BE418D" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M0.23,-8.32 Q0.85,-8.32 1.03,-7.41 Q1.16,-3.17 1.16,1.84 Q1.16,6.84 1.11,7.62 Q1.06,8.40 0.77,8.71 Q0.49,9.03 -0.27,9.03 Q-0.94,9.03 -0.94,8.19 L-0.94,2.32 Q-0.94,0.89 -0.99,-0.62 Q-1.05,-2.13 -1.05,-2.52 Q-1.93,-1.01 -3.39,-0.04 Q-4.84,0.94 -6.64,0.94 Q-8.43,0.94 -9.65,-0.54 Q-9.70,1.04 -9.70,3.21 Q-9.70,5.39 -9.68,7.78 Q-9.68,8.43 -10.11,8.73 Q-10.54,9.03 -11.08,9.03 Q-11.78,9.03 -11.78,8.17 Q-11.76,5.83 -11.76,0.76 L-11.76,-6.63 Q-11.76,-7.07 -11.46,-7.48 Q-11.16,-7.90 -10.76,-7.90 Q-10.35,-7.90 -10.02,-7.68 Q-9.68,-7.46 -9.65,-7.02 Q-9.55,-4.13 -8.72,-2.73 Q-7.88,-1.32 -6.74,-1.32 Q-5.60,-1.32 -4.78,-1.70 Q-3.96,-2.08 -3.43,-2.57 Q-2.89,-3.06 -2.40,-3.97 Q-1.70,-5.27 -1.05,-7.17 Q-0.66,-8.32 0.23,-8.32 ZM9.91,3.25 Q8.98,3.41 7.26,3.41 Q5.54,3.41 4.92,2.84 Q4.30,2.27 4.30,0.36 Q4.30,-1.56 4.58,-3.84 Q4.87,-6.13 5.22,-7.21 Q5.57,-8.29 6.61,-8.29 Q7.31,-8.29 7.42,-7.69 Q7.42,-7.54 7.42,-7.20 Q7.42,-6.86 7.26,-6.24 Q6.64,-1.66 6.64,0.29 Q6.64,0.76 6.66,1.07 Q7.13,1.17 7.92,1.17 Q8.72,1.17 9.94,1.02 Q9.99,0.47 9.99,-0.45 Q9.99,-1.37 10.02,-2.00 Q10.04,-2.62 10.20,-2.88 Q10.35,-3.14 11.09,-3.14 Q11.84,-3.14 12.03,-2.88 Q12.23,-2.62 12.23,-2.17 Q12.23,-1.71 12.15,-0.27 Q12.07,1.17 12.07,7.86 Q12.07,9.03 10.93,9.03 Q10.87,9.03 10.82,9.03 Q9.86,9.03 9.86,7.44 L9.86,6.01 L9.91,3.25 Z"/></g>
  </g>
</svg>
