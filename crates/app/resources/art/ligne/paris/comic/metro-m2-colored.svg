<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#003CA6" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M-0.98,-8.32 Q-0.36,-8.32 -0.17,-7.41 Q-0.04,-3.17 -0.04,1.84 Q-0.04,6.84 -0.10,7.62 Q-0.15,8.40 -0.44,8.71 Q-0.72,9.03 -1.47,9.03 Q-2.15,9.03 -2.15,8.19 L-2.15,2.32 Q-2.15,0.89 -2.20,-0.62 Q-2.25,-2.13 -2.25,-2.52 Q-3.14,-1.01 -4.59,-0.04 Q-6.05,0.94 -7.84,0.94 Q-9.64,0.94 -10.86,-0.54 Q-10.91,1.04 -10.91,3.21 Q-10.91,5.39 -10.89,7.78 Q-10.89,8.43 -11.32,8.73 Q-11.74,9.03 -12.29,9.03 Q-12.99,9.03 -12.99,8.17 Q-12.97,5.83 -12.97,0.76 L-12.97,-6.63 Q-12.97,-7.07 -12.67,-7.48 Q-12.37,-7.90 -11.97,-7.90 Q-11.56,-7.90 -11.22,-7.68 Q-10.89,-7.46 -10.86,-7.02 Q-10.76,-4.13 -9.92,-2.73 Q-9.09,-1.32 -7.95,-1.32 Q-6.80,-1.32 -5.99,-1.70 Q-5.17,-2.08 -4.63,-2.57 Q-4.10,-3.06 -3.61,-3.97 Q-2.90,-5.27 -2.25,-7.17 Q-1.87,-8.32 -0.98,-8.32 ZM9.77,9.05 L5.95,9.00 Q5.69,9.00 5.43,9.00 Q2.85,9.00 2.85,8.01 Q2.85,7.31 3.11,6.69 Q3.37,6.06 3.61,5.75 Q3.84,5.44 4.54,4.71 Q5.24,3.98 5.56,3.62 Q5.87,3.25 7.44,1.77 Q9.02,0.29 9.81,-0.91 Q10.60,-2.10 10.60,-3.43 Q10.60,-5.48 8.96,-6.08 Q8.49,-6.24 8.00,-6.24 Q6.88,-6.24 5.76,-5.27 Q5.32,-4.86 4.83,-4.86 Q4.67,-4.86 4.54,-4.88 Q3.89,-5.04 3.89,-5.79 Q3.89,-6.81 5.32,-7.48 Q6.86,-8.21 8.66,-8.21 Q10.47,-8.21 11.63,-6.90 Q12.79,-5.59 12.79,-3.64 Q12.79,-0.85 11.07,1.15 Q10.26,2.08 9.43,2.89 Q6.80,5.39 5.92,6.69 Q7.09,6.76 8.82,6.76 Q10.55,6.76 13.10,6.56 Q13.49,6.63 13.73,6.91 Q13.98,7.18 13.98,7.52 Q13.98,8.40 13.04,8.74 Q12.11,9.05 9.77,9.05 Z"/></g>
  </g>
</svg>
