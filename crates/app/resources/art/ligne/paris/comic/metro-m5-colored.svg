<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#FF7E2E" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M-0.40,-8.32 Q0.23,-8.32 0.41,-7.41 Q0.54,-3.17 0.54,1.84 Q0.54,6.84 0.49,7.62 Q0.44,8.40 0.15,8.71 Q-0.14,9.03 -0.89,9.03 Q-1.57,9.03 -1.57,8.19 L-1.57,2.32 Q-1.57,0.89 -1.62,-0.62 Q-1.67,-2.13 -1.67,-2.52 Q-2.55,-1.01 -4.01,-0.04 Q-5.47,0.94 -7.26,0.94 Q-9.05,0.94 -10.28,-0.54 Q-10.33,1.04 -10.33,3.21 Q-10.33,5.39 -10.30,7.78 Q-10.30,8.43 -10.73,8.73 Q-11.16,9.03 -11.71,9.03 Q-12.41,9.03 -12.41,8.17 Q-12.38,5.83 -12.38,0.76 L-12.38,-6.63 Q-12.38,-7.07 -12.08,-7.48 Q-11.78,-7.90 -11.38,-7.90 Q-10.98,-7.90 -10.64,-7.68 Q-10.30,-7.46 -10.28,-7.02 Q-10.17,-4.13 -9.34,-2.73 Q-8.51,-1.32 -7.36,-1.32 Q-6.22,-1.32 -5.40,-1.70 Q-4.58,-2.08 -4.05,-2.57 Q-3.52,-3.06 -3.02,-3.97 Q-2.32,-5.27 -1.67,-7.17 Q-1.28,-8.32 -0.40,-8.32 ZM5.88,-2.21 Q6.95,-2.60 7.94,-2.60 Q8.92,-2.60 9.85,-2.28 Q10.77,-1.97 11.54,-1.32 Q12.30,-0.67 12.77,0.46 Q13.24,1.59 13.24,3.07 Q13.24,5.57 11.78,7.28 Q10.33,9.00 8.42,9.00 Q6.51,9.00 5.06,8.13 Q3.62,7.26 3.62,6.22 Q3.62,5.72 3.74,5.48 Q3.85,5.23 4.17,5.07 Q4.48,4.92 4.73,4.92 Q4.97,4.92 5.40,5.22 Q5.83,5.52 6.61,6.06 Q7.39,6.61 8.40,6.61 Q9.42,6.61 10.20,5.58 Q10.98,4.55 10.98,3.33 Q10.98,-0.18 7.83,-0.18 Q7.16,-0.18 6.26,-0.05 Q5.36,0.08 5.09,0.11 Q4.82,0.13 4.35,-0.07 Q3.80,-0.59 3.80,-3.39 Q3.80,-6.18 3.93,-7.00 Q4.06,-7.82 4.37,-7.95 Q4.92,-8.19 7.64,-8.19 Q10.35,-8.19 11.99,-7.67 Q12.51,-7.35 12.51,-6.77 Q12.51,-6.18 12.19,-5.82 Q11.86,-5.46 11.50,-5.53 Q9.34,-6.00 7.16,-6.00 Q6.48,-6.00 5.80,-5.95 Q5.80,-4.94 5.88,-2.21 Z"/></g>
  </g>
</svg>
