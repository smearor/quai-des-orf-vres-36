<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#837902" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M-0.72,-8.32 Q-0.10,-8.32 0.09,-7.41 Q0.21,-3.17 0.21,1.84 Q0.21,6.84 0.16,7.62 Q0.11,8.40 -0.18,8.71 Q-0.46,9.03 -1.21,9.03 Q-1.89,9.03 -1.89,8.19 L-1.89,2.32 Q-1.89,0.89 -1.94,-0.62 Q-1.99,-2.13 -1.99,-2.52 Q-2.88,-1.01 -4.33,-0.04 Q-5.79,0.94 -7.58,0.94 Q-9.38,0.94 -10.60,-0.54 Q-10.65,1.04 -10.65,3.21 Q-10.65,5.39 -10.63,7.78 Q-10.63,8.43 -11.06,8.73 Q-11.48,9.03 -12.03,9.03 Q-12.73,9.03 -12.73,8.17 Q-12.71,5.83 -12.71,0.76 L-12.71,-6.63 Q-12.71,-7.07 -12.41,-7.48 Q-12.11,-7.90 -11.71,-7.90 Q-11.30,-7.90 -10.96,-7.68 Q-10.63,-7.46 -10.60,-7.02 Q-10.50,-4.13 -9.66,-2.73 Q-8.83,-1.32 -7.69,-1.32 Q-6.54,-1.32 -5.73,-1.70 Q-4.91,-2.08 -4.37,-2.57 Q-3.84,-3.06 -3.35,-3.97 Q-2.64,-5.27 -1.99,-7.17 Q-1.61,-8.32 -0.72,-8.32 ZM8.08,-6.18 Q6.54,-6.18 5.22,-4.86 Q4.85,-4.60 4.57,-4.60 Q4.28,-4.60 4.07,-4.65 Q3.48,-4.83 3.48,-5.48 Q3.48,-6.55 4.83,-7.35 Q6.18,-8.16 8.03,-8.16 Q9.87,-8.16 11.11,-7.18 Q12.34,-6.21 12.34,-4.65 Q12.34,-3.09 11.99,-2.05 Q11.64,-1.01 10.47,-0.33 Q13.23,0.71 13.23,3.41 Q13.23,5.70 11.85,7.35 Q10.47,9.00 8.48,9.00 Q6.49,9.00 4.98,8.05 Q3.48,7.10 3.48,5.91 Q3.48,5.67 3.74,5.36 Q4.00,5.05 4.49,5.05 Q4.98,5.05 5.56,5.50 Q6.13,5.96 6.86,6.41 Q7.58,6.87 8.49,6.87 Q11.09,6.87 11.09,3.62 Q11.09,2.37 10.20,1.60 Q9.30,0.84 7.66,0.81 Q7.32,0.78 7.16,0.76 Q6.99,0.73 6.71,0.52 Q6.44,0.32 6.44,-0.13 Q6.44,-1.06 7.48,-1.14 Q8.52,-1.22 9.34,-2.08 Q10.16,-2.93 10.16,-4.23 Q10.16,-4.96 9.54,-5.57 Q8.91,-6.18 8.08,-6.18 Z"/></g>
  </g>
</svg>
