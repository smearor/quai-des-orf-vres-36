<!-- ============================================================
     LIGNE MÉTRO (COMIC) — TINTABLE MASTER
     Comic-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the official line colour (stroke
       substitution).
     - #line-name carries the line name text (fill substitution +
       character data via texts); it renders with a hard ink halo
       via paint-order instead of a blur filter.
     - The halo/paper/ink elements are colour-neutral and must NOT
       be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Metro Line Colour Ring Accent (parametrized via #line-accent) -->
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#FA9ABA" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Line Name with Hard Ink Halo (parametrized via #line-name) -->
    <g id="line-name" fill="#1C1917" stroke="#F7EFE0" stroke-width="3" stroke-linejoin="round" paint-order="stroke"><path d="M-1.33,-8.32 Q-0.71,-8.32 -0.53,-7.41 Q-0.40,-3.17 -0.40,1.84 Q-0.40,6.84 -0.45,7.62 Q-0.50,8.40 -0.79,8.71 Q-1.07,9.03 -1.83,9.03 Q-2.50,9.03 -2.50,8.19 L-2.50,2.32 Q-2.50,0.89 -2.55,-0.62 Q-2.61,-2.13 -2.61,-2.52 Q-3.49,-1.01 -4.95,-0.04 Q-6.40,0.94 -8.20,0.94 Q-9.99,0.94 -11.21,-0.54 Q-11.26,1.04 -11.26,3.21 Q-11.26,5.39 -11.24,7.78 Q-11.24,8.43 -11.67,8.73 Q-12.10,9.03 -12.64,9.03 Q-13.34,9.03 -13.34,8.17 Q-13.32,5.83 -13.32,0.76 L-13.32,-6.63 Q-13.32,-7.07 -13.02,-7.48 Q-12.72,-7.90 -12.32,-7.90 Q-11.91,-7.90 -11.58,-7.68 Q-11.24,-7.46 -11.21,-7.02 Q-11.11,-4.13 -10.28,-2.73 Q-9.44,-1.32 -8.30,-1.32 Q-7.16,-1.32 -6.34,-1.70 Q-5.52,-2.08 -4.98,-2.57 Q-4.45,-3.06 -3.96,-3.97 Q-3.26,-5.27 -2.61,-7.17 Q-2.22,-8.32 -1.33,-8.32 ZM10.61,-0.31 L10.41,7.88 Q10.41,8.45 10.03,8.74 Q9.65,9.03 9.18,9.03 Q8.46,9.03 8.46,7.08 Q8.46,3.05 8.69,-0.36 L6.04,-0.20 Q5.73,-0.18 5.47,-0.50 Q5.21,-0.83 5.21,-1.17 Q5.21,-2.08 6.30,-2.08 L8.85,-2.10 L9.11,-5.25 Q8.22,-5.56 4.58,-6.13 Q3.18,-6.37 2.92,-6.42 Q2.24,-6.55 2.24,-7.43 Q2.24,-7.74 2.50,-8.03 Q2.76,-8.32 3.24,-8.32 Q3.72,-8.32 7.14,-7.76 Q10.56,-7.20 10.93,-6.86 Q11.08,-6.73 11.08,-5.90 Q11.08,-5.51 10.90,-3.79 Q10.74,-2.60 10.72,-2.15 L12.02,-2.23 Q12.20,-2.23 12.60,-2.23 Q13.01,-2.23 13.29,-2.05 Q13.58,-1.87 13.58,-1.36 Q13.58,-0.85 13.21,-0.61 Q12.85,-0.36 11.81,-0.33 L10.61,-0.31 Z"/></g>
  </g>
</svg>
