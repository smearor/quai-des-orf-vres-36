<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#E19BDF" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#E19BDF" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-13.84,4.95 L-13.60,-6.45 L-12.91,-6.40 L-13.17,4.95 Q-13.20,6.22 -12.66,6.97 Q-12.12,7.71 -11.13,7.71 Q-11.06,7.71 -11.06,7.86 Q-11.06,8.00 -11.13,8.00 Q-11.66,8.00 -12.21,7.98 Q-12.76,7.95 -13.46,7.95 Q-14.23,7.95 -14.85,7.98 Q-15.48,8.00 -16.00,8.00 Q-16.08,8.00 -16.08,7.86 Q-16.08,7.71 -16.00,7.71 Q-15.02,7.71 -14.44,6.97 Q-13.87,6.22 -13.84,4.95 ZM3.34,7.71 Q3.39,7.71 3.39,7.86 Q3.39,8.00 3.34,8.00 Q2.72,8.00 1.92,7.98 Q1.13,7.95 0.27,7.95 Q-0.62,7.95 -1.39,7.98 Q-2.16,8.00 -2.78,8.00 Q-2.85,8.00 -2.85,7.86 Q-2.85,7.71 -2.78,7.71 Q-1.65,7.71 -1.33,7.40 Q-1.00,7.09 -1.08,6.06 L-1.63,-4.60 L-0.40,-6.52 L-6.52,7.83 Q-6.55,7.93 -6.70,7.93 Q-6.86,7.93 -6.91,7.83 L-13.65,-5.01 Q-14.56,-6.71 -15.84,-6.71 Q-15.91,-6.71 -15.91,-6.86 Q-15.91,-7.00 -15.84,-7.00 Q-15.33,-7.00 -14.78,-6.98 Q-14.23,-6.95 -13.84,-6.95 Q-13.22,-6.95 -12.75,-6.98 Q-12.28,-7.00 -12.02,-7.00 Q-11.68,-7.00 -11.50,-6.76 Q-11.32,-6.52 -10.92,-5.75 L-5.54,4.33 L-6.74,6.49 L-1.12,-6.40 Q-0.98,-6.74 -0.82,-6.87 Q-0.67,-7.00 -0.40,-7.00 Q-0.16,-7.00 0.10,-6.98 Q0.36,-6.95 0.72,-6.95 Q1.49,-6.95 2.03,-6.98 Q2.57,-7.00 3.10,-7.00 Q3.17,-7.00 3.17,-6.86 Q3.17,-6.71 3.10,-6.71 Q2.00,-6.71 1.48,-6.26 Q0.96,-5.80 1.01,-4.84 L1.59,6.06 Q1.64,6.75 1.77,7.11 Q1.90,7.47 2.26,7.59 Q2.62,7.71 3.34,7.71 ZM12.02,-0.42 Q12.28,-1.02 12.46,-1.64 Q12.64,-2.25 12.64,-2.87 Q12.64,-3.95 12.10,-4.61 Q11.56,-5.27 10.84,-5.27 Q10.17,-5.27 9.78,-4.83 Q9.38,-4.38 9.38,-3.71 Q9.38,-2.97 9.84,-2.37 Q10.29,-1.77 11.01,-1.28 Q11.73,-0.78 12.52,-0.28 Q13.39,0.25 14.19,0.84 Q15.00,1.42 15.51,2.20 Q16.03,2.98 16.03,4.06 Q16.03,5.31 15.30,6.27 Q14.56,7.23 13.35,7.77 Q12.14,8.31 10.70,8.31 Q9.21,8.31 8.11,7.76 Q7.00,7.21 6.40,6.31 Q5.80,5.41 5.80,4.33 Q5.80,3.32 6.32,2.41 Q6.84,1.50 7.78,0.76 Q8.73,0.03 10.00,-0.38 L10.15,-0.16 Q9.31,0.37 8.79,1.40 Q8.28,2.43 8.28,3.68 Q8.28,4.76 8.67,5.70 Q9.07,6.63 9.76,7.21 Q10.46,7.78 11.35,7.78 Q12.14,7.78 12.69,7.39 Q13.24,6.99 13.53,6.36 Q13.82,5.72 13.82,5.02 Q13.82,4.06 13.32,3.40 Q12.81,2.74 12.04,2.22 Q11.28,1.69 10.44,1.18 Q9.64,0.68 8.92,0.13 Q8.20,-0.42 7.74,-1.13 Q7.27,-1.84 7.27,-2.75 Q7.27,-3.86 7.88,-4.52 Q8.49,-5.18 9.38,-5.48 Q10.27,-5.78 11.08,-5.78 Q12.24,-5.78 13.04,-5.39 Q13.84,-5.01 14.26,-4.43 Q14.68,-3.86 14.68,-3.28 Q14.68,-2.54 14.04,-1.66 Q13.39,-0.78 12.16,-0.28 L12.02,-0.42 Z"/></g>
  </g>
</svg>
