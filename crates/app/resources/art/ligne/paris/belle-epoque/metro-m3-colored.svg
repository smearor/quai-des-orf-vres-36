<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#837902" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#BBB574" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-12.70,4.95 L-12.46,-6.45 L-11.77,-6.40 L-12.03,4.95 Q-12.06,6.22 -11.52,6.97 Q-10.98,7.71 -9.99,7.71 Q-9.92,7.71 -9.92,7.86 Q-9.92,8.00 -9.99,8.00 Q-10.52,8.00 -11.07,7.98 Q-11.62,7.95 -12.32,7.95 Q-13.09,7.95 -13.71,7.98 Q-14.34,8.00 -14.86,8.00 Q-14.94,8.00 -14.94,7.86 Q-14.94,7.71 -14.86,7.71 Q-13.88,7.71 -13.30,6.97 Q-12.73,6.22 -12.70,4.95 ZM4.48,7.71 Q4.53,7.71 4.53,7.86 Q4.53,8.00 4.48,8.00 Q3.86,8.00 3.06,7.98 Q2.27,7.95 1.41,7.95 Q0.52,7.95 -0.25,7.98 Q-1.02,8.00 -1.64,8.00 Q-1.71,8.00 -1.71,7.86 Q-1.71,7.71 -1.64,7.71 Q-0.51,7.71 -0.19,7.40 Q0.14,7.09 0.06,6.06 L-0.49,-4.60 L0.74,-6.52 L-5.38,7.83 Q-5.41,7.93 -5.56,7.93 Q-5.72,7.93 -5.77,7.83 L-12.51,-5.01 Q-13.42,-6.71 -14.70,-6.71 Q-14.77,-6.71 -14.77,-6.86 Q-14.77,-7.00 -14.70,-7.00 Q-14.19,-7.00 -13.64,-6.98 Q-13.09,-6.95 -12.70,-6.95 Q-12.08,-6.95 -11.61,-6.98 Q-11.14,-7.00 -10.88,-7.00 Q-10.54,-7.00 -10.36,-6.76 Q-10.18,-6.52 -9.78,-5.75 L-4.40,4.33 L-5.60,6.49 L0.02,-6.40 Q0.16,-6.74 0.32,-6.87 Q0.47,-7.00 0.74,-7.00 Q0.98,-7.00 1.24,-6.98 Q1.50,-6.95 1.86,-6.95 Q2.63,-6.95 3.17,-6.98 Q3.71,-7.00 4.24,-7.00 Q4.31,-7.00 4.31,-6.86 Q4.31,-6.71 4.24,-6.71 Q3.14,-6.71 2.62,-6.26 Q2.10,-5.80 2.15,-4.84 L2.73,6.06 Q2.78,6.75 2.91,7.11 Q3.04,7.47 3.40,7.59 Q3.76,7.71 4.48,7.71 ZM7.35,14.60 Q7.26,14.62 7.20,14.50 Q7.14,14.38 7.23,14.34 Q8.67,13.76 9.62,13.04 Q10.57,12.32 11.13,11.54 Q11.70,10.76 11.92,10.00 Q12.15,9.25 12.15,8.60 Q12.15,7.66 11.83,6.96 Q11.50,6.25 10.90,5.86 Q10.30,5.48 9.49,5.48 Q9.25,5.48 9.01,5.52 Q8.77,5.55 8.50,5.62 Q8.43,5.65 8.38,5.50 Q8.34,5.36 8.41,5.34 Q10.04,4.90 10.83,4.04 Q11.62,3.18 11.62,1.57 Q11.62,0.39 11.28,-0.26 Q10.93,-0.90 10.21,-0.90 Q9.20,-0.90 8.38,-0.22 Q7.57,0.46 7.02,1.81 Q6.99,1.86 6.85,1.83 Q6.70,1.81 6.73,1.74 L7.62,-1.77 Q7.66,-1.84 7.80,-1.80 Q7.93,-1.77 7.90,-1.72 Q7.81,-1.31 7.95,-1.18 Q8.10,-1.05 8.26,-1.05 Q8.67,-1.05 9.36,-1.31 Q10.04,-1.58 11.00,-1.58 Q12.51,-1.58 13.28,-0.74 Q14.05,0.10 14.05,1.16 Q14.05,2.05 13.62,2.88 Q13.18,3.70 12.37,4.30 Q11.55,4.90 10.40,5.14 L10.42,4.76 Q11.96,4.81 12.92,5.32 Q13.88,5.84 14.32,6.62 Q14.77,7.40 14.77,8.29 Q14.77,9.37 13.99,10.54 Q13.21,11.72 11.56,12.78 Q9.92,13.83 7.35,14.60 Z"/></g>
  </g>
</svg>
