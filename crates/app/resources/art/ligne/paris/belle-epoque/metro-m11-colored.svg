<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#704B1C" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#B09C82" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-16.44,4.95 L-16.20,-6.45 L-15.51,-6.40 L-15.77,4.95 Q-15.80,6.22 -15.26,6.97 Q-14.72,7.71 -13.73,7.71 Q-13.66,7.71 -13.66,7.86 Q-13.66,8.00 -13.73,8.00 Q-14.26,8.00 -14.81,7.98 Q-15.36,7.95 -16.06,7.95 Q-16.83,7.95 -17.45,7.98 Q-18.08,8.00 -18.60,8.00 Q-18.68,8.00 -18.68,7.86 Q-18.68,7.71 -18.60,7.71 Q-17.62,7.71 -17.04,6.97 Q-16.47,6.22 -16.44,4.95 ZM0.74,7.71 Q0.79,7.71 0.79,7.86 Q0.79,8.00 0.74,8.00 Q0.12,8.00 -0.68,7.98 Q-1.47,7.95 -2.33,7.95 Q-3.22,7.95 -3.99,7.98 Q-4.76,8.00 -5.38,8.00 Q-5.45,8.00 -5.45,7.86 Q-5.45,7.71 -5.38,7.71 Q-4.25,7.71 -3.93,7.40 Q-3.60,7.09 -3.68,6.06 L-4.23,-4.60 L-3.00,-6.52 L-9.12,7.83 Q-9.15,7.93 -9.30,7.93 Q-9.46,7.93 -9.51,7.83 L-16.25,-5.01 Q-17.16,-6.71 -18.44,-6.71 Q-18.51,-6.71 -18.51,-6.86 Q-18.51,-7.00 -18.44,-7.00 Q-17.93,-7.00 -17.38,-6.98 Q-16.83,-6.95 -16.44,-6.95 Q-15.82,-6.95 -15.35,-6.98 Q-14.88,-7.00 -14.62,-7.00 Q-14.28,-7.00 -14.10,-6.76 Q-13.92,-6.52 -13.52,-5.75 L-8.14,4.33 L-9.34,6.49 L-3.72,-6.40 Q-3.58,-6.74 -3.42,-6.87 Q-3.27,-7.00 -3.00,-7.00 Q-2.76,-7.00 -2.50,-6.98 Q-2.24,-6.95 -1.88,-6.95 Q-1.11,-6.95 -0.57,-6.98 Q-0.03,-7.00 0.50,-7.00 Q0.57,-7.00 0.57,-6.86 Q0.57,-6.71 0.50,-6.71 Q-0.60,-6.71 -1.12,-6.26 Q-1.64,-5.80 -1.59,-4.84 L-1.01,6.06 Q-0.96,6.75 -0.83,7.11 Q-0.70,7.47 -0.34,7.59 Q0.02,7.71 0.74,7.71 ZM5.17,0.68 Q5.17,-0.02 5.05,-0.38 Q4.93,-0.74 4.54,-0.86 Q4.14,-0.98 3.32,-0.98 Q3.28,-0.98 3.28,-1.12 Q3.28,-1.26 3.32,-1.26 Q3.95,-1.26 4.69,-1.24 Q5.44,-1.22 6.30,-1.22 Q7.14,-1.22 7.91,-1.24 Q8.68,-1.26 9.28,-1.26 Q9.35,-1.26 9.35,-1.12 Q9.35,-0.98 9.28,-0.98 Q8.51,-0.98 8.11,-0.86 Q7.72,-0.74 7.57,-0.38 Q7.43,-0.02 7.43,0.68 L7.43,6.06 Q7.43,6.75 7.55,7.11 Q7.67,7.47 8.06,7.59 Q8.46,7.71 9.28,7.71 Q9.35,7.71 9.35,7.86 Q9.35,8.00 9.28,8.00 Q8.68,8.00 7.92,7.98 Q7.16,7.95 6.30,7.95 Q5.46,7.95 4.70,7.98 Q3.95,8.00 3.32,8.00 Q3.28,8.00 3.28,7.86 Q3.28,7.71 3.32,7.71 Q4.09,7.71 4.49,7.59 Q4.88,7.47 5.03,7.11 Q5.17,6.75 5.17,6.06 L5.17,0.68 ZM14.14,0.68 Q14.14,-0.02 14.02,-0.38 Q13.90,-0.74 13.50,-0.86 Q13.11,-0.98 12.29,-0.98 Q12.24,-0.98 12.24,-1.12 Q12.24,-1.26 12.29,-1.26 Q12.92,-1.26 13.66,-1.24 Q14.40,-1.22 15.27,-1.22 Q16.11,-1.22 16.88,-1.24 Q17.64,-1.26 18.24,-1.26 Q18.32,-1.26 18.32,-1.12 Q18.32,-0.98 18.24,-0.98 Q17.48,-0.98 17.08,-0.86 Q16.68,-0.74 16.54,-0.38 Q16.40,-0.02 16.40,0.68 L16.40,6.06 Q16.40,6.75 16.52,7.11 Q16.64,7.47 17.03,7.59 Q17.43,7.71 18.24,7.71 Q18.32,7.71 18.32,7.86 Q18.32,8.00 18.24,8.00 Q17.64,8.00 16.89,7.98 Q16.13,7.95 15.27,7.95 Q14.43,7.95 13.67,7.98 Q12.92,8.00 12.29,8.00 Q12.24,8.00 12.24,7.86 Q12.24,7.71 12.29,7.71 Q13.06,7.71 13.46,7.59 Q13.85,7.47 14.00,7.11 Q14.14,6.75 14.14,6.06 L14.14,0.68 Z"/></g>
  </g>
</svg>
