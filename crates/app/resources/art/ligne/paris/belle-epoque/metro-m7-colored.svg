<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#FA9ABA" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#FA9ABA" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-13.12,4.95 L-12.88,-6.45 L-12.19,-6.40 L-12.45,4.95 Q-12.48,6.22 -11.94,6.97 Q-11.40,7.71 -10.41,7.71 Q-10.34,7.71 -10.34,7.86 Q-10.34,8.00 -10.41,8.00 Q-10.94,8.00 -11.49,7.98 Q-12.04,7.95 -12.74,7.95 Q-13.51,7.95 -14.13,7.98 Q-14.76,8.00 -15.28,8.00 Q-15.36,8.00 -15.36,7.86 Q-15.36,7.71 -15.28,7.71 Q-14.30,7.71 -13.72,6.97 Q-13.15,6.22 -13.12,4.95 ZM4.06,7.71 Q4.11,7.71 4.11,7.86 Q4.11,8.00 4.06,8.00 Q3.44,8.00 2.64,7.98 Q1.85,7.95 0.99,7.95 Q0.10,7.95 -0.67,7.98 Q-1.44,8.00 -2.06,8.00 Q-2.13,8.00 -2.13,7.86 Q-2.13,7.71 -2.06,7.71 Q-0.93,7.71 -0.61,7.40 Q-0.28,7.09 -0.36,6.06 L-0.91,-4.60 L0.32,-6.52 L-5.80,7.83 Q-5.83,7.93 -5.98,7.93 Q-6.14,7.93 -6.19,7.83 L-12.93,-5.01 Q-13.84,-6.71 -15.12,-6.71 Q-15.19,-6.71 -15.19,-6.86 Q-15.19,-7.00 -15.12,-7.00 Q-14.61,-7.00 -14.06,-6.98 Q-13.51,-6.95 -13.12,-6.95 Q-12.50,-6.95 -12.03,-6.98 Q-11.56,-7.00 -11.30,-7.00 Q-10.96,-7.00 -10.78,-6.76 Q-10.60,-6.52 -10.20,-5.75 L-4.82,4.33 L-6.02,6.49 L-0.40,-6.40 Q-0.26,-6.74 -0.10,-6.87 Q0.05,-7.00 0.32,-7.00 Q0.56,-7.00 0.82,-6.98 Q1.08,-6.95 1.44,-6.95 Q2.21,-6.95 2.75,-6.98 Q3.29,-7.00 3.82,-7.00 Q3.89,-7.00 3.89,-6.86 Q3.89,-6.71 3.82,-6.71 Q2.72,-6.71 2.20,-6.26 Q1.68,-5.80 1.73,-4.84 L2.31,6.06 Q2.36,6.75 2.49,7.11 Q2.62,7.47 2.98,7.59 Q3.34,7.71 4.06,7.71 ZM9.88,13.09 Q9.79,13.33 9.68,13.46 Q9.57,13.59 9.38,13.66 L7.41,14.60 Q7.34,14.62 7.28,14.55 Q7.22,14.48 7.24,14.43 L13.48,1.02 Q13.58,0.85 13.39,0.85 Q11.44,0.85 10.20,0.87 Q8.95,0.90 8.20,0.99 Q7.46,1.09 7.08,1.27 Q6.69,1.45 6.52,1.74 Q6.36,2.02 6.24,2.48 Q6.21,2.55 6.07,2.53 Q5.92,2.50 5.95,2.41 L7.03,-1.91 Q7.08,-1.96 7.21,-1.95 Q7.34,-1.94 7.32,-1.89 Q7.22,-1.48 7.44,-1.37 Q7.65,-1.26 8.44,-1.26 Q8.80,-1.26 9.55,-1.26 Q10.29,-1.26 11.23,-1.26 Q12.16,-1.26 13.11,-1.26 Q14.06,-1.26 14.80,-1.26 Q14.92,-1.26 15.00,-1.16 Q15.07,-1.05 15.02,-0.95 L9.88,13.09 Z"/></g>
  </g>
</svg>
