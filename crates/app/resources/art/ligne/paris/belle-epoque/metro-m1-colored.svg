<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#FFCD00" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#FFCD00" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-11.96,4.95 L-11.72,-6.45 L-11.02,-6.40 L-11.29,4.95 Q-11.31,6.22 -10.77,6.97 Q-10.23,7.71 -9.25,7.71 Q-9.18,7.71 -9.18,7.86 Q-9.18,8.00 -9.25,8.00 Q-9.78,8.00 -10.33,7.98 Q-10.88,7.95 -11.58,7.95 Q-12.34,7.95 -12.97,7.98 Q-13.59,8.00 -14.12,8.00 Q-14.19,8.00 -14.19,7.86 Q-14.19,7.71 -14.12,7.71 Q-13.14,7.71 -12.56,6.97 Q-11.98,6.22 -11.96,4.95 ZM5.22,7.71 Q5.27,7.71 5.27,7.86 Q5.27,8.00 5.22,8.00 Q4.60,8.00 3.81,7.98 Q3.02,7.95 2.15,7.95 Q1.26,7.95 0.50,7.98 Q-0.27,8.00 -0.90,8.00 Q-0.97,8.00 -0.97,7.86 Q-0.97,7.71 -0.90,7.71 Q0.23,7.71 0.56,7.40 Q0.88,7.09 0.81,6.06 L0.26,-4.60 L1.48,-6.52 L-4.64,7.83 Q-4.66,7.93 -4.82,7.93 Q-4.98,7.93 -5.02,7.83 L-11.77,-5.01 Q-12.68,-6.71 -13.95,-6.71 Q-14.02,-6.71 -14.02,-6.86 Q-14.02,-7.00 -13.95,-7.00 Q-13.45,-7.00 -12.90,-6.98 Q-12.34,-6.95 -11.96,-6.95 Q-11.34,-6.95 -10.87,-6.98 Q-10.40,-7.00 -10.14,-7.00 Q-9.80,-7.00 -9.62,-6.76 Q-9.44,-6.52 -9.03,-5.75 L-3.66,4.33 L-4.86,6.49 L0.76,-6.40 Q0.90,-6.74 1.06,-6.87 Q1.22,-7.00 1.48,-7.00 Q1.72,-7.00 1.98,-6.98 Q2.25,-6.95 2.61,-6.95 Q3.38,-6.95 3.92,-6.98 Q4.46,-7.00 4.98,-7.00 Q5.06,-7.00 5.06,-6.86 Q5.06,-6.71 4.98,-6.71 Q3.88,-6.71 3.36,-6.26 Q2.85,-5.80 2.90,-4.84 L3.47,6.06 Q3.52,6.75 3.65,7.11 Q3.78,7.47 4.14,7.59 Q4.50,7.71 5.22,7.71 ZM9.66,0.68 Q9.66,-0.02 9.54,-0.38 Q9.42,-0.74 9.02,-0.86 Q8.62,-0.98 7.81,-0.98 Q7.76,-0.98 7.76,-1.12 Q7.76,-1.26 7.81,-1.26 Q8.43,-1.26 9.18,-1.24 Q9.92,-1.22 10.78,-1.22 Q11.62,-1.22 12.39,-1.24 Q13.16,-1.26 13.76,-1.26 Q13.83,-1.26 13.83,-1.12 Q13.83,-0.98 13.76,-0.98 Q12.99,-0.98 12.60,-0.86 Q12.20,-0.74 12.06,-0.38 Q11.91,-0.02 11.91,0.68 L11.91,6.06 Q11.91,6.75 12.03,7.11 Q12.15,7.47 12.55,7.59 Q12.94,7.71 13.76,7.71 Q13.83,7.71 13.83,7.86 Q13.83,8.00 13.76,8.00 Q13.16,8.00 12.40,7.98 Q11.65,7.95 10.78,7.95 Q9.94,7.95 9.19,7.98 Q8.43,8.00 7.81,8.00 Q7.76,8.00 7.76,7.86 Q7.76,7.71 7.81,7.71 Q8.58,7.71 8.97,7.59 Q9.37,7.47 9.51,7.11 Q9.66,6.75 9.66,6.06 L9.66,0.68 Z"/></g>
  </g>
</svg>
