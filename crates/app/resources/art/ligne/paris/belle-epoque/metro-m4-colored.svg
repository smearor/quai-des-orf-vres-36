<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#BE418D" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#DB97C0" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-13.45,4.95 L-13.21,-6.45 L-12.51,-6.40 L-12.78,4.95 Q-12.80,6.22 -12.26,6.97 Q-11.72,7.71 -10.74,7.71 Q-10.66,7.71 -10.66,7.86 Q-10.66,8.00 -10.74,8.00 Q-11.26,8.00 -11.82,7.98 Q-12.37,7.95 -13.06,7.95 Q-13.83,7.95 -14.46,7.98 Q-15.08,8.00 -15.61,8.00 Q-15.68,8.00 -15.68,7.86 Q-15.68,7.71 -15.61,7.71 Q-14.62,7.71 -14.05,6.97 Q-13.47,6.22 -13.45,4.95 ZM3.74,7.71 Q3.78,7.71 3.78,7.86 Q3.78,8.00 3.74,8.00 Q3.11,8.00 2.32,7.98 Q1.53,7.95 0.66,7.95 Q-0.22,7.95 -0.99,7.98 Q-1.76,8.00 -2.38,8.00 Q-2.46,8.00 -2.46,7.86 Q-2.46,7.71 -2.38,7.71 Q-1.26,7.71 -0.93,7.40 Q-0.61,7.09 -0.68,6.06 L-1.23,-4.60 L-0.01,-6.52 L-6.13,7.83 Q-6.15,7.93 -6.31,7.93 Q-6.46,7.93 -6.51,7.83 L-13.26,-5.01 Q-14.17,-6.71 -15.44,-6.71 Q-15.51,-6.71 -15.51,-6.86 Q-15.51,-7.00 -15.44,-7.00 Q-14.94,-7.00 -14.38,-6.98 Q-13.83,-6.95 -13.45,-6.95 Q-12.82,-6.95 -12.36,-6.98 Q-11.89,-7.00 -11.62,-7.00 Q-11.29,-7.00 -11.11,-6.76 Q-10.93,-6.52 -10.52,-5.75 L-5.14,4.33 L-6.34,6.49 L-0.73,-6.40 Q-0.58,-6.74 -0.43,-6.87 Q-0.27,-7.00 -0.01,-7.00 Q0.23,-7.00 0.50,-6.98 Q0.76,-6.95 1.12,-6.95 Q1.89,-6.95 2.43,-6.98 Q2.97,-7.00 3.50,-7.00 Q3.57,-7.00 3.57,-6.86 Q3.57,-6.71 3.50,-6.71 Q2.39,-6.71 1.88,-6.26 Q1.36,-5.80 1.41,-4.84 L1.98,6.06 Q2.03,6.75 2.16,7.11 Q2.30,7.47 2.66,7.59 Q3.02,7.71 3.74,7.71 ZM6.13,7.81 Q6.03,7.81 5.95,7.71 Q5.86,7.62 5.96,7.52 L13.40,-1.50 Q13.45,-1.58 13.60,-1.55 Q13.76,-1.53 13.76,-1.41 L13.76,11.24 Q13.76,11.48 13.57,11.58 L11.67,12.51 Q11.46,12.63 11.46,12.37 L11.46,1.33 L13.35,-0.11 L7.45,6.82 Q7.38,6.92 7.42,6.96 Q7.47,6.99 7.57,6.99 Q8.86,6.99 9.90,6.98 Q10.93,6.97 11.82,6.96 Q12.70,6.94 13.57,6.91 Q14.43,6.87 15.39,6.85 Q15.46,6.85 15.48,7.12 Q15.49,7.40 15.45,7.69 Q15.42,7.98 15.34,7.98 Q14.43,7.93 13.48,7.89 Q12.54,7.86 11.46,7.84 Q10.38,7.83 9.07,7.82 Q7.76,7.81 6.13,7.81 Z"/></g>
  </g>
</svg>
