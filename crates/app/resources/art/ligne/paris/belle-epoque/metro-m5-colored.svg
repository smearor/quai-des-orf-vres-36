<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#FF7E2E" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#FF7E2E" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-12.88,4.95 L-12.64,-6.45 L-11.95,-6.40 L-12.21,4.95 Q-12.24,6.22 -11.70,6.97 Q-11.16,7.71 -10.17,7.71 Q-10.10,7.71 -10.10,7.86 Q-10.10,8.00 -10.17,8.00 Q-10.70,8.00 -11.25,7.98 Q-11.80,7.95 -12.50,7.95 Q-13.27,7.95 -13.89,7.98 Q-14.52,8.00 -15.04,8.00 Q-15.12,8.00 -15.12,7.86 Q-15.12,7.71 -15.04,7.71 Q-14.06,7.71 -13.48,6.97 Q-12.91,6.22 -12.88,4.95 ZM4.30,7.71 Q4.35,7.71 4.35,7.86 Q4.35,8.00 4.30,8.00 Q3.68,8.00 2.88,7.98 Q2.09,7.95 1.23,7.95 Q0.34,7.95 -0.43,7.98 Q-1.20,8.00 -1.82,8.00 Q-1.89,8.00 -1.89,7.86 Q-1.89,7.71 -1.82,7.71 Q-0.69,7.71 -0.37,7.40 Q-0.04,7.09 -0.12,6.06 L-0.67,-4.60 L0.56,-6.52 L-5.56,7.83 Q-5.59,7.93 -5.74,7.93 Q-5.90,7.93 -5.95,7.83 L-12.69,-5.01 Q-13.60,-6.71 -14.88,-6.71 Q-14.95,-6.71 -14.95,-6.86 Q-14.95,-7.00 -14.88,-7.00 Q-14.37,-7.00 -13.82,-6.98 Q-13.27,-6.95 -12.88,-6.95 Q-12.26,-6.95 -11.79,-6.98 Q-11.32,-7.00 -11.06,-7.00 Q-10.72,-7.00 -10.54,-6.76 Q-10.36,-6.52 -9.96,-5.75 L-4.58,4.33 L-5.78,6.49 L-0.16,-6.40 Q-0.02,-6.74 0.14,-6.87 Q0.29,-7.00 0.56,-7.00 Q0.80,-7.00 1.06,-6.98 Q1.32,-6.95 1.68,-6.95 Q2.45,-6.95 2.99,-6.98 Q3.53,-7.00 4.06,-7.00 Q4.13,-7.00 4.13,-6.86 Q4.13,-6.71 4.06,-6.71 Q2.96,-6.71 2.44,-6.26 Q1.92,-5.80 1.97,-4.84 L2.55,6.06 Q2.60,6.75 2.73,7.11 Q2.86,7.47 3.22,7.59 Q3.58,7.71 4.30,7.71 ZM7.75,3.30 Q10.20,3.30 11.68,3.87 Q13.17,4.45 13.84,5.46 Q14.52,6.46 14.52,7.78 Q14.52,9.15 13.80,10.27 Q13.08,11.38 11.54,12.43 Q10.00,13.47 7.51,14.60 Q7.41,14.62 7.34,14.50 Q7.27,14.38 7.36,14.34 Q9.19,13.30 10.21,12.28 Q11.23,11.26 11.64,10.24 Q12.04,9.22 12.04,8.19 Q12.04,6.22 10.88,5.11 Q9.72,3.99 7.51,3.99 Q7.22,3.99 7.27,3.70 L8.04,-0.57 Q8.06,-0.74 8.11,-0.77 Q8.16,-0.81 8.35,-0.83 Q10.41,-1.07 11.56,-1.23 Q12.72,-1.38 13.24,-1.49 Q13.77,-1.60 13.93,-1.76 Q14.08,-1.91 14.16,-2.15 Q14.18,-2.22 14.31,-2.21 Q14.44,-2.20 14.42,-2.10 L13.94,0.56 Q13.87,0.85 13.72,0.92 Q13.58,0.99 13.27,0.99 L8.71,1.09 Q8.40,1.09 8.35,1.42 L7.92,3.75 L7.75,3.30 Z"/></g>
  </g>
</svg>
