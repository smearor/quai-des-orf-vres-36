<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#B6BD00" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#B6BD00" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-13.56,4.95 L-13.32,-6.45 L-12.62,-6.40 L-12.88,4.95 Q-12.91,6.22 -12.37,6.97 Q-11.83,7.71 -10.84,7.71 Q-10.77,7.71 -10.77,7.86 Q-10.77,8.00 -10.84,8.00 Q-11.37,8.00 -11.92,7.98 Q-12.48,7.95 -13.17,7.95 Q-13.94,7.95 -14.56,7.98 Q-15.19,8.00 -15.72,8.00 Q-15.79,8.00 -15.79,7.86 Q-15.79,7.71 -15.72,7.71 Q-14.73,7.71 -14.16,6.97 Q-13.58,6.22 -13.56,4.95 ZM3.63,7.71 Q3.68,7.71 3.68,7.86 Q3.68,8.00 3.63,8.00 Q3.00,8.00 2.21,7.98 Q1.42,7.95 0.56,7.95 Q-0.33,7.95 -1.10,7.98 Q-1.87,8.00 -2.49,8.00 Q-2.56,8.00 -2.56,7.86 Q-2.56,7.71 -2.49,7.71 Q-1.36,7.71 -1.04,7.40 Q-0.72,7.09 -0.79,6.06 L-1.34,-4.60 L-0.12,-6.52 L-6.24,7.83 Q-6.26,7.93 -6.42,7.93 Q-6.57,7.93 -6.62,7.83 L-13.36,-5.01 Q-14.28,-6.71 -15.55,-6.71 Q-15.62,-6.71 -15.62,-6.86 Q-15.62,-7.00 -15.55,-7.00 Q-15.04,-7.00 -14.49,-6.98 Q-13.94,-6.95 -13.56,-6.95 Q-12.93,-6.95 -12.46,-6.98 Q-12.00,-7.00 -11.73,-7.00 Q-11.40,-7.00 -11.22,-6.76 Q-11.04,-6.52 -10.63,-5.75 L-5.25,4.33 L-6.45,6.49 L-0.84,-6.40 Q-0.69,-6.74 -0.54,-6.87 Q-0.38,-7.00 -0.12,-7.00 Q0.12,-7.00 0.39,-6.98 Q0.65,-6.95 1.01,-6.95 Q1.78,-6.95 2.32,-6.98 Q2.86,-7.00 3.39,-7.00 Q3.46,-7.00 3.46,-6.86 Q3.46,-6.71 3.39,-6.71 Q2.28,-6.71 1.77,-6.26 Q1.25,-5.80 1.30,-4.84 L1.88,6.06 Q1.92,6.75 2.06,7.11 Q2.19,7.47 2.55,7.59 Q2.91,7.71 3.63,7.71 ZM9.14,5.50 Q7.94,5.50 7.21,4.98 Q6.48,4.45 6.15,3.68 Q5.83,2.91 5.83,2.17 Q5.83,1.06 6.39,0.22 Q6.96,-0.62 7.98,-1.10 Q9.00,-1.58 10.34,-1.58 Q11.95,-1.58 13.09,-0.90 Q14.23,-0.23 14.85,0.98 Q15.48,2.19 15.48,3.87 Q15.48,5.48 14.90,7.10 Q14.32,8.72 13.21,10.20 Q12.09,11.67 10.47,12.81 Q8.85,13.95 6.76,14.60 Q6.69,14.62 6.63,14.50 Q6.57,14.38 6.67,14.34 Q8.28,13.59 9.46,12.45 Q10.65,11.31 11.44,9.93 Q12.24,8.55 12.63,7.10 Q13.03,5.65 13.03,4.30 Q13.03,3.46 12.87,2.54 Q12.72,1.62 12.37,0.79 Q12.02,-0.04 11.43,-0.56 Q10.84,-1.07 10.00,-1.07 Q9.04,-1.07 8.65,-0.34 Q8.25,0.39 8.25,1.57 Q8.25,2.89 8.74,3.73 Q9.24,4.57 10.27,4.57 Q10.70,4.57 11.10,4.39 Q11.49,4.21 11.97,3.82 Q12.02,3.75 12.14,3.84 Q12.26,3.92 12.21,3.99 Q11.06,5.50 9.14,5.50 Z"/></g>
  </g>
</svg>
