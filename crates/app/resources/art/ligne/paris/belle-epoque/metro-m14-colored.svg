<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#62259D" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#A987C9" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-17.93,4.95 L-17.69,-6.45 L-17.00,-6.40 L-17.26,4.95 Q-17.28,6.22 -16.74,6.97 Q-16.20,7.71 -15.22,7.71 Q-15.15,7.71 -15.15,7.86 Q-15.15,8.00 -15.22,8.00 Q-15.75,8.00 -16.30,7.98 Q-16.85,7.95 -17.55,7.95 Q-18.32,7.95 -18.94,7.98 Q-19.56,8.00 -20.09,8.00 Q-20.16,8.00 -20.16,7.86 Q-20.16,7.71 -20.09,7.71 Q-19.11,7.71 -18.53,6.97 Q-17.96,6.22 -17.93,4.95 ZM-0.75,7.71 Q-0.70,7.71 -0.70,7.86 Q-0.70,8.00 -0.75,8.00 Q-1.37,8.00 -2.16,7.98 Q-2.96,7.95 -3.82,7.95 Q-4.71,7.95 -5.48,7.98 Q-6.24,8.00 -6.87,8.00 Q-6.94,8.00 -6.94,7.86 Q-6.94,7.71 -6.87,7.71 Q-5.74,7.71 -5.42,7.40 Q-5.09,7.09 -5.16,6.06 L-5.72,-4.60 L-4.49,-6.52 L-10.61,7.83 Q-10.64,7.93 -10.79,7.93 Q-10.95,7.93 -11.00,7.83 L-17.74,-5.01 Q-18.65,-6.71 -19.92,-6.71 Q-20.00,-6.71 -20.00,-6.86 Q-20.00,-7.00 -19.92,-7.00 Q-19.42,-7.00 -18.87,-6.98 Q-18.32,-6.95 -17.93,-6.95 Q-17.31,-6.95 -16.84,-6.98 Q-16.37,-7.00 -16.11,-7.00 Q-15.77,-7.00 -15.59,-6.76 Q-15.41,-6.52 -15.00,-5.75 L-9.63,4.33 L-10.83,6.49 L-5.21,-6.40 Q-5.07,-6.74 -4.91,-6.87 Q-4.76,-7.00 -4.49,-7.00 Q-4.25,-7.00 -3.99,-6.98 Q-3.72,-6.95 -3.36,-6.95 Q-2.60,-6.95 -2.06,-6.98 Q-1.52,-7.00 -0.99,-7.00 Q-0.92,-7.00 -0.92,-6.86 Q-0.92,-6.71 -0.99,-6.71 Q-2.09,-6.71 -2.61,-6.26 Q-3.12,-5.80 -3.08,-4.84 L-2.50,6.06 Q-2.45,6.75 -2.32,7.11 Q-2.19,7.47 -1.83,7.59 Q-1.47,7.71 -0.75,7.71 ZM3.68,0.68 Q3.68,-0.02 3.56,-0.38 Q3.44,-0.74 3.05,-0.86 Q2.65,-0.98 1.84,-0.98 Q1.79,-0.98 1.79,-1.12 Q1.79,-1.26 1.84,-1.26 Q2.46,-1.26 3.20,-1.24 Q3.95,-1.22 4.81,-1.22 Q5.65,-1.22 6.42,-1.24 Q7.19,-1.26 7.79,-1.26 Q7.86,-1.26 7.86,-1.12 Q7.86,-0.98 7.79,-0.98 Q7.02,-0.98 6.62,-0.86 Q6.23,-0.74 6.08,-0.38 Q5.94,-0.02 5.94,0.68 L5.94,6.06 Q5.94,6.75 6.06,7.11 Q6.18,7.47 6.58,7.59 Q6.97,7.71 7.79,7.71 Q7.86,7.71 7.86,7.86 Q7.86,8.00 7.79,8.00 Q7.19,8.00 6.43,7.98 Q5.68,7.95 4.81,7.95 Q3.97,7.95 3.22,7.98 Q2.46,8.00 1.84,8.00 Q1.79,8.00 1.79,7.86 Q1.79,7.71 1.84,7.71 Q2.60,7.71 3.00,7.59 Q3.40,7.47 3.54,7.11 Q3.68,6.75 3.68,6.06 L3.68,0.68 ZM10.61,7.81 Q10.52,7.81 10.43,7.71 Q10.35,7.62 10.44,7.52 L17.88,-1.50 Q17.93,-1.58 18.09,-1.55 Q18.24,-1.53 18.24,-1.41 L18.24,11.24 Q18.24,11.48 18.05,11.58 L16.16,12.51 Q15.94,12.63 15.94,12.37 L15.94,1.33 L17.84,-0.11 L11.93,6.82 Q11.86,6.92 11.91,6.96 Q11.96,6.99 12.05,6.99 Q13.35,6.99 14.38,6.98 Q15.41,6.97 16.30,6.96 Q17.19,6.94 18.05,6.91 Q18.92,6.87 19.88,6.85 Q19.95,6.85 19.96,7.12 Q19.97,7.40 19.94,7.69 Q19.90,7.98 19.83,7.98 Q18.92,7.93 17.97,7.89 Q17.02,7.86 15.94,7.84 Q14.86,7.83 13.55,7.82 Q12.24,7.81 10.61,7.81 Z"/></g>
  </g>
</svg>
