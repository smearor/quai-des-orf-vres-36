<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#007852" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#73B5A0" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-17.28,4.95 L-17.04,-6.45 L-16.35,-6.40 L-16.61,4.95 Q-16.64,6.22 -16.10,6.97 Q-15.56,7.71 -14.57,7.71 Q-14.50,7.71 -14.50,7.86 Q-14.50,8.00 -14.57,8.00 Q-15.10,8.00 -15.65,7.98 Q-16.20,7.95 -16.90,7.95 Q-17.67,7.95 -18.29,7.98 Q-18.92,8.00 -19.44,8.00 Q-19.52,8.00 -19.52,7.86 Q-19.52,7.71 -19.44,7.71 Q-18.46,7.71 -17.88,6.97 Q-17.31,6.22 -17.28,4.95 ZM-0.10,7.71 Q-0.05,7.71 -0.05,7.86 Q-0.05,8.00 -0.10,8.00 Q-0.72,8.00 -1.52,7.98 Q-2.31,7.95 -3.17,7.95 Q-4.06,7.95 -4.83,7.98 Q-5.60,8.00 -6.22,8.00 Q-6.29,8.00 -6.29,7.86 Q-6.29,7.71 -6.22,7.71 Q-5.09,7.71 -4.77,7.40 Q-4.44,7.09 -4.52,6.06 L-5.07,-4.60 L-3.84,-6.52 L-9.96,7.83 Q-9.99,7.93 -10.14,7.93 Q-10.30,7.93 -10.35,7.83 L-17.09,-5.01 Q-18.00,-6.71 -19.28,-6.71 Q-19.35,-6.71 -19.35,-6.86 Q-19.35,-7.00 -19.28,-7.00 Q-18.77,-7.00 -18.22,-6.98 Q-17.67,-6.95 -17.28,-6.95 Q-16.66,-6.95 -16.19,-6.98 Q-15.72,-7.00 -15.46,-7.00 Q-15.12,-7.00 -14.94,-6.76 Q-14.76,-6.52 -14.36,-5.75 L-8.98,4.33 L-10.18,6.49 L-4.56,-6.40 Q-4.42,-6.74 -4.26,-6.87 Q-4.11,-7.00 -3.84,-7.00 Q-3.60,-7.00 -3.34,-6.98 Q-3.08,-6.95 -2.72,-6.95 Q-1.95,-6.95 -1.41,-6.98 Q-0.87,-7.00 -0.34,-7.00 Q-0.27,-7.00 -0.27,-6.86 Q-0.27,-6.71 -0.34,-6.71 Q-1.44,-6.71 -1.96,-6.26 Q-2.48,-5.80 -2.43,-4.84 L-1.85,6.06 Q-1.80,6.75 -1.67,7.11 Q-1.54,7.47 -1.18,7.59 Q-0.82,7.71 -0.10,7.71 ZM4.33,0.68 Q4.33,-0.02 4.21,-0.38 Q4.09,-0.74 3.70,-0.86 Q3.30,-0.98 2.48,-0.98 Q2.44,-0.98 2.44,-1.12 Q2.44,-1.26 2.48,-1.26 Q3.11,-1.26 3.85,-1.24 Q4.60,-1.22 5.46,-1.22 Q6.30,-1.22 7.07,-1.24 Q7.84,-1.26 8.44,-1.26 Q8.51,-1.26 8.51,-1.12 Q8.51,-0.98 8.44,-0.98 Q7.67,-0.98 7.27,-0.86 Q6.88,-0.74 6.73,-0.38 Q6.59,-0.02 6.59,0.68 L6.59,6.06 Q6.59,6.75 6.71,7.11 Q6.83,7.47 7.22,7.59 Q7.62,7.71 8.44,7.71 Q8.51,7.71 8.51,7.86 Q8.51,8.00 8.44,8.00 Q7.84,8.00 7.08,7.98 Q6.32,7.95 5.46,7.95 Q4.62,7.95 3.86,7.98 Q3.11,8.00 2.48,8.00 Q2.44,8.00 2.44,7.86 Q2.44,7.71 2.48,7.71 Q3.25,7.71 3.65,7.59 Q4.04,7.47 4.19,7.11 Q4.33,6.75 4.33,6.06 L4.33,0.68 ZM11.33,7.35 Q12.77,6.03 13.70,5.13 Q14.62,4.23 15.16,3.58 Q15.70,2.94 15.92,2.42 Q16.13,1.90 16.13,1.38 Q16.13,0.54 15.70,-0.15 Q15.27,-0.83 14.38,-0.83 Q13.42,-0.83 12.86,0.04 Q12.29,0.92 11.79,2.36 Q11.76,2.41 11.62,2.38 Q11.48,2.36 11.50,2.31 L12.56,-1.79 Q12.58,-1.86 12.72,-1.83 Q12.87,-1.79 12.82,-1.74 Q12.72,-1.29 12.86,-1.17 Q12.99,-1.05 13.16,-1.05 Q13.56,-1.05 14.16,-1.31 Q14.76,-1.58 15.77,-1.58 Q17.12,-1.58 17.85,-0.94 Q18.58,-0.30 18.58,0.70 Q18.58,1.57 18.10,2.31 Q17.62,3.06 16.89,3.69 Q16.16,4.33 15.38,4.88 Q14.60,5.43 13.97,5.91 Q13.90,5.98 13.95,6.03 Q14.00,6.08 14.09,6.08 Q15.32,6.08 16.24,6.06 Q17.16,6.03 17.79,5.91 Q18.41,5.79 18.77,5.55 Q19.13,5.31 19.25,4.88 Q19.28,4.78 19.41,4.81 Q19.54,4.83 19.54,4.88 L19.04,7.74 Q19.04,7.83 18.98,7.92 Q18.92,8.00 18.82,8.00 Q17.14,8.00 15.18,8.00 Q13.23,8.00 11.48,8.00 Q11.36,8.00 11.28,7.72 Q11.21,7.45 11.33,7.35 Z"/></g>
  </g>
</svg>
