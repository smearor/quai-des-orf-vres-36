<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#C9910D" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#C9910D" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-18.18,4.95 L-17.94,-6.45 L-17.25,-6.40 L-17.51,4.95 Q-17.54,6.22 -17.00,6.97 Q-16.46,7.71 -15.47,7.71 Q-15.40,7.71 -15.40,7.86 Q-15.40,8.00 -15.47,8.00 Q-16.00,8.00 -16.55,7.98 Q-17.10,7.95 -17.80,7.95 Q-18.57,7.95 -19.19,7.98 Q-19.82,8.00 -20.34,8.00 Q-20.42,8.00 -20.42,7.86 Q-20.42,7.71 -20.34,7.71 Q-19.36,7.71 -18.78,6.97 Q-18.21,6.22 -18.18,4.95 ZM-1.00,7.71 Q-0.95,7.71 -0.95,7.86 Q-0.95,8.00 -1.00,8.00 Q-1.62,8.00 -2.42,7.98 Q-3.21,7.95 -4.07,7.95 Q-4.96,7.95 -5.73,7.98 Q-6.50,8.00 -7.12,8.00 Q-7.19,8.00 -7.19,7.86 Q-7.19,7.71 -7.12,7.71 Q-5.99,7.71 -5.67,7.40 Q-5.34,7.09 -5.42,6.06 L-5.97,-4.60 L-4.74,-6.52 L-10.86,7.83 Q-10.89,7.93 -11.04,7.93 Q-11.20,7.93 -11.25,7.83 L-17.99,-5.01 Q-18.90,-6.71 -20.18,-6.71 Q-20.25,-6.71 -20.25,-6.86 Q-20.25,-7.00 -20.18,-7.00 Q-19.67,-7.00 -19.12,-6.98 Q-18.57,-6.95 -18.18,-6.95 Q-17.56,-6.95 -17.09,-6.98 Q-16.62,-7.00 -16.36,-7.00 Q-16.02,-7.00 -15.84,-6.76 Q-15.66,-6.52 -15.26,-5.75 L-9.88,4.33 L-11.08,6.49 L-5.46,-6.40 Q-5.32,-6.74 -5.16,-6.87 Q-5.01,-7.00 -4.74,-7.00 Q-4.50,-7.00 -4.24,-6.98 Q-3.98,-6.95 -3.62,-6.95 Q-2.85,-6.95 -2.31,-6.98 Q-1.77,-7.00 -1.24,-7.00 Q-1.17,-7.00 -1.17,-6.86 Q-1.17,-6.71 -1.24,-6.71 Q-2.34,-6.71 -2.86,-6.26 Q-3.38,-5.80 -3.33,-4.84 L-2.75,6.06 Q-2.70,6.75 -2.57,7.11 Q-2.44,7.47 -2.08,7.59 Q-1.72,7.71 -1.00,7.71 ZM3.43,0.68 Q3.43,-0.02 3.31,-0.38 Q3.19,-0.74 2.80,-0.86 Q2.40,-0.98 1.58,-0.98 Q1.54,-0.98 1.54,-1.12 Q1.54,-1.26 1.58,-1.26 Q2.21,-1.26 2.95,-1.24 Q3.70,-1.22 4.56,-1.22 Q5.40,-1.22 6.17,-1.24 Q6.94,-1.26 7.54,-1.26 Q7.61,-1.26 7.61,-1.12 Q7.61,-0.98 7.54,-0.98 Q6.77,-0.98 6.37,-0.86 Q5.98,-0.74 5.83,-0.38 Q5.69,-0.02 5.69,0.68 L5.69,6.06 Q5.69,6.75 5.81,7.11 Q5.93,7.47 6.32,7.59 Q6.72,7.71 7.54,7.71 Q7.61,7.71 7.61,7.86 Q7.61,8.00 7.54,8.00 Q6.94,8.00 6.18,7.98 Q5.42,7.95 4.56,7.95 Q3.72,7.95 2.96,7.98 Q2.21,8.00 1.58,8.00 Q1.54,8.00 1.54,7.86 Q1.54,7.71 1.58,7.71 Q2.35,7.71 2.75,7.59 Q3.14,7.47 3.29,7.11 Q3.43,6.75 3.43,6.06 L3.43,0.68 ZM15.30,8.31 Q13.82,8.31 12.65,7.66 Q11.49,7.02 10.83,5.89 Q10.17,4.76 10.17,3.32 Q10.17,1.88 10.83,0.78 Q11.49,-0.33 12.65,-0.95 Q13.82,-1.58 15.30,-1.58 Q16.82,-1.58 17.96,-0.94 Q19.10,-0.30 19.73,0.81 Q20.37,1.93 20.37,3.37 Q20.37,4.81 19.72,5.92 Q19.07,7.04 17.93,7.68 Q16.79,8.31 15.30,8.31 ZM15.54,7.81 Q16.67,7.81 17.22,6.70 Q17.78,5.60 17.78,3.70 Q17.78,1.98 17.40,0.93 Q17.03,-0.11 16.42,-0.59 Q15.81,-1.07 15.11,-1.07 Q13.96,-1.07 13.35,0.06 Q12.74,1.18 12.74,3.06 Q12.74,4.47 13.08,5.54 Q13.43,6.61 14.07,7.21 Q14.70,7.81 15.54,7.81 Z"/></g>
  </g>
</svg>
