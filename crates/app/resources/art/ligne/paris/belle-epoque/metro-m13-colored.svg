<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#6EC4E8" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#6EC4E8" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-17.19,4.95 L-16.95,-6.45 L-16.25,-6.40 L-16.52,4.95 Q-16.54,6.22 -16.00,6.97 Q-15.46,7.71 -14.48,7.71 Q-14.40,7.71 -14.40,7.86 Q-14.40,8.00 -14.48,8.00 Q-15.00,8.00 -15.56,7.98 Q-16.11,7.95 -16.80,7.95 Q-17.57,7.95 -18.20,7.98 Q-18.82,8.00 -19.35,8.00 Q-19.42,8.00 -19.42,7.86 Q-19.42,7.71 -19.35,7.71 Q-18.36,7.71 -17.79,6.97 Q-17.21,6.22 -17.19,4.95 ZM-0.00,7.71 Q0.04,7.71 0.04,7.86 Q0.04,8.00 -0.00,8.00 Q-0.63,8.00 -1.42,7.98 Q-2.21,7.95 -3.08,7.95 Q-3.96,7.95 -4.73,7.98 Q-5.50,8.00 -6.12,8.00 Q-6.20,8.00 -6.20,7.86 Q-6.20,7.71 -6.12,7.71 Q-5.00,7.71 -4.67,7.40 Q-4.35,7.09 -4.42,6.06 L-4.97,-4.60 L-3.75,-6.52 L-9.87,7.83 Q-9.89,7.93 -10.05,7.93 Q-10.20,7.93 -10.25,7.83 L-17.00,-5.01 Q-17.91,-6.71 -19.18,-6.71 Q-19.25,-6.71 -19.25,-6.86 Q-19.25,-7.00 -19.18,-7.00 Q-18.68,-7.00 -18.12,-6.98 Q-17.57,-6.95 -17.19,-6.95 Q-16.56,-6.95 -16.10,-6.98 Q-15.63,-7.00 -15.36,-7.00 Q-15.03,-7.00 -14.85,-6.76 Q-14.67,-6.52 -14.26,-5.75 L-8.88,4.33 L-10.08,6.49 L-4.47,-6.40 Q-4.32,-6.74 -4.17,-6.87 Q-4.01,-7.00 -3.75,-7.00 Q-3.51,-7.00 -3.24,-6.98 Q-2.98,-6.95 -2.62,-6.95 Q-1.85,-6.95 -1.31,-6.98 Q-0.77,-7.00 -0.24,-7.00 Q-0.17,-7.00 -0.17,-6.86 Q-0.17,-6.71 -0.24,-6.71 Q-1.35,-6.71 -1.86,-6.26 Q-2.38,-5.80 -2.33,-4.84 L-1.76,6.06 Q-1.71,6.75 -1.58,7.11 Q-1.44,7.47 -1.08,7.59 Q-0.72,7.71 -0.00,7.71 ZM4.43,0.68 Q4.43,-0.02 4.31,-0.38 Q4.19,-0.74 3.79,-0.86 Q3.40,-0.98 2.58,-0.98 Q2.53,-0.98 2.53,-1.12 Q2.53,-1.26 2.58,-1.26 Q3.20,-1.26 3.95,-1.24 Q4.69,-1.22 5.56,-1.22 Q6.40,-1.22 7.16,-1.24 Q7.93,-1.26 8.53,-1.26 Q8.60,-1.26 8.60,-1.12 Q8.60,-0.98 8.53,-0.98 Q7.76,-0.98 7.37,-0.86 Q6.97,-0.74 6.83,-0.38 Q6.68,-0.02 6.68,0.68 L6.68,6.06 Q6.68,6.75 6.80,7.11 Q6.92,7.47 7.32,7.59 Q7.72,7.71 8.53,7.71 Q8.60,7.71 8.60,7.86 Q8.60,8.00 8.53,8.00 Q7.93,8.00 7.18,7.98 Q6.42,7.95 5.56,7.95 Q4.72,7.95 3.96,7.98 Q3.20,8.00 2.58,8.00 Q2.53,8.00 2.53,7.86 Q2.53,7.71 2.58,7.71 Q3.35,7.71 3.74,7.59 Q4.14,7.47 4.28,7.11 Q4.43,6.75 4.43,6.06 L4.43,0.68 ZM11.84,14.60 Q11.74,14.62 11.68,14.50 Q11.62,14.38 11.72,14.34 Q13.16,13.76 14.10,13.04 Q15.05,12.32 15.62,11.54 Q16.18,10.76 16.41,10.00 Q16.64,9.25 16.64,8.60 Q16.64,7.66 16.31,6.96 Q15.99,6.25 15.39,5.86 Q14.79,5.48 13.97,5.48 Q13.73,5.48 13.49,5.52 Q13.25,5.55 12.99,5.62 Q12.92,5.65 12.87,5.50 Q12.82,5.36 12.89,5.34 Q14.52,4.90 15.32,4.04 Q16.11,3.18 16.11,1.57 Q16.11,0.39 15.76,-0.26 Q15.41,-0.90 14.69,-0.90 Q13.68,-0.90 12.87,-0.22 Q12.05,0.46 11.50,1.81 Q11.48,1.86 11.33,1.83 Q11.19,1.81 11.21,1.74 L12.10,-1.77 Q12.15,-1.84 12.28,-1.80 Q12.41,-1.77 12.39,-1.72 Q12.29,-1.31 12.44,-1.18 Q12.58,-1.05 12.75,-1.05 Q13.16,-1.05 13.84,-1.31 Q14.52,-1.58 15.48,-1.58 Q17.00,-1.58 17.76,-0.74 Q18.53,0.10 18.53,1.16 Q18.53,2.05 18.10,2.88 Q17.67,3.70 16.85,4.30 Q16.04,4.90 14.88,5.14 L14.91,4.76 Q16.44,4.81 17.40,5.32 Q18.36,5.84 18.81,6.62 Q19.25,7.40 19.25,8.29 Q19.25,9.37 18.47,10.54 Q17.69,11.72 16.05,12.78 Q14.40,13.83 11.84,14.60 Z"/></g>
  </g>
</svg>
