<!-- ============================================================
     LIGNE MÉTRO — TINTABLE MASTER
     Line badge for Paris métro lines, parametrized per line.

     Parametrization contract:
     - The accent ring carries id "line-accent" — replace its
       stroke-color with the official line colour.
     - The line name lives in <text id="line-name"> — replace its
       character data ("M1".."M14") and its fill with the same
       line colour. The pale stroke (#fef0cd) stays as the
       contrast highlight on the dark badge and must NOT be
       tinted.
     - All frame/filigree elements are colour-neutral (gold
       gradient + dark field) and must NOT be tinted.

     Defaults below render line M1 (RATP #FFCD00).
     See variants.toml for the M1..M14 palette (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Line Badge (colour-neutral) -->
    <radialGradient id="badgeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur id="line-glow" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)" transform="translate(50, 50)">
    <!-- Outer Octagonal / Ornate Filigree Frame -->
    <circle cx="0" cy="0" r="44" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <circle cx="0" cy="0" r="39" fill="url(#badgeBg)" />

    <!-- Line Colour Accent Rings (parametrized via #line-accent;
            the whole ring group is replaceable via fills on #line-rings) -->
    <g id="line-rings">
      <circle id="line-accent" cx="0" cy="0" r="34" fill="none" stroke="#003CA6" stroke-width="2.5" opacity="0.95" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#05070a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.9" />
    </g>

    <!-- Four Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 0,-39 L 3,-33 L 0,-30 L -3,-33 Z" />
      <path d="M 0,39 L 3,33 L 0,30 L -3,33 Z" />
      <path d="M -39,0 L -33,3 L -30,0 L -33,-3 Z" />
      <path d="M 39,0 L 33,3 L 30,0 L 33,-3 Z" />
    </g>

    <!-- Line Name (parametrized via #line-name; fill = line colour) -->
    <g id="line-name" fill="#7394CE" stroke="#fef0cd" stroke-width="0.6" filter="url(#glowFilter)"><path d="M-12.80,4.95 L-12.56,-6.45 L-11.86,-6.40 L-12.13,4.95 Q-12.15,6.22 -11.61,6.97 Q-11.07,7.71 -10.09,7.71 Q-10.02,7.71 -10.02,7.86 Q-10.02,8.00 -10.09,8.00 Q-10.62,8.00 -11.17,7.98 Q-11.72,7.95 -12.42,7.95 Q-13.18,7.95 -13.81,7.98 Q-14.43,8.00 -14.96,8.00 Q-15.03,8.00 -15.03,7.86 Q-15.03,7.71 -14.96,7.71 Q-13.98,7.71 -13.40,6.97 Q-12.82,6.22 -12.80,4.95 ZM4.38,7.71 Q4.43,7.71 4.43,7.86 Q4.43,8.00 4.38,8.00 Q3.76,8.00 2.97,7.98 Q2.18,7.95 1.31,7.95 Q0.42,7.95 -0.34,7.98 Q-1.11,8.00 -1.74,8.00 Q-1.81,8.00 -1.81,7.86 Q-1.81,7.71 -1.74,7.71 Q-0.61,7.71 -0.28,7.40 Q0.04,7.09 -0.03,6.06 L-0.58,-4.60 L0.64,-6.52 L-5.48,7.83 Q-5.50,7.93 -5.66,7.93 Q-5.82,7.93 -5.86,7.83 L-12.61,-5.01 Q-13.52,-6.71 -14.79,-6.71 Q-14.86,-6.71 -14.86,-6.86 Q-14.86,-7.00 -14.79,-7.00 Q-14.29,-7.00 -13.74,-6.98 Q-13.18,-6.95 -12.80,-6.95 Q-12.18,-6.95 -11.71,-6.98 Q-11.24,-7.00 -10.98,-7.00 Q-10.64,-7.00 -10.46,-6.76 Q-10.28,-6.52 -9.87,-5.75 L-4.50,4.33 L-5.70,6.49 L-0.08,-6.40 Q0.06,-6.74 0.22,-6.87 Q0.38,-7.00 0.64,-7.00 Q0.88,-7.00 1.14,-6.98 Q1.41,-6.95 1.77,-6.95 Q2.54,-6.95 3.08,-6.98 Q3.62,-7.00 4.14,-7.00 Q4.22,-7.00 4.22,-6.86 Q4.22,-6.71 4.14,-6.71 Q3.04,-6.71 2.52,-6.26 Q2.01,-5.80 2.06,-4.84 L2.63,6.06 Q2.68,6.75 2.81,7.11 Q2.94,7.47 3.30,7.59 Q3.66,7.71 4.38,7.71 ZM6.85,7.35 Q8.29,6.03 9.21,5.13 Q10.14,4.23 10.68,3.58 Q11.22,2.94 11.43,2.42 Q11.65,1.90 11.65,1.38 Q11.65,0.54 11.22,-0.15 Q10.78,-0.83 9.90,-0.83 Q8.94,-0.83 8.37,0.04 Q7.81,0.92 7.30,2.36 Q7.28,2.41 7.14,2.38 Q6.99,2.36 7.02,2.31 L8.07,-1.79 Q8.10,-1.86 8.24,-1.83 Q8.38,-1.79 8.34,-1.74 Q8.24,-1.29 8.37,-1.17 Q8.50,-1.05 8.67,-1.05 Q9.08,-1.05 9.68,-1.31 Q10.28,-1.58 11.29,-1.58 Q12.63,-1.58 13.36,-0.94 Q14.10,-0.30 14.10,0.70 Q14.10,1.57 13.62,2.31 Q13.14,3.06 12.40,3.69 Q11.67,4.33 10.89,4.88 Q10.11,5.43 9.49,5.91 Q9.42,5.98 9.46,6.03 Q9.51,6.08 9.61,6.08 Q10.83,6.08 11.76,6.06 Q12.68,6.03 13.30,5.91 Q13.93,5.79 14.29,5.55 Q14.65,5.31 14.77,4.88 Q14.79,4.78 14.92,4.81 Q15.06,4.83 15.06,4.88 L14.55,7.74 Q14.55,7.83 14.49,7.92 Q14.43,8.00 14.34,8.00 Q12.66,8.00 10.70,8.00 Q8.74,8.00 6.99,8.00 Q6.87,8.00 6.80,7.72 Q6.73,7.45 6.85,7.35 Z"/></g>
  </g>
</svg>
