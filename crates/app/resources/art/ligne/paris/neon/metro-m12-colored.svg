<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#007852" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#007852" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-25.44,9.00 L-25.44,-8.28 L-21.96,-8.28 L-15.70,-0.82 L-9.46,-8.28 L-5.96,-8.28 L-5.96,9.00 L-9.15,9.00 L-9.15,-3.67 L-15.70,4.13 L-22.28,-3.65 L-22.28,9.00 L-25.44,9.00 ZM2.03,9.00 L2.03,9.00 L2.03,-3.74 L0.66,-2.06 L-3.49,-2.06 L1.72,-8.28 L5.20,-8.28 L5.20,9.00 L2.03,9.00 ZM8.24,9.00 L8.24,9.00 L8.24,2.38 Q8.24,1.44 8.69,0.70 Q9.15,-0.05 9.89,-0.49 Q10.64,-0.94 11.55,-0.94 L21.92,-0.94 Q22.04,-0.94 22.12,-1.02 Q22.20,-1.10 22.20,-1.22 L22.20,-4.85 Q22.20,-4.97 22.12,-5.05 Q22.04,-5.14 21.92,-5.14 L11.67,-5.14 Q11.55,-5.14 11.46,-5.05 Q11.38,-4.97 11.38,-4.85 L11.38,-3.67 L8.24,-3.67 L8.24,-4.97 Q8.24,-5.90 8.69,-6.65 Q9.15,-7.39 9.89,-7.84 Q10.64,-8.28 11.55,-8.28 L22.04,-8.28 Q22.95,-8.28 23.70,-7.84 Q24.46,-7.39 24.90,-6.65 Q25.35,-5.90 25.35,-4.97 L25.35,-1.08 Q25.35,-0.19 24.90,0.56 Q24.46,1.32 23.70,1.78 Q22.95,2.23 22.04,2.23 L11.67,2.23 Q11.55,2.23 11.46,2.32 Q11.38,2.40 11.38,2.52 L11.38,5.57 Q11.38,5.69 11.46,5.77 Q11.55,5.86 11.67,5.86 L25.35,5.86 L25.35,9.00 L8.24,9.00 Z"/></g>
  </g>
</svg>
