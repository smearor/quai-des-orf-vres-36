<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#E19BDF" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#E19BDF" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.30,9.00 L-20.30,-8.28 L-16.82,-8.28 L-10.56,-0.82 L-4.32,-8.28 L-0.81,-8.28 L-0.81,9.00 L-4.00,9.00 L-4.00,-3.67 L-10.56,4.13 L-17.13,-3.65 L-17.13,9.00 L-20.30,9.00 ZM6.31,9.00 Q5.40,9.00 4.65,8.54 Q3.91,8.09 3.45,7.34 Q3.00,6.60 3.00,5.69 L3.00,1.92 Q3.00,1.49 3.14,1.04 Q3.28,0.60 3.50,0.19 Q3.28,-0.22 3.14,-0.66 Q3.00,-1.10 3.00,-1.56 L3.00,-4.97 Q3.00,-5.90 3.45,-6.65 Q3.91,-7.39 4.65,-7.84 Q5.40,-8.28 6.31,-8.28 L16.80,-8.28 Q17.59,-8.28 18.28,-7.92 Q18.98,-7.56 19.47,-6.94 Q19.96,-6.31 20.11,-5.57 L20.11,-1.56 Q20.11,-0.67 19.60,0.19 Q20.11,0.98 20.11,1.92 L20.11,5.69 Q20.11,6.60 19.65,7.34 Q19.20,8.09 18.45,8.54 Q17.71,9.00 16.80,9.00 L6.31,9.00 L6.31,9.00 ZM6.43,5.86 L6.43,5.86 L16.68,5.86 Q16.80,5.86 16.88,5.77 Q16.96,5.69 16.96,5.57 L16.96,2.06 Q16.96,1.94 16.88,1.86 Q16.80,1.78 16.68,1.78 L6.43,1.78 Q6.31,1.78 6.22,1.86 Q6.14,1.94 6.14,2.06 L6.14,5.57 Q6.14,5.69 6.22,5.77 Q6.31,5.86 6.43,5.86 ZM6.43,-1.13 L6.43,-1.13 L16.68,-1.13 Q16.80,-1.13 16.88,-1.22 Q16.96,-1.32 16.96,-1.42 L16.96,-4.82 Q16.96,-4.94 16.88,-5.03 Q16.80,-5.11 16.68,-5.11 L6.43,-5.11 Q6.31,-5.11 6.22,-5.03 Q6.14,-4.94 6.14,-4.82 L6.14,-1.42 Q6.14,-1.32 6.22,-1.22 Q6.31,-1.13 6.43,-1.13 Z"/></g>
  </g>
</svg>
