<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#B6BD00" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#B6BD00" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.23,9.00 L-20.23,-8.28 L-16.75,-8.28 L-10.48,-0.82 L-4.24,-8.28 L-0.74,-8.28 L-0.74,9.00 L-3.93,9.00 L-3.93,-3.67 L-10.48,4.13 L-17.06,-3.65 L-17.06,9.00 L-20.23,9.00 ZM6.31,9.00 Q5.52,9.00 4.82,8.58 Q4.12,8.16 3.63,7.45 Q3.14,6.74 2.97,5.86 L16.68,5.86 Q16.80,5.86 16.88,5.77 Q16.96,5.69 16.96,5.57 L16.96,2.38 Q16.96,2.26 16.88,2.17 Q16.80,2.09 16.68,2.09 L6.31,2.09 Q5.37,2.09 4.63,1.63 Q3.88,1.18 3.43,0.42 Q2.97,-0.34 2.97,-1.25 L2.97,-4.97 Q2.97,-5.90 3.43,-6.65 Q3.88,-7.39 4.63,-7.84 Q5.37,-8.28 6.31,-8.28 L16.80,-8.28 Q17.71,-8.28 18.45,-7.84 Q19.20,-7.39 19.65,-6.65 Q20.11,-5.90 20.11,-4.97 L20.11,5.69 Q20.11,6.60 19.65,7.34 Q19.20,8.09 18.45,8.54 Q17.71,9.00 16.80,9.00 L6.31,9.00 L6.31,9.00 ZM6.43,-1.08 L6.43,-1.08 L16.96,-1.08 L16.96,-4.85 Q16.96,-4.97 16.88,-5.05 Q16.80,-5.14 16.68,-5.14 L6.43,-5.14 Q6.31,-5.14 6.22,-5.05 Q6.14,-4.97 6.14,-4.85 L6.14,-1.37 Q6.14,-1.25 6.22,-1.16 Q6.31,-1.08 6.43,-1.08 Z"/></g>
  </g>
</svg>
