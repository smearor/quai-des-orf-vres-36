<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#6EC4E8" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#6EC4E8" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-25.40,9.00 L-25.40,-8.28 L-21.92,-8.28 L-15.65,-0.82 L-9.41,-8.28 L-5.91,-8.28 L-5.91,9.00 L-9.10,9.00 L-9.10,-3.67 L-15.65,4.13 L-22.23,-3.65 L-22.23,9.00 L-25.40,9.00 ZM2.08,9.00 L2.08,9.00 L2.08,-3.74 L0.71,-2.06 L-3.44,-2.06 L1.76,-8.28 L5.24,-8.28 L5.24,9.00 L2.08,9.00 ZM11.52,9.00 Q10.59,9.00 9.84,8.54 Q9.10,8.09 8.64,7.34 Q8.19,6.60 8.19,5.69 L8.19,4.66 L11.33,4.66 L11.33,5.57 Q11.33,5.69 11.42,5.77 Q11.50,5.86 11.62,5.86 L21.87,5.86 Q21.99,5.86 22.08,5.77 Q22.18,5.69 22.18,5.57 L22.18,2.11 Q22.18,1.99 22.08,1.91 Q21.99,1.82 21.87,1.82 L11.16,1.82 L11.16,-1.32 L21.20,-1.32 Q21.32,-1.32 21.40,-1.40 Q21.48,-1.49 21.48,-1.61 L21.48,-4.85 Q21.48,-4.97 21.40,-5.05 Q21.32,-5.14 21.20,-5.14 L11.62,-5.14 Q11.50,-5.14 11.42,-5.05 Q11.33,-4.97 11.33,-4.85 L11.33,-3.72 L8.19,-3.72 L8.19,-4.97 Q8.19,-5.90 8.64,-6.65 Q9.10,-7.39 9.84,-7.84 Q10.59,-8.28 11.52,-8.28 L21.32,-8.28 Q22.25,-8.28 23.00,-7.84 Q23.74,-7.39 24.18,-6.65 Q24.63,-5.90 24.63,-4.97 L24.63,-1.46 Q24.63,-1.18 24.58,-0.88 Q24.53,-0.58 24.44,-0.31 Q24.87,0.14 25.10,0.76 Q25.32,1.37 25.32,1.99 L25.32,5.69 Q25.32,6.60 24.87,7.34 Q24.41,8.09 23.67,8.54 Q22.92,9.00 22.01,9.00 L11.52,9.00 L11.52,9.00 Z"/></g>
  </g>
</svg>
