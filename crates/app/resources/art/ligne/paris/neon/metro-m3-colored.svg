<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#837902" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#837902" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.20,9.00 L-20.20,-8.28 L-16.72,-8.28 L-10.46,-0.82 L-4.22,-8.28 L-0.72,-8.28 L-0.72,9.00 L-3.91,9.00 L-3.91,-3.67 L-10.46,4.13 L-17.04,-3.65 L-17.04,9.00 L-20.20,9.00 ZM6.33,9.00 Q5.40,9.00 4.65,8.54 Q3.91,8.09 3.45,7.34 Q3.00,6.60 3.00,5.69 L3.00,4.66 L6.14,4.66 L6.14,5.57 Q6.14,5.69 6.22,5.77 Q6.31,5.86 6.43,5.86 L16.68,5.86 Q16.80,5.86 16.89,5.77 Q16.99,5.69 16.99,5.57 L16.99,2.11 Q16.99,1.99 16.89,1.91 Q16.80,1.82 16.68,1.82 L5.97,1.82 L5.97,-1.32 L16.00,-1.32 Q16.12,-1.32 16.21,-1.40 Q16.29,-1.49 16.29,-1.61 L16.29,-4.85 Q16.29,-4.97 16.21,-5.05 Q16.12,-5.14 16.00,-5.14 L6.43,-5.14 Q6.31,-5.14 6.22,-5.05 Q6.14,-4.97 6.14,-4.85 L6.14,-3.72 L3.00,-3.72 L3.00,-4.97 Q3.00,-5.90 3.45,-6.65 Q3.91,-7.39 4.65,-7.84 Q5.40,-8.28 6.33,-8.28 L16.12,-8.28 Q17.06,-8.28 17.80,-7.84 Q18.55,-7.39 18.99,-6.65 Q19.44,-5.90 19.44,-4.97 L19.44,-1.46 Q19.44,-1.18 19.39,-0.88 Q19.34,-0.58 19.24,-0.31 Q19.68,0.14 19.90,0.76 Q20.13,1.37 20.13,1.99 L20.13,5.69 Q20.13,6.60 19.68,7.34 Q19.22,8.09 18.48,8.54 Q17.73,9.00 16.82,9.00 L6.33,9.00 L6.33,9.00 Z"/></g>
  </g>
</svg>
