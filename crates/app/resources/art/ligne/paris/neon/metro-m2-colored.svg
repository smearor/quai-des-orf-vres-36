<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#003CA6" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#003CA6" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.25,9.00 L-20.25,-8.28 L-16.77,-8.28 L-10.51,-0.82 L-4.27,-8.28 L-0.76,-8.28 L-0.76,9.00 L-3.96,9.00 L-3.96,-3.67 L-10.51,4.13 L-17.08,-3.65 L-17.08,9.00 L-20.25,9.00 ZM3.04,9.00 L3.04,9.00 L3.04,2.38 Q3.04,1.44 3.50,0.70 Q3.96,-0.05 4.70,-0.49 Q5.44,-0.94 6.36,-0.94 L16.72,-0.94 Q16.84,-0.94 16.93,-1.02 Q17.01,-1.10 17.01,-1.22 L17.01,-4.85 Q17.01,-4.97 16.93,-5.05 Q16.84,-5.14 16.72,-5.14 L6.48,-5.14 Q6.36,-5.14 6.27,-5.05 Q6.19,-4.97 6.19,-4.85 L6.19,-3.67 L3.04,-3.67 L3.04,-4.97 Q3.04,-5.90 3.50,-6.65 Q3.96,-7.39 4.70,-7.84 Q5.44,-8.28 6.36,-8.28 L16.84,-8.28 Q17.76,-8.28 18.51,-7.84 Q19.27,-7.39 19.71,-6.65 Q20.16,-5.90 20.16,-4.97 L20.16,-1.08 Q20.16,-0.19 19.71,0.56 Q19.27,1.32 18.51,1.78 Q17.76,2.23 16.84,2.23 L6.48,2.23 Q6.36,2.23 6.27,2.32 Q6.19,2.40 6.19,2.52 L6.19,5.57 Q6.19,5.69 6.27,5.77 Q6.36,5.86 6.48,5.86 L20.16,5.86 L20.16,9.00 L3.04,9.00 Z"/></g>
  </g>
</svg>
