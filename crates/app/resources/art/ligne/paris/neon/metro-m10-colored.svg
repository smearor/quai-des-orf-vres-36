<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#C9910D" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#C9910D" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-25.49,9.00 L-25.49,-8.28 L-22.01,-8.28 L-15.75,-0.82 L-9.51,-8.28 L-6.00,-8.28 L-6.00,9.00 L-9.20,9.00 L-9.20,-3.67 L-15.75,4.13 L-22.32,-3.65 L-22.32,9.00 L-25.49,9.00 ZM1.98,9.00 L1.98,9.00 L1.98,-3.74 L0.61,-2.06 L-3.54,-2.06 L1.67,-8.28 L5.15,-8.28 L5.15,9.00 L1.98,9.00 ZM11.50,9.00 Q10.59,9.00 9.84,8.51 Q9.10,8.02 8.64,7.22 Q8.19,6.43 8.19,5.54 L8.19,-4.90 Q8.19,-5.83 8.64,-6.59 Q9.10,-7.34 9.84,-7.81 Q10.59,-8.28 11.50,-8.28 L21.99,-8.28 Q22.90,-8.28 23.64,-7.81 Q24.39,-7.34 24.84,-6.59 Q25.30,-5.83 25.30,-4.90 L25.30,5.54 Q25.30,6.43 24.84,7.22 Q24.39,8.02 23.64,8.51 Q22.90,9.00 21.99,9.00 L11.50,9.00 L11.50,9.00 ZM12.77,5.69 L12.77,5.69 L21.87,5.69 Q21.99,5.69 22.07,5.60 Q22.16,5.52 22.16,5.40 L22.16,-2.14 L12.77,5.69 ZM11.33,2.76 L11.33,2.76 L20.72,-5.06 L11.62,-5.06 Q11.50,-5.06 11.42,-4.98 Q11.33,-4.90 11.33,-4.78 L11.33,2.76 Z"/></g>
  </g>
</svg>
