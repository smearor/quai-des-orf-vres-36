<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#FF7E2E" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#FF7E2E" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.25,9.00 L-20.25,-8.28 L-16.77,-8.28 L-10.51,-0.82 L-4.27,-8.28 L-0.76,-8.28 L-0.76,9.00 L-3.96,9.00 L-3.96,-3.67 L-10.51,4.13 L-17.08,-3.65 L-17.08,9.00 L-20.25,9.00 ZM6.36,9.00 Q5.44,9.00 4.70,8.54 Q3.96,8.09 3.50,7.34 Q3.04,6.60 3.04,5.69 L3.04,4.56 L6.19,4.56 L6.19,5.57 Q6.19,5.69 6.27,5.77 Q6.36,5.86 6.48,5.86 L16.72,5.86 Q16.84,5.86 16.93,5.77 Q17.01,5.69 17.01,5.57 L17.01,2.06 Q17.01,1.94 16.93,1.86 Q16.84,1.78 16.72,1.78 L3.04,1.78 L3.04,-8.28 L20.16,-8.28 L20.16,-5.14 L6.48,-5.14 Q6.36,-5.14 6.27,-5.05 Q6.19,-4.97 6.19,-4.85 L6.19,-1.68 Q6.19,-1.56 6.27,-1.48 Q6.36,-1.39 6.48,-1.39 L16.84,-1.39 Q17.76,-1.39 18.51,-0.95 Q19.27,-0.50 19.71,0.25 Q20.16,1.01 20.16,1.92 L20.16,5.69 Q20.16,6.60 19.70,7.34 Q19.24,8.09 18.50,8.54 Q17.76,9.00 16.84,9.00 L6.36,9.00 L6.36,9.00 Z"/></g>
  </g>
</svg>
