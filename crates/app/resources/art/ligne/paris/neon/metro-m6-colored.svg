<!-- ============================================================
     LIGNE MÉTRO (NEON) — TINTABLE MASTER
     Neon-style metro line badge, parametrized per variant.

     Parametrization contract:
     - #line-accent carries the line colour on the solid ring and
       #line-accent-bloom on the wide low-alpha bloom ring behind
       it (stroke substitutions).
     - #line-name carries the line name text (fill substitution +
       character data via texts).
     - The grid/panel/node elements are colour-neutral and must
       NOT be tinted.

     Defaults below render M1 (#FFCD00).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Neon Bloom Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Board Grid Underlay Hairlines -->
    <path d="M -40,-40 L 40,-40 M -40,40 L 40,40 M -40,-40 L -40,40 M 40,-40 L 40,40 M -40,0 L 40,0 M 0,-40 L 0,40" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Background -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#16224A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Neon Metro Ring: bloom halo + solid core (parametrized via #line-accent*) -->
    <circle id="line-accent-bloom" cx="0" cy="0" r="28" fill="none" stroke="#6ECA97" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />
    <circle id="line-accent" cx="0" cy="0" r="28" fill="none" stroke="#6ECA97" stroke-width="2" />

    <!-- Terminal Nodes -->
    <circle cx="0" cy="-28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="0" cy="28" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="-28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />
    <circle cx="28" cy="0" r="2" fill="#C9D4FF" filter="url(#neonGlow)" />

    <!-- Monospace Uppercase Line Name (parametrized via #line-name) -->
    <g id="line-name" fill="#C9D4FF" filter="url(#neonGlow)"><path d="M-20.13,9.00 L-20.13,-8.28 L-16.65,-8.28 L-10.39,-0.82 L-4.15,-8.28 L-0.64,-8.28 L-0.64,9.00 L-3.84,9.00 L-3.84,-3.67 L-10.39,4.13 L-16.96,-3.65 L-16.96,9.00 L-20.13,9.00 ZM6.48,9.00 Q5.56,9.00 4.82,8.54 Q4.08,8.09 3.62,7.34 Q3.16,6.60 3.16,5.69 L3.16,-4.97 Q3.16,-5.90 3.62,-6.65 Q4.08,-7.39 4.82,-7.84 Q5.56,-8.28 6.48,-8.28 L17.54,-8.28 L17.54,-5.14 L6.60,-5.14 Q6.48,-5.14 6.39,-5.05 Q6.31,-4.97 6.31,-4.85 L6.31,-1.70 Q6.31,-1.58 6.39,-1.50 Q6.48,-1.42 6.60,-1.42 L16.96,-1.42 Q17.88,-1.42 18.63,-0.97 Q19.39,-0.53 19.83,0.23 Q20.28,0.98 20.28,1.90 L20.28,5.69 Q20.28,6.60 19.82,7.34 Q19.36,8.09 18.62,8.54 Q17.88,9.00 16.96,9.00 L6.48,9.00 L6.48,9.00 ZM6.60,5.86 L16.84,5.86 Q16.96,5.86 17.05,5.77 Q17.13,5.69 17.13,5.57 L17.13,2.04 Q17.13,1.92 17.05,1.84 Q16.96,1.75 16.84,1.75 L6.31,1.75 L6.31,5.57 Q6.31,5.69 6.39,5.77 Q6.48,5.86 6.60,5.86 Z"/></g>
  </g>
</svg>
