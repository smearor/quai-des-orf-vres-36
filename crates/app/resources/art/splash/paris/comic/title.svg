<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Ink field -->
  <rect width="480" height="600" fill="#1C1917" />

  <!-- Paper panel -->
  <rect x="14" y="14" width="452" height="572" fill="#F7EFE0" stroke="#1C1917" stroke-width="4" />

  <!-- Sky band -->
  <rect x="18" y="18" width="444" height="330" fill="#F7EFE0" />

  <!-- Skyline silhouette row (ink) -->
  <g fill="#1C1917">
    <rect x="30" y="238" width="26" height="90" />
    <rect x="40" y="218" width="10" height="20" />
    <rect x="62" y="252" width="34" height="76" />
    <rect x="102" y="226" width="22" height="102" />
    <rect x="108" y="208" width="10" height="18" />
    <rect x="130" y="262" width="30" height="66" />
    <rect x="166" y="244" width="24" height="84" />
    <rect x="296" y="250" width="26" height="78" />
    <rect x="326" y="230" width="30" height="98" />
    <rect x="336" y="212" width="10" height="18" />
    <rect x="362" y="258" width="34" height="70" />
    <rect x="402" y="236" width="22" height="92" />
    <rect x="408" y="220" width="10" height="16" />
    <rect x="430" y="254" width="24" height="74" />
  </g>

  <!-- Hill mound behind tower -->
  <path d="M 110,340 Q 240,270 370,340 L 370,352 L 110,352 Z" fill="#1C1917" />

  <!-- Eiffel tower silhouette (ink) -->
  <path d="M 240,78
           C 243,112 246,150 248,182 C 249,205 250,224 251,238
           C 252,260 254,280 262,298 C 274,316 294,330 314,340
           L 290,340 C 276,332 265,318 260,306 C 255,294 250,288 240,288
           C 230,288 225,294 220,306 C 215,318 204,332 190,340
           L 166,340 C 186,330 206,316 218,298 C 226,280 228,260 229,238
           C 230,224 231,205 232,182 C 234,150 237,112 240,78 Z" fill="#1C1917" />
  <rect x="218" y="234" width="44" height="5" fill="#1C1917" />
  <rect x="206" y="292" width="68" height="5" fill="#1C1917" />

  <!-- Ground field (ink) -->
  <rect x="18" y="340" width="444" height="246" fill="#1C1917" />

  <!-- Halftone rows on the ground -->
  <g fill="#F7EFE0" opacity="0.55">
    <circle cx="60" cy="368" r="2.5" /><circle cx="100" cy="368" r="2.5" /><circle cx="380" cy="368" r="2.5" /><circle cx="420" cy="368" r="2.5" />
    <circle cx="80" cy="388" r="2.5" /><circle cx="120" cy="388" r="2.5" /><circle cx="360" cy="388" r="2.5" /><circle cx="400" cy="388" r="2.5" />
    <circle cx="60" cy="408" r="2.5" /><circle cx="420" cy="408" r="2.5" />
  </g>

  <!-- Ink-burst corner accents -->
  <g fill="none" stroke="#1C1917" stroke-width="3" stroke-linecap="round">
    <path d="M 30,52 L 52,40" /><path d="M 28,72 L 62,52" /><path d="M 34,34 L 58,62" />
    <path d="M 450,52 L 428,40" /><path d="M 452,72 L 418,52" /><path d="M 446,34 L 422,62" />
  </g>
  <g fill="none" stroke="#F7EFE0" stroke-width="3" stroke-linecap="round">
    <path d="M 30,548 L 52,560" /><path d="M 28,528 L 62,548" /><path d="M 34,566 L 58,538" />
    <path d="M 450,548 L 428,560" /><path d="M 452,528 L 418,548" /><path d="M 446,566 L 422,538" />
  </g>

  <!-- Title -->
  <text x="240" y="470" font-family="&#39;Patrick Hand&#39;, &#39;Comic Neue&#39;, sans-serif" font-size="34" font-weight="bold" fill="#F5C518" stroke="#F7EFE0" stroke-width="6" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" letter-spacing="3">
    QUAI DES ORFÈVRES
  </text>
  <text x="240" y="496" font-family="&#39;Patrick Hand&#39;, &#39;Comic Neue&#39;, sans-serif" font-size="15" font-weight="bold" fill="#F7EFE0" text-anchor="middle" letter-spacing="6">
    36 · PARIS · MM
  </text>

  <!-- Compass rose -->
  <g transform="translate(240, 540)">
    <circle r="26" fill="none" stroke="#F5C518" stroke-width="2" />
    <circle r="20" fill="none" stroke="#F5C518" stroke-width="1" stroke-dasharray="3,2" />
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#F5C518" stroke="#F7EFE0" stroke-width="1" />
    <circle r="4" fill="#F7EFE0" stroke="#F5C518" stroke-width="1.5" />
    <text x="0" y="-30" font-family="&#39;Comic Neue&#39;, sans-serif" font-size="11" font-weight="bold" fill="#F5C518" text-anchor="middle">N</text>
  </g>
</svg>
