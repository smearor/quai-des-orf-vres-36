<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24,0 L 0,0 0,24" fill="none" stroke="#16224A" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Deep night field + circuit grid -->
  <rect width="480" height="600" fill="#0B1020" />
  <rect width="480" height="600" fill="url(#grid)" />

  <!-- Circuit frame with corner notches -->
