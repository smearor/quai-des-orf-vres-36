<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <!-- Vintage parchment -->
    <radialGradient id="paperBg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#fdf6e2" />
      <stop offset="70%" stop-color="#f4ebcf" />
      <stop offset="100%" stop-color="#e0cfab" />
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>
    <!-- Fine engraving hatch -->
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="5" y2="4" stroke="#c9b98f" stroke-width="0.5" opacity="0.5" />
    </pattern>
    <filter id="printShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Parchment field with hatch -->
  <rect width="480" height="600" fill="url(#paperBg)" />
  <rect width="480" height="600" fill="url(#hatch)" />

  <!-- Engraved double frame -->
  <rect x="14" y="14" width="452" height="572" fill="none" stroke="#542c15" stroke-width="1.5" />
  <rect x="22" y="22" width="436" height="556" fill="none" stroke="url(#goldAcc)" stroke-width="2" filter="url(#printShadow)" />
  <rect x="30" y="30" width="420" height="540" fill="none" stroke="#542c15" stroke-width="0.75" stroke-dasharray="6,4" opacity="0.7" />

  <!-- Corner filigree -->
  <g fill="none" stroke="url(#goldAcc)" stroke-width="1.5">
    <g transform="translate(30, 30)">
      <path d="M 0,0 C 0,40 40,0 58,0 M 0,0 C 40,0 0,40 0,58 M 12,12 Q 32,32 60,12 Q 32,32 12,60" />
      <circle cx="12" cy="12" r="3" fill="url(#goldAcc)" />
    </g>
    <g transform="translate(450, 30) scale(-1, 1)">
      <path d="M 0,0 C 0,40 40,0 58,0 M 0,0 C 40,0 0,40 0,58 M 12,12 Q 32,32 60,12 Q 32,32 12,60" />
      <circle cx="12" cy="12" r="3" fill="url(#goldAcc)" />
    </g>
    <g transform="translate(30, 570) scale(1, -1)">
      <path d="M 0,0 C 0,40 40,0 58,0 M 0,0 C 40,0 0,40 0,58 M 12,12 Q 32,32 60,12 Q 32,32 12,60" />
      <circle cx="12" cy="12" r="3" fill="url(#goldAcc)" />
    </g>
    <g transform="translate(450, 570) scale(-1, -1)">
      <path d="M 0,0 C 0,40 40,0 58,0 M 0,0 C 40,0 0,40 0,58 M 12,12 Q 32,32 60,12 Q 32,32 12,60" />
      <circle cx="12" cy="12" r="3" fill="url(#goldAcc)" />
    </g>
  </g>

  <!-- Engraved skyline (fine ink outlines) -->
  <g fill="none" stroke="#542c15" stroke-width="1">
    <path d="M 40,300 L 40,236 L 66,236 L 66,300 M 46,236 L 46,222 L 60,222 L 60,236" />
    <path d="M 74,300 L 74,252 L 96,252 L 96,300" />
    <path d="M 104,300 L 104,228 L 122,228 L 122,300 M 110,228 L 110,214 L 116,214 L 116,228" />
    <path d="M 130,300 L 130,260 L 156,260 L 156,300" />
    <path d="M 318,300 L 318,248 L 342,248 L 342,300 M 324,248 L 324,232 L 336,232 L 336,248" />
    <path d="M 350,300 L 350,228 L 372,228 L 372,300" />
    <path d="M 380,300 L 380,258 L 406,258 L 406,300" />
    <path d="M 414,300 L 414,238 L 440,238 L 440,300 M 420,238 L 420,224 L 434,224 L 434,238" />
  </g>
  <!-- Tree line along the avenue -->
  <g fill="none" stroke="#542c15" stroke-width="0.8">
    <circle cx="170" cy="296" r="6" /><circle cx="190" cy="292" r="7" /><circle cx="210" cy="296" r="6" />
    <circle cx="270" cy="296" r="6" /><circle cx="290" cy="292" r="7" /><circle cx="310" cy="296" r="6" />
    <line x1="170" y1="302" x2="170" y2="310" /><line x1="190" y1="299" x2="190" y2="310" /><line x1="210" y1="302" x2="210" y2="310" />
    <line x1="270" y1="302" x2="270" y2="310" /><line x1="290" y1="299" x2="290" y2="310" /><line x1="310" y1="302" x2="310" y2="310" />
  </g>

  <!-- Engraved Eiffel tower -->
  <path d="M 240,86
           C 243,118 246,152 248,184 C 249,207 250,224 251,240
           C 252,262 254,280 262,298 C 274,316 294,330 314,340
           L 290,340 C 276,332 265,318 260,306 C 255,294 250,288 240,288
           C 230,288 225,294 220,306 C 215,318 204,332 190,340
           L 166,340 C 186,330 206,316 218,298 C 226,280 228,262 229,240
           C 230,224 231,207 232,184 C 234,152 237,118 240,86 Z"
        fill="none" stroke="#542c15" stroke-width="2" />
  <line x1="240" y1="92" x2="240" y2="280" stroke="#542c15" stroke-width="0.8" />
  <line x1="235" y1="160" x2="245" y2="160" stroke="#542c15" stroke-width="0.8" />
  <line x1="233" y1="200" x2="247" y2="200" stroke="#542c15" stroke-width="0.8" />
  <line x1="218" y1="238" x2="262" y2="238" stroke="#542c15" stroke-width="1.2" />
  <line x1="206" y1="296" x2="274" y2="296" stroke="#542c15" stroke-width="1.2" />
  <path d="M 214,306 Q 240,296 266,306" fill="none" stroke="#542c15" stroke-width="0.8" />
  <!-- Antenna -->
  <line x1="240" y1="86" x2="240" y2="70" stroke="#542c15" stroke-width="1.2" />
  <circle cx="240" cy="68" r="2" fill="url(#goldAcc)" />

  <!-- Garden avenues converging under the tower -->
  <g fill="none" stroke="#542c15" stroke-width="0.8" opacity="0.9">
    <path d="M 240,342 L 120,392" /><path d="M 240,342 L 180,392" />
    <path d="M 240,342 L 300,392" /><path d="M 240,342 L 360,392" />
    <path d="M 100,392 Q 240,372 380,392" />
  </g>

  <!-- Title plaque -->
  <path d="M 90,430 Q 240,420 390,430 Q 390,470 390,470 Q 240,480 90,470 Z" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" />
  <text x="240" y="462" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="27" font-weight="bold" fill="#542c15" text-anchor="middle" letter-spacing="7">
    QUAI DES ORFÈVRES
  </text>
  <text x="240" y="502" font-family="&#39;Times New Roman&#39;, serif" font-size="12" fill="#7a5230" text-anchor="middle" letter-spacing="8">
    36 · PARIS · MM
  </text>
  <!-- Small flourishes beside the subtitle -->
  <path d="M 120,496 Q 140,488 160,496 M 320,496 Q 340,488 360,496" fill="none" stroke="url(#goldAcc)" stroke-width="1" />

  <!-- Engraved compass rose -->
  <g transform="translate(240, 546)" stroke="#542c15" fill="none">
    <circle r="24" stroke-width="1.2" />
    <circle r="17" stroke-width="0.7" />
    <path d="M 0,-24 L 4,-4 L 24,0 L 4,4 L 0,24 L -4,4 L -24,0 L -4,-4 Z" stroke-width="1" />
    <line x1="0" y1="-24" x2="0" y2="24" stroke-width="0.5" /><line x1="-24" y1="0" x2="24" y2="0" stroke-width="0.5" />
    <circle r="3" stroke-width="0.8" />
    <text x="0" y="-29" font-family="&#39;Times New Roman&#39;, serif" font-size="10" fill="#542c15" text-anchor="middle" stroke="none">N</text>
  </g>
</svg>
