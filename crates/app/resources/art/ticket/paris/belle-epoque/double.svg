<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Vintage Ticket Paper Gradient -->
    <linearGradient id="doubleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8" />
      <stop offset="50%" stop-color="#f4ebd0" />
      <stop offset="100%" stop-color="#e2d2a9" />
    </linearGradient>

    <!-- Ornate Gold/Bronze Accents -->
    <linearGradient id="ticketGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#dfbe6f" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ticket Body (Wider Format for Double Ticket) -->
  <rect x="10" y="10" width="480" height="180" rx="8" ry="8" fill="url(#doubleCard)" stroke="url(#ticketGold)" stroke-width="2.5" filter="url(#ticketShadow)" />

  <!-- Perforation Cutouts / Notches on Sides -->
  <circle cx="10" cy="100" r="10" fill="#0d111a" />
  <circle cx="490" cy="100" r="10" fill="#0d111a" />

  <!-- Vertical Center Perforation Line (Dividing the Double Ticket) -->
  <line x1="250" y1="18" x2="250" y2="182" stroke="#8c6200" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7" />
  <circle cx="250" cy="18" r="4" fill="#8c6200" />
  <circle cx="250" cy="182" r="4" fill="#8c6200" />

  <!-- Inner Ornate Border Frames (Left and Right Sections) -->
  <rect x="18" y="18" width="224" height="164" rx="4" ry="4" fill="none" stroke="#542c15" stroke-width="1" opacity="0.4" />
  <rect x="258" y="18" width="224" height="164" rx="4" ry="4" fill="none" stroke="#542c15" stroke-width="1" opacity="0.4" />

  <!-- === LEFT SECTION: PARTIE I (CONTROL / POLICE) === -->
  <!-- Header Left -->
  <text x="130" y="42" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="10" font-weight="bold" fill="#542c15" text-anchor="middle" letter-spacing="2">
    SECTION I · CONTRÔLE
  </text>
  <line x1="45" y1="48" x2="215" y2="48" stroke="url(#ticketGold)" stroke-width="1" />

  <!-- Icon Left: Magnifying Glass / Badge Motif -->
  <g transform="translate(115, 60)" stroke="url(#ticketGold)" stroke-width="2" fill="none">
    <circle r="16" />
    <line x1="11" y1="11" x2="22" y2="22" stroke-width="2.5" />
    <text x="0" y="5" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="16" font-weight="bold" fill="#1c120a" text-anchor="middle" stroke="none">36</text>
  </g>

  <!-- Title Left -->
  <text x="130" y="112" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="20" font-weight="bold" fill="#1c120a" text-anchor="middle" letter-spacing="2">
    DOUBLE
  </text>
  <text x="130" y="130" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" font-weight="bold" fill="#7a5230" text-anchor="middle" letter-spacing="1">
    PASSAGE DOUBLE · TICKET A
  </text>

  <!-- Serial Left -->
  <text x="30" y="165" font-family="&#39;Courier Prime&#39;, monospace" font-size="9" fill="#542c15">N° 03660-1</text>


  <!-- === RIGHT SECTION: PARTIE II (TRANSIT / CORRESPONDANCE) === -->
  <!-- Header Right -->
  <text x="370" y="42" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="10" font-weight="bold" fill="#542c15" text-anchor="middle" letter-spacing="2">
    SECTION II · CORRESPONDANCE
  </text>
  <line x1="285" y1="48" x2="455" y2="48" stroke="url(#ticketGold)" stroke-width="1" />

  <!-- Icon Right: Interchange / Dual Arrow Motif -->
  <g transform="translate(370, 68)" fill="#2a1810">
    <path d="M -15,-6 L -5,-12 L -5,-2 L -15,-6 Z" />
    <rect x="-5" y="-8" width="20" height="4" rx="1" />
    <path d="M 15,6 L 5,12 L 5,2 L 15,6 Z" />
  </g>

  <!-- Title Right -->
  <text x="370" y="112" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="15" font-weight="bold" fill="#1c120a" text-anchor="middle" letter-spacing="2">
    CORRESPONDANCE
  </text>
  <text x="370" y="130" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" font-weight="bold" fill="#7a5230" text-anchor="middle" letter-spacing="1">
    RÉSEAU GÉNÉRAL · TICKET B
  </text>

  <!-- Serial Right & Brand -->
  <text x="270" y="165" font-family="&#39;Courier Prime&#39;, monospace" font-size="9" fill="#542c15">N° 03660-2</text>
  <text x="470" y="165" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="9" font-weight="bold" fill="#b8860b" text-anchor="end" letter-spacing="1">
    QUAI DES ORFÈVRES
  </text>
</svg>