<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <!-- Ticket Card Background Gradient (Deep Noir Smoke & Velvet) -->
    <radialGradient id="ticketBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="65%" stop-color="#0d1118" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients for Frame & Accents -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="ticketShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ticketShadow)">
    <!-- 1. Main Ticket Card Base (Rounded Ornate Rectangle) -->
    <rect x="10" y="10" width="140" height="200" rx="8" ry="8" fill="url(#ticketBg)" stroke="url(#goldAcc)" stroke-width="2.5" />

    <!-- 2. Inner Filigree Double Border -->
    <rect x="16" y="16" width="128" height="188" rx="5" ry="5" fill="none" stroke="#2c3848" stroke-width="1.2" />
    <rect x="20" y="20" width="120" height="180" rx="3" ry="3" fill="none" stroke="url(#goldAcc)" stroke-width="1" stroke-dasharray="4,3" opacity="0.85" />

    <!-- 3. Corner Fleur-de-Lys / Ornate Corner Accents -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 20,28 L 26,20 L 32,28 Z" />
      <path d="M 20,192 L 26,200 L 32,192 Z" />
      <path d="M 28,20 L 20,26 L 28,32 Z" />
      <path d="M 132,20 L 140,26 L 132,32 Z" />
    </g>

    <!-- 4. Central Ticket Motif: Corbeau's Phantom Mask & Mystery Mask Emblem -->
    <g transform="translate(80, 85)" filter="url(#glowFilter)">
      <!-- Outer Mystery Ring -->
      <circle cx="0" cy="0" r="32" fill="#090d14" stroke="url(#goldAcc)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#2c3848" stroke-width="1" stroke-dasharray="3,2" />
      
      <!-- Corbeau / Phantom Silhouette Mask Motif -->
      <path d="M -16,-6 C -16,-16 16,-16 16,-6 C 16,10 8,14 0,18 C -8,14 -16,10 -16,-6 Z" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1.2" />
      
      <!-- Mask Eye Slits -->
      <polygon points="-8,-4 -4,-8 0,-4 -4,-2" fill="#040609" stroke="url(#goldAcc)" stroke-width="0.5" />
      <polygon points="8,-4 4,-8 0,-4 4,-2" fill="#040609" stroke="url(#goldAcc)" stroke-width="0.5" />
      
      <!-- Hidden / Incognito Question Mark / Feather Trace -->
      <path d="M 0,-12 Q 6,-18 10,-12 Q 12,-6 4,0 L 0,4" fill="none" stroke="#dfbe6f" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="0" cy="9" r="1.2" fill="#dfbe6f" />
    </g>

    <!-- 5. Ticket Classification Header -->
    <g transform="translate(80, 138)">
      <text x="0" y="0" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="9" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="2">
        GEHEIM-TICKET
      </text>
    </g>

    <!-- 6. Bottom Plaque / Label Banner ("BLACK TICKET") -->
    <g transform="translate(80, 168)">
      <path d="M -54,-12 Q 0,-16 54,-12 Q 54,12 54,12 Q 0,16 -54,12 Z" fill="#0d1118" stroke="url(#goldAcc)" stroke-width="1.5" />
      <text x="0" y="3.5" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="11" font-weight="bold" fill="#fef0cd" text-anchor="middle" letter-spacing="2" filter="url(#glowFilter)">
        BLACK TICKET
      </text>
    </g>

    <!-- 7. Game Rule Sub-Tag (R5 Spec) -->
    <text x="80" y="196" font-family="&#39;Courier New&#39;, monospace" font-size="5" fill="#8899aa" text-anchor="middle" letter-spacing="0.5">
      ANY TRANSPORT • HIDDEN
    </text>
  </g>
</svg>