<!-- ============================================================
     TICKET (COMIC) — TINTABLE MASTER
     Comic-style ticket stub shared by all transport tickets,
     parametrized per variant.

     Parametrization contract:
     - #ticket-accents carries the per-kind accent colour on the
       corner rivets (fill substitution).
     - The icon container carries id "ticket-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #ticket-title / #ticket-serial carry the ticket text
       (texts + fill substitutions).
     - #ticket-shadow allows tuning the hard offset shadow.
     - Paper/ink elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi ticket.
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow id="ticket-shadow" dx="3" dy="3" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Ticket Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)">

    <!-- Main Ticket Card Body (Paper Cream fill with Thick Ink Stroke) -->
    <rect x="15" y="15" width="370" height="170" rx="10" ry="10" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.5" />
    <rect x="23" y="23" width="354" height="154" rx="6" ry="6" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Inner Dashed Border Line -->
    <rect x="29" y="29" width="342" height="142" rx="4" ry="4" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Corner Rivets / Nails (parametrized via #ticket-accents) -->
    <g id="ticket-accents" fill="#16A34A" stroke="#1C1917" stroke-width="1.2">
      <circle cx="35" cy="35" r="3" />
      <circle cx="365" cy="35" r="3" />
      <circle cx="35" cy="165" r="3" />
      <circle cx="365" cy="165" r="3" />
    </g>

    <!-- Left & Right Notch Connectors -->
    <circle cx="15" cy="100" r="9" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />
    <circle cx="385" cy="100" r="9" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />

    <!-- Central Icon (parametrized via #ticket-glyph) -->
