<path d="M 12,42 L 12,22 Q 12,10 48,10 Q 84,10 84,22 L 84,42 Z" fill="#1C1917" stroke="url(#ticketAcc)" stroke-width="1.2" />
<path d="M 18,42 L 18,24 Q 18,16 48,16 Q 78,16 78,24 L 78,42 Z" fill="#1C1917" />
<path d="M 36,42 Q 48,38 60,42 Z" fill="#1C1917" opacity="0.8" />
