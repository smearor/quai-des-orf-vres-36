<!-- ============================================================
     TICKET (NEON) — TINTABLE MASTER
     Neon-style ticket stub shared by all transport tickets,
     parametrized per variant.

     Parametrization contract:
     - The icon container carries id "ticket-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #ticket-title carries the ticket label (texts + fill
       substitution); the scanline #ticket-divider and corner
       #ticket-accents may be re-coloured per kind.
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi ticket.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 0,100 L 400,100 M 200,0 L 200,200" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Main Ticket Card Body -->
    <rect x="15" y="15" width="370" height="170" rx="8" ry="8" fill="#0B1020" stroke="#A78BFA" stroke-width="2.5" filter="url(#neonGlow)" />
    <rect x="23" y="23" width="354" height="154" rx="4" ry="4" fill="#0F1730" stroke="#16224A" stroke-width="1.5" />

    <!-- Inner Dashed Neon Border (parametrized via #ticket-accents) -->
    <rect id="ticket-accents" x="29" y="29" width="342" height="142" rx="2" ry="2" fill="none" stroke="#FB7185" stroke-width="1" stroke-dasharray="6,4" opacity="0.8" filter="url(#neonGlow)" />

    <!-- Circuit Corners -->
    <g id="ticket-corners" fill="#FB7185" filter="url(#neonGlow)">
      <circle cx="35" cy="35" r="3" />
      <circle cx="365" cy="35" r="3" />
      <circle cx="35" cy="165" r="3" />
      <circle cx="365" cy="165" r="3" />
    </g>

    <!-- Side Terminal Slots -->
    <path d="M 15,90 L 23,90 L 23,110 L 15,110 Z" fill="#16224A" stroke="#4D7CFE" stroke-width="1" />
    <path d="M 385,90 L 377,90 L 377,110 L 385,110 Z" fill="#16224A" stroke="#4D7CFE" stroke-width="1" />

    <!-- Central Neon Icon (parametrized via #ticket-glyph) -->
    <g id="ticket-glyph" transform="translate(85, 100)" filter="url(#neonGlow)"><path d="M -22,18 L -22,-2 Q -22,-16 0,-16 Q 22,-16 22,-2 L 22,18 Z" fill="#0B1020" stroke="#FB7185" stroke-width="2" />
<path d="M -14,18 L -14,0 Q -14,-8 0,-8 Q 14,-8 14,0 L 14,18" fill="#0B1020" stroke="#FB7185" stroke-width="1.5" />
<line x1="-22" y1="6" x2="-14" y2="6" stroke="#FB7185" stroke-width="1" />
<line x1="14" y1="6" x2="22" y2="6" stroke="#FB7185" stroke-width="1" />
<circle cx="0" cy="-4" r="2.5" fill="#FB7185" />
<path d="M -10,20 Q 0,17 10,20" fill="none" stroke="#FB7185" stroke-width="1.2" stroke-linecap="round" /></g>

