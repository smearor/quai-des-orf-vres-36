<!-- ============================================================
     TICKET — TINTABLE MASTER
     Belle-Époque ticket stub shared by all transport tickets
     (taxi, bus, métro, batobus day/night, égouts), parametrized
     per variant.

     Parametrization contract:
     - Palette (substitutions): paper stops "ticket-paper-hi/-mid/
       -lo", accent stops "ticket-acc-hi/-mid/-lo", #ticket-shadow
       flood-opacity, #ticket-notches fill, #ticket-frame
       stroke/opacity, #ticket-divider stroke, text fills on
       #ticket-header/-title/-subtitle/-serial/-brand.
     - The icon container carries id "ticket-glyph" — its inner
       markup is replaced per variant (fills) and its transform
       attribute may be substituted.
     - Header/title/subtitle/serial texts live in
       #ticket-header/-title/-subtitle/-serial (texts).
     - Typography and layout are fixed.

     Defaults below render the taxi ticket (parchment + gold).
     See variants.toml for all variants (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Ticket Paper Gradient (parametrized via stop ids) -->
    <linearGradient id="ticketPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop id="ticket-paper-hi" offset="0%" stop-color="#141923" />
      <stop id="ticket-paper-mid" offset="50%" stop-color="#0b0e14" />
      <stop id="ticket-paper-lo" offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Ornate Accent Gradient (parametrized via stop ids; gold default) -->
    <linearGradient id="ticketAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="ticket-acc-hi" offset="0%" stop-color="#b8860b" />
      <stop id="ticket-acc-mid" offset="50%" stop-color="#dfbe6f" />
      <stop id="ticket-acc-lo" offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow id="ticket-shadow" dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ticket Body with Rounded Corners & Shadow -->
  <rect x="10" y="10" width="380" height="180" rx="8" ry="8" fill="url(#ticketPaper)" stroke="url(#ticketAcc)" stroke-width="2.5" filter="url(#ticketShadow)" />

  <!-- Perforation Cutouts / Notches on Sides (parametrized via #ticket-notches) -->
  <g id="ticket-notches" fill="#05070a">
    <circle cx="10" cy="100" r="10" />
    <circle cx="390" cy="100" r="10" />
  </g>

  <!-- Inner Ornate Border Frame (parametrized via #ticket-frame) -->
  <rect id="ticket-frame" x="18" y="18" width="364" height="164" rx="4" ry="4" fill="none" stroke="#324454" stroke-width="1" opacity="0.4" />
  <rect x="21" y="21" width="358" height="158" rx="3" ry="3" fill="none" stroke="url(#ticketAcc)" stroke-width="1.5" opacity="0.8" />

  <!-- Corner Flourishes -->
  <g fill="url(#ticketAcc)" opacity="0.8">
    <circle cx="26" cy="26" r="3" />
    <circle cx="374" cy="26" r="3" />
    <circle cx="26" cy="174" r="3" />
    <circle cx="374" cy="174" r="3" />
  </g>

  <!-- Header: Transport / Company (parametrized via #ticket-header) -->
  <text id="ticket-header" x="200" y="44" font-family="&#39;Times New Roman&#39;, serif" font-size="12" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="3">NAVIGATION FLUVIALE DE LA SEINE</text>
  <line x1="60" y1="52" x2="340" y2="52" stroke="url(#ticketAcc)" stroke-width="1" />

  <!-- Central Icon (parametrized via #ticket-glyph) -->
  <g id="ticket-glyph" transform="translate(38, 56)"><path d="M 6,42 Q 18,38 30,42 Q 42,46 54,42 Q 66,38 78,42 Q 90,46 94,42" fill="none" stroke="#dfbe6f" stroke-width="1.5" opacity="0.6" />
<path d="M 12,34 L 22,26 L 74,26 L 84,34 Q 84,38 48,38 Q 12,38 12,34 Z" fill="#1c2d37" stroke="url(#ticketAcc)" stroke-width="1" />
<rect x="26" y="16" width="44" height="12" rx="1" fill="#141c2b" stroke="url(#ticketAcc)" stroke-width="0.8" />
<rect x="30" y="18" width="8" height="8" fill="#fef0cd" opacity="0.9" />
<rect x="42" y="18" width="8" height="8" fill="#fef0cd" opacity="0.9" />
<rect x="54" y="18" width="8" height="8" fill="#fef0cd" opacity="0.9" />
<line x1="48" y1="16" x2="48" y2="10" stroke="url(#ticketAcc)" stroke-width="1" />
<rect x="22" y="14" width="52" height="3" rx="1" fill="url(#ticketAcc)" /></g>

  <!-- Ticket Main Title (parametrized via #ticket-title) -->
  <text id="ticket-title" x="220" y="92" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="28" font-weight="bold" fill="#fef0cd" letter-spacing="2">BATOBUS</text>

  <!-- Subtitle / Route Description (parametrized via #ticket-subtitle) -->
  <text id="ticket-subtitle" x="220" y="115" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="1">NAVETTE FLUVIALE · NUIT</text>

  <!-- Divider Dashed Line (parametrized via #ticket-divider) -->
  <line id="ticket-divider" x1="50" y1="130" x2="350" y2="130" stroke="#8c6200" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Footer Info / Serial Number (parametrized via #ticket-serial) -->
  <text id="ticket-serial" x="35" y="155" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#94a3b8" letter-spacing="1">N° 03651-B</text>

  <text id="ticket-brand" x="365" y="155" font-family="&#39;Times New Roman&#39;, serif" font-size="11" font-weight="bold" fill="url(#ticketAcc)" text-anchor="end" letter-spacing="2">
    QUAI DES ORFÈVRES
  </text>
</svg>
