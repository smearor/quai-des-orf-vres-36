<!-- ============================================================
     STATION MARKER — TINTABLE MASTER
     Map pin badge shared by all transport station markers and
     landmark anchors, parametrized per variant.

     Parametrization contract:
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted for per-glyph vertical offsets.
     - The label plate path carries id "station-plate" — its `d`
       attribute is substituted for wider/narrower plates.
     - The label lives in <text id="station-label"> — replace its
       character data (texts) and font-size/letter-spacing
       attributes (substitutions) per variant.
     - All ring/filigree/shadow elements are colour-neutral and
       must NOT be tinted.

     Defaults below render the taxi station marker.
     See variants.toml for all variants (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient for Map Marker -->
    <radialGradient id="markerBg" cx="50%" cy="40%" r="60%">
      <stop id="marker-hi" offset="0%" stop-color="#1c2436" />
      <stop id="marker-mid" offset="70%" stop-color="#0d131d" />
      <stop id="marker-lo" offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Ring & Silhouette Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for 3D Map Anchor Depth -->
    <filter id="anchorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow id="station-shadow" dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#anchorShadow)">
    <!-- 1. Bottom Anchor Pin / Pointer Triangle -->
    <polygon points="100,230 85,170 115,170" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <polygon id="station-pin-inner" points="100,222 90,172 110,172" fill="#0d131d" />

    <!-- 2. Main Circular Ornate Badge / Ring -->
    <circle cx="100" cy="100" r="85" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2.5" />
    <circle cx="100" cy="100" r="78" fill="url(#markerBg)" />

    <!-- 3. Inner Filigree Border -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#2c3848" stroke-width="1" stroke-dasharray="4,3" opacity="0.8" />

    <!-- 4. Corner Fleur-de-Lys Accents on Ring -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 100,12 L 103,20 L 100,24 L 97,20 Z" />
      <path d="M 100,188 L 103,180 L 100,176 L 97,180 Z" />
      <path d="M 12,100 L 20,103 L 24,100 L 20,97 Z" />
      <path d="M 188,100 L 180,103 L 176,100 L 180,97 Z" />
    </g>

    <!-- 5. Central Station Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 103)" filter="url(#glowFilter)"><rect x="-30" y="-16" width="60" height="30" rx="3" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1.2" />
<rect x="-24" y="-12" width="12" height="10" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<rect x="-8" y="-12" width="12" height="10" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<rect x="8" y="-12" width="12" height="10" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<rect x="-24" y="2" width="14" height="8" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<rect x="-6" y="2" width="14" height="8" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<rect x="12" y="2" width="12" height="8" rx="1" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="0.8" />
<circle cx="-18" cy="18" r="6" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.2" />
<circle cx="18" cy="18" r="6" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.2" />
<line x1="-26" y1="-16" x2="26" y2="-16" stroke="url(#goldAcc)" stroke-width="1.5" />
<line x1="-20" y1="-21" x2="20" y2="-21" stroke="url(#goldAcc)" stroke-width="1" />
<line x1="-12" y1="-16" x2="-12" y2="-21" stroke="url(#goldAcc)" stroke-width="0.8" />
<line x1="12" y1="-16" x2="12" y2="-21" stroke="url(#goldAcc)" stroke-width="0.8" /></g>

    <!-- 6. Bottom Banner / Label Plate on Ring (parametrized via #station-plate + #station-label) -->
    <g transform="translate(100, 155)">
      <path id="M -35,-8 Q 0,-12 35,-8 Q 35,8 35,8 Q 0,12 -35,8 Z" d="M -35,-8 Q 0,-12 35,-8 Q 35,8 35,8 Q 0,12 -35,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1" />
      <g id="station-label" fill="#dfbe6f"><path d="M-6.26,0.32 L-6.17,0.18 Q-5.62,0.18 -5.21,0.35 Q-4.81,0.53 -4.58,0.84 Q-4.36,1.14 -4.36,1.55 Q-4.36,1.97 -4.60,2.30 Q-4.84,2.64 -5.26,2.84 Q-5.68,3.03 -6.21,3.03 Q-6.42,3.03 -6.76,3.01 Q-7.09,2.98 -7.36,2.98 Q-7.65,2.98 -7.91,2.99 Q-8.17,3.00 -8.38,3.00 Q-8.40,3.00 -8.40,2.95 Q-8.40,2.90 -8.38,2.90 Q-8.15,2.90 -8.03,2.86 Q-7.90,2.82 -7.85,2.70 Q-7.80,2.58 -7.80,2.35 L-7.80,-1.35 Q-7.80,-1.58 -7.85,-1.70 Q-7.90,-1.82 -8.02,-1.86 Q-8.14,-1.90 -8.37,-1.90 Q-8.38,-1.90 -8.38,-1.95 Q-8.38,-2.00 -8.37,-2.00 Q-8.16,-2.00 -7.90,-1.99 Q-7.65,-1.98 -7.36,-1.98 Q-7.13,-1.98 -6.88,-2.00 Q-6.63,-2.02 -6.38,-2.02 Q-5.90,-2.02 -5.56,-1.91 Q-5.22,-1.79 -5.03,-1.56 Q-4.85,-1.34 -4.85,-0.99 Q-4.85,-0.55 -5.20,-0.19 Q-5.55,0.18 -6.26,0.32 ZM-6.50,-1.85 Q-6.65,-1.85 -6.74,-1.80 Q-6.83,-1.75 -6.87,-1.64 Q-6.90,-1.54 -6.90,-1.34 L-6.90,0.23 L-7.20,0.18 Q-6.94,0.18 -6.77,0.19 Q-6.60,0.19 -6.58,0.19 Q-6.15,0.19 -5.94,-0.13 Q-5.72,-0.46 -5.72,-0.92 Q-5.72,-1.22 -5.81,-1.43 Q-5.90,-1.64 -6.08,-1.74 Q-6.25,-1.85 -6.50,-1.85 ZM-6.34,2.83 Q-5.79,2.83 -5.54,2.55 Q-5.30,2.26 -5.30,1.74 Q-5.30,1.15 -5.58,0.78 Q-5.86,0.41 -6.49,0.41 Q-6.57,0.41 -6.76,0.41 Q-6.95,0.42 -7.17,0.46 L-6.90,0.36 L-6.90,2.35 Q-6.90,2.51 -6.87,2.62 Q-6.83,2.73 -6.71,2.78 Q-6.59,2.83 -6.34,2.83 ZM2.12,-0.98 Q2.12,-1.40 1.93,-1.65 Q1.73,-1.90 1.38,-1.90 Q1.36,-1.90 1.36,-1.95 Q1.36,-2.00 1.38,-2.00 Q1.58,-2.00 1.79,-1.99 Q2.00,-1.98 2.25,-1.98 Q2.47,-1.98 2.68,-1.99 Q2.88,-2.00 3.06,-2.00 Q3.08,-2.00 3.08,-1.95 Q3.08,-1.90 3.06,-1.90 Q2.74,-1.90 2.57,-1.65 Q2.40,-1.40 2.40,-0.98 L2.40,1.25 Q2.40,1.82 2.15,2.24 Q1.90,2.66 1.45,2.88 Q1.00,3.11 0.40,3.11 Q-0.18,3.11 -0.64,2.89 Q-1.10,2.66 -1.36,2.24 Q-1.62,1.82 -1.62,1.23 L-1.62,-1.35 Q-1.62,-1.58 -1.66,-1.70 Q-1.70,-1.82 -1.82,-1.86 Q-1.95,-1.90 -2.19,-1.90 Q-2.21,-1.90 -2.21,-1.95 Q-2.21,-2.00 -2.19,-2.00 Q-1.98,-2.00 -1.72,-1.99 Q-1.47,-1.98 -1.18,-1.98 Q-0.88,-1.98 -0.62,-1.99 Q-0.36,-2.00 -0.16,-2.00 Q-0.14,-2.00 -0.14,-1.95 Q-0.14,-1.90 -0.16,-1.90 Q-0.40,-1.90 -0.52,-1.86 Q-0.64,-1.81 -0.69,-1.69 Q-0.73,-1.57 -0.73,-1.34 L-0.73,0.95 Q-0.73,1.94 -0.34,2.38 Q0.05,2.82 0.71,2.82 Q1.37,2.82 1.75,2.41 Q2.12,2.01 2.12,1.26 L2.12,-0.98 ZM5.98,-1.19 Q5.98,-0.89 6.13,-0.66 Q6.29,-0.43 6.54,-0.25 Q6.79,-0.06 7.07,0.12 Q7.38,0.31 7.65,0.52 Q7.93,0.74 8.11,1.01 Q8.29,1.29 8.29,1.67 Q8.29,2.10 8.06,2.42 Q7.83,2.74 7.44,2.92 Q7.06,3.10 6.56,3.10 Q6.32,3.10 6.06,3.05 Q5.80,3.00 5.59,2.93 Q5.38,2.86 5.28,2.78 Q5.25,2.75 5.22,2.72 Q5.20,2.70 5.20,2.62 L5.18,1.35 Q5.17,1.31 5.21,1.31 Q5.26,1.30 5.26,1.34 Q5.38,1.58 5.53,1.86 Q5.67,2.14 5.85,2.37 Q6.03,2.60 6.26,2.75 Q6.48,2.90 6.77,2.90 Q6.95,2.90 7.12,2.83 Q7.29,2.77 7.40,2.60 Q7.50,2.43 7.50,2.14 Q7.50,1.76 7.34,1.49 Q7.17,1.22 6.90,1.02 Q6.64,0.82 6.35,0.63 Q6.07,0.45 5.82,0.25 Q5.56,0.06 5.40,-0.20 Q5.24,-0.45 5.24,-0.80 Q5.24,-1.25 5.49,-1.53 Q5.74,-1.82 6.13,-1.95 Q6.52,-2.09 6.92,-2.09 Q7.21,-2.09 7.50,-2.04 Q7.78,-1.98 7.95,-1.91 Q8.03,-1.88 8.05,-1.84 Q8.07,-1.80 8.07,-1.75 L8.07,-0.58 Q8.07,-0.55 8.04,-0.54 Q8.00,-0.53 7.98,-0.55 Q7.94,-0.65 7.85,-0.87 Q7.76,-1.09 7.62,-1.33 Q7.47,-1.57 7.25,-1.74 Q7.02,-1.91 6.70,-1.91 Q6.50,-1.91 6.34,-1.83 Q6.18,-1.75 6.08,-1.60 Q5.98,-1.44 5.98,-1.19 Z"/></g>
    </g>
  </g>
</svg>
