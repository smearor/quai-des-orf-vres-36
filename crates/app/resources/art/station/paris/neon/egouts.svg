<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#FB7185" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#FB7185" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><path d="M -32,22 L -32,2 C -32,-18 32,-18 32,2 L 32,22 Z" fill="#0F1730" stroke="#C9D4FF" stroke-width="1.2" />
<path d="M -24,20 L -24,4 C -24,-10 24,-10 24,4 L 24,20 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1" />
<path d="M -8,20 Q 0,14 8,20 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<path d="M -5,18 Q 0,15 5,18" fill="none" stroke="#C9D4FF" stroke-width="0.8" opacity="0.8" />
<line x1="-24" y1="12" x2="-8" y2="12" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="8" y1="12" x2="24" y2="12" stroke="#C9D4FF" stroke-width="1.2" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-42" y="-12" width="84" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-20.20,4.00 L-20.20,-1.40 L-15.23,-1.40 L-15.23,-0.40 L-19.21,-0.40 L-19.21,0.80 L-16.01,0.80 L-16.01,1.80 L-19.21,1.80 L-19.21,3.00 L-15.23,3.00 L-15.23,4.00 L-20.20,4.00 ZM-18.20,-1.85 L-18.20,-1.85 L-17.85,-3.22 L-16.86,-3.22 L-17.20,-1.85 L-18.20,-1.85 ZM-12.43,4.00 Q-12.72,4.00 -12.95,3.86 Q-13.19,3.71 -13.33,3.48 Q-13.47,3.24 -13.47,2.96 L-13.47,-0.36 Q-13.47,-0.64 -13.33,-0.88 Q-13.19,-1.12 -12.95,-1.26 Q-12.72,-1.40 -12.43,-1.40 L-9.12,-1.40 Q-8.84,-1.40 -8.60,-1.26 Q-8.36,-1.12 -8.22,-0.88 Q-8.07,-0.64 -8.07,-0.36 L-8.07,0.06 L-9.07,0.06 L-9.07,-0.31 Q-9.07,-0.35 -9.10,-0.38 Q-9.13,-0.40 -9.17,-0.40 L-12.39,-0.40 Q-12.43,-0.40 -12.46,-0.38 Q-12.48,-0.35 -12.48,-0.31 L-12.48,2.91 Q-12.48,2.95 -12.46,2.98 Q-12.43,3.00 -12.39,3.00 L-9.17,3.00 Q-9.13,3.00 -9.10,2.98 Q-9.07,2.95 -9.07,2.91 L-9.07,1.94 L-10.29,1.94 L-10.29,0.94 L-8.07,0.94 L-8.07,2.96 Q-8.07,3.24 -8.22,3.48 Q-8.36,3.71 -8.60,3.86 Q-8.84,4.00 -9.12,4.00 L-12.43,4.00 ZM-5.22,4.00 Q-5.51,4.00 -5.74,3.86 Q-5.98,3.71 -6.12,3.48 Q-6.26,3.24 -6.26,2.96 L-6.26,-0.36 Q-6.26,-0.64 -6.12,-0.88 Q-5.98,-1.12 -5.74,-1.26 Q-5.51,-1.40 -5.22,-1.40 L-1.91,-1.40 Q-1.62,-1.40 -1.38,-1.26 Q-1.15,-1.12 -1.01,-0.88 Q-0.86,-0.64 -0.86,-0.36 L-0.86,2.96 Q-0.86,3.24 -1.01,3.48 Q-1.15,3.71 -1.38,3.86 Q-1.62,4.00 -1.91,4.00 L-5.22,4.00 ZM-5.18,3.00 L-1.96,3.00 Q-1.92,3.00 -1.89,2.98 Q-1.86,2.95 -1.86,2.91 L-1.86,-0.31 Q-1.86,-0.35 -1.89,-0.38 Q-1.92,-0.40 -1.96,-0.40 L-5.18,-0.40 Q-5.22,-0.40 -5.25,-0.38 Q-5.27,-0.35 -5.27,-0.31 L-5.27,2.91 Q-5.27,2.95 -5.25,2.98 Q-5.22,3.00 -5.18,3.00 ZM1.99,4.00 Q1.70,4.00 1.47,3.86 Q1.23,3.71 1.09,3.48 Q0.95,3.24 0.95,2.96 L0.95,-1.40 L1.94,-1.40 L1.94,2.91 Q1.94,2.95 1.96,2.98 Q1.99,3.00 2.03,3.00 L5.25,3.00 Q5.29,3.00 5.32,2.98 Q5.35,2.95 5.35,2.91 L5.35,-1.40 L6.35,-1.40 L6.35,2.96 Q6.35,3.24 6.20,3.48 Q6.06,3.71 5.83,3.86 Q5.59,4.00 5.30,4.00 L1.99,4.00 L1.99,4.00 ZM10.11,4.00 L10.11,4.00 L10.11,-0.40 L7.90,-0.40 L7.90,-1.40 L13.3