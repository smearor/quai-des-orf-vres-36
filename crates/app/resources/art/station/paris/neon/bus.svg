<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#FF7A3D" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#FF7A3D" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><rect x="-30" y="-16" width="60" height="30" rx="3" fill="#0F1730" stroke="#C9D4FF" stroke-width="1.2" />
<rect x="-24" y="-12" width="12" height="10" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<rect x="-8" y="-12" width="12" height="10" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<rect x="8" y="-12" width="12" height="10" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<rect x="-24" y="2" width="14" height="8" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<rect x="-6" y="2" width="14" height="8" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<rect x="12" y="2" width="12" height="8" rx="1" fill="#0B1020" stroke="#C9D4FF" stroke-width="0.8" />
<circle cx="-18" cy="18" r="6" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<circle cx="18" cy="18" r="6" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="-26" y1="-16" x2="26" y2="-16" stroke="#C9D4FF" stroke-width="1.5" />
<line x1="-20" y1="-21" x2="20" y2="-21" stroke="#C9D4FF" stroke-width="1" />
<line x1="-12" y1="-16" x2="-12" y2="-21" stroke="#C9D4FF" stroke-width="0.8" />
<line x1="12" y1="-16" x2="12" y2="-21" stroke="#C9D4FF" stroke-width="0.8" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-39" y="-12" width="78" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-10.97,4.00 L-10.97,-1.76 L-6.56,-1.76 Q-6.25,-1.76 -6.00,-1.61 Q-5.75,-1.46 -5.60,-1.20 Q-5.44,-0.95 -5.44,-0.65 L-5.44,0.48 Q-5.44,0.58 -5.46,0.68 Q-5.48,0.78 -5.52,0.86 Q-5.38,1.05 -5.30,1.25 Q-5.21,1.45 -5.21,1.65 L-5.21,2.89 Q-5.21,3.19 -5.36,3.44 Q-5.52,3.70 -5.77,3.85 Q-6.03,4.00 -6.33,4.00 L-10.97,4.00 L-10.97,4.00 ZM-9.82,2.94 L-6.38,2.94 Q-6.34,2.94 -6.31,2.91 Q-6.28,2.88 -6.28,2.84 L-6.28,1.70 Q-6.28,1.66 -6.31,1.63 Q-6.34,1.60 -6.38,1.60 L-9.82,1.60 Q-9.86,1.60 -9.89,1.63 Q-9.92,1.66 -9.92,1.70 L-9.92,2.84 Q-9.92,2.88 -9.89,2.91 Q-9.86,2.94 -9.82,2.94 ZM-9.82,0.54 L-6.60,0.54 Q-6.56,0.54 -6.54,0.51 Q-6.52,0.48 -6.52,0.44 L-6.52,-0.60 Q-6.52,-0.64 -6.54,-0.67 Q-6.56,-0.70 -6.60,-0.70 L-9.82,-0.70 Q-9.86,-0.70 -9.89,-0.67 Q-9.92,-0.64 -9.92,-0.60 L-9.92,0.44 Q-9.92,0.48 -9.89,0.51 Q-9.86,0.54 -9.82,0.54 ZM-1.74,4.00 Q-2.05,4.00 -2.30,3.85 Q-2.55,3.70 -2.70,3.44 Q-2.86,3.19 -2.86,2.89 L-2.86,-1.76 L-1.80,-1.76 L-1.80,2.84 Q-1.80,2.88 -1.77,2.91 Q-1.74,2.94 -1.70,2.94 L1.74,2.94 Q1.78,2.94 1.81,2.91 Q1.84,2.88 1.84,2.84 L1.84,-1.76 L2.90,-1.76 L2.90,2.89 Q2.90,3.19 2.75,3.44 Q2.60,3.70 2.35,3.85 Q2.10,4.00 1.79,4.00 L-1.74,4.00 L-1.74,4.00 ZM6.37,4.00 Q6.07,4.00 5.82,3.85 Q5.56,3.70 5.41,3.44 Q5.26,3.19 5.26,2.89 L5.26,2.45 L6.32,2.45 L6.32,2.84 Q6.32,2.88 6.34,2.91 Q6.37,2.94 6.41,2.94 L9.86,2.94 Q9.90,2.94 9.93,2.91 Q9.96,2.88 9.96,2.84 L9.96,1.74 Q9.96,1.70 9.93,1.68 Q9.90,1.66 9.86,1.66 L6.37,1.66 Q6.07,1.66 5.82,1.50 Q5.56,1.35 5.41,1.10 Q5.26,0.85 5.26,0.54 L5.26,-0.65 Q5.26,-0.95 5.41,-1.20 Q5.56,-1.46 5.82,-1.61 Q6.07,-1.76 6.37,-1.76 L9.91,-1.76 Q10.21,-1.76 10.46,-1.61 Q10.72,-1.46 10.87,-1.20 Q11.02,-0.95 11.02,-0.65 L11.02,-0.21 L9.96,-0.21 L9.96,-0.60 Q9.96,-0.64 9.93,-0.67 Q9.90,-0.70 9.86,-0.70 L6.41,-0.70 Q6.37,-0.70 6.34,-0.67 Q6.32,-0.64 6.32,-0.60 L6.32,0.50 Q6.32,0.54 6.34,0.56 Q6.37,0.58 6.41,0.58 L9.91,0.58 Q10.21,0.58 10.46,0.74 Q10.72,0.89 10.87,1.14 Q11.02,1.39 11.02,1.70 L11.02,2.89 Q11.02,3.19 10.87,3.44 Q10.72,3.70 10.46,3.85 Q10.21,4.00 9.91,4.00 L6.37,4.00 Z"/></g>
    </g>
  </g>
</svg>
