.96,2.52 Q5.19,2.64 5.29,2.68 Q5.63,2.80 5.92,2.80 Q6.22,2.80 6.50,2.51 Q6.77,2.22 6.77,1.80 Q6.77,1.24 6.21,1.01 Q5.94,0.90 5.60,0.84 Q4.88,0.72 4.52,0.42 Q4.16,0.12 4.16,-0.49 Q4.16,-1.10 4.68,-1.45 Q5.20,-1.80 6.02,-1.80 Z"/></g>
    </g>
  </g>
</svg>
