<!-- ============================================================
     STATION MARKER (COMIC) — TINTABLE MASTER
     Comic-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent
       colour (stroke substitution).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the label plate path (d/fill
       substitution); #station-pin-inner the pin inner fill.
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - #station-shadow allows tuning the hard offset shadow.
     - Paper/ink elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow id="station-shadow" dx="3" dy="3" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Station Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)">

    <!-- 1. Bottom Anchor Pin / Pointer Triangle (Comic Style) -->
    <polygon points="100,230 82,168 118,168" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" stroke-linejoin="round" />
    <polygon id="station-pin-inner" points="100,220 88,170 112,170" fill="#FBF6E9" />

    <!-- 2. Main Circular Badge Body -->
    <circle cx="100" cy="100" r="82" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.5" />
    <circle cx="100" cy="100" r="74" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- 3. Accent Ring per Transport Kind (parametrized via #station-accent) -->
    <circle id="station-accent" cx="100" cy="100" r="64" fill="none" stroke="#F5C518" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="5,4" />

    <!-- 4. Cardinal Ink-Burst / Comic Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 100,16 L 103,24 L 97,24 Z" />
      <path d="M 100,184 L 103,176 L 97,176 Z" />
      <path d="M 16,100 L 24,103 L 24,97 Z" />
      <path d="M 184,100 L 176,103 L 176,97 Z" />
    </g>

    <!-- 5. Central Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 95)"><path d="M -32,12 L -28,-4 L -18,-14 L 14,-14 L 26,-4 L 32,12 Z" fill="#1C1917" stroke="#1C1917" stroke-width="1.2" />
<path d="M -14,-14 L -8,-24 L 10,-24 L 14,-14 Z" fill="#1C1917" stroke="#1C1917" stroke-width="1" />
<circle cx="-20" cy="14" r="8" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />
<circle cx="-20" cy="14" r="3" fill="#1C1917" />
<circle cx="20" cy="14" r="8" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />
<circle cx="20" cy="14" r="3" fill="#1C1917" />
<rect x="-35" y="10" width="70" height="4" rx="1" fill="#1C1917" /></g>

    <!-- 6. Bottom Label / Name Plate Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 154)">
      <path id="M -35,-10 Q 0,-14 35,-10 Q 35,10 35,10 Q 0,14 -35,10 Z" d="M -38,-10 Q 0,-14 38,-10 Q 38,10 38,10 Q 0,14 -38,10 Z" fill="#F7EFE0" stroke="#1C1917" stroke-width="2.2" stroke-linejoin="round" />
      <g id="station-label" fill="#1C1917"><path d="M-9.07,-1.69 L-5.83,-1.74 Q-5.59,-1.67 -5.59,-1.51 Q-5.59,-1.11 -5.92,-1.11 Q-6.52,-1.11 -7.19,-1.08 Q-7.23,-0.39 -7.23,-0.04 Q-7.23,0.31 -7.23,0.40 L-7.20,3.21 Q-7.20,3.46 -7.33,3.50 Q-7.43,3.53 -7.57,3.53 Q-7.80,3.53 -7.83,3.27 Q-7.87,2.65 -7.87,0.97 Q-7.87,-0.72 -7.83,-1.06 Q-7.99,-1.05 -8.32,-1.05 Q-8.65,-1.05 -9.14,-1.06 Q-9.27,-1.06 -9.34,-1.14 Q-9.41,-1.22 -9.41,-1.34 Q-9.41,-1.45 -9.31,-1.56 Q-9.21,-1.68 -9.07,-1.69 ZM-2.10,-1.77 Q-1.90,-1.77 -1.77,-1.60 Q-1.63,-1.42 -1.41,-0.87 Q-0.91,0.44 -0.43,3.22 Q-0.42,3.25 -0.42,3.31 Q-0.42,3.37 -0.50,3.44 Q-0.57,3.51 -0.71,3.51 Q-0.85,3.51 -0.95,3.44 Q-1.05,3.37 -1.08,3.22 Q-1.11,3.06 -1.20,2.60 Q-1.39,1.59 -1.45,1.55 Q-1.55,1.49 -2.09,1.43 Q-2.63,1.36 -2.81,1.36 Q-2.98,1.36 -3.01,1.40 Q-3.16,1.52 -3.41,3.34 Q-3.44,3.49 -3.71,3.49 Q-3.98,3.49 -3.98,3.26 Q-3.98,2.68 -3.56,1.06 Q-3.13,-0.56 -2.85,-1.09 Q-2.50,-1.77 -2.10,-1.77 ZM-2.13,-0.88 Q-2.25,-0.88 -2.55,-0.18 Q-2.85,0.53 -2.85,0.70 Q-2.85,0.74 -2.83,0.76 Q-2.77,0.82 -2.33,0.87 Q-1.89,0.92 -1.74,0.92 Q-1.60,0.92 -1.58,0.90 Q-1.57,0.88 -1.57,0.77 Q-1.57,0.66 -1.78,-0.11 Q-2.00,-0.88 -2.13,-0.88 ZM1.73,3.54 Q1.46,3.54 1.46,3.31 Q1.46,3.18 1.53,3.05 Q1.59,2.98 2.14,2.38 Q2.69,1.77 3.15,1.20 Q2.06,-0.50 1.77,-1.02 Q1.73,-1.12 1.73,-1.23 Q1.73,-1.35 1.84,-1.47 Q1.96,-1.59 2.11,-1.59 Q2.25,-1.59 2.34,-1.45 Q3.14,-0.14 3.63,0.62 Q4.46,-0.36 5.21,-1.56 Q5.34,-1.80 5.59,-1.80 Q5.69,-1.80 5.75,-1.74 Q5.82,-1.68 5.82,-1.59 Q5.82,-1.50 5.77,-1.36 Q5.17,-0.36 3.98,1.14 Q4.67,2.24 5.25,2.92 Q5.32,3.05 5.32,3.16 Q5.32,3.28 5.20,3.40 Q5.09,3.52 4.94,3.52 Q4.80,3.52 4.69,3.44 Q4.33,2.98 3.49,1.71 Q2.96,2.34 1.97,3.44 Q1.84,3.54 1.73,3.54 ZM8.62,-1.67 Q8.78,-1.67 8.82,-1.48 Q8.83,-0.56 8.85,1.29 Q8.85,2.42 8.79,3.20 Q8.77,3.32 8.64,3.42 Q8.51,3.51 8.37,3.51 Q8.15,3.51 8.15,3.28 Q8.23,2.48 8.23,1.29 L8.18,-1.40 Q8.21,-1.51 8.33,-1.59 Q8.46,-1.67 8.62,-1.67 Z"/></g>
    </g>
  </g>
</svg>
