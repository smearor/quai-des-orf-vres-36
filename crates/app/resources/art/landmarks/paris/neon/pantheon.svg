<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><polygon points="0,-2 -26,10 26,10" fill="#C9D4FF" />
<rect x="-24" y="10" width="48" height="18" fill="#0F1730" stroke="#C9D4FF" stroke-width="1" />
<line x1="-18" y1="10" x2="-18" y2="28" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="-9" y1="10" x2="-9" y2="28" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="0" y1="10" x2="0" y2="28" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="9" y1="10" x2="9" y2="28" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="18" y1="10" x2="18" y2="28" stroke="#C9D4FF" stroke-width="1.2" />
<rect x="-14" y="-14" width="28" height="12" fill="#0B1020" stroke="#C9D4FF" stroke-width="1" />
<path d="M -12,-14 C -12,-30 12,-30 12,-14 Z" fill="#0F1730" stroke="#C9D4FF" stroke-width="1.2" />
<line x1="0" y1="-30" x2="0" y2="-34" stroke="#C9D4FF" stroke-width="1" />
<rect x="-28" y="26" width="56" height="3" fill="#C9D4FF" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-42" y="-12" width="84" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-27.45,4.00 L-27.45,-1.39 L-23.10,-1.39 Q-22.81,-1.39 -22.57,-1.25 Q-22.33,-1.11 -22.19,-0.87 Q-22.05,-0.63 -22.05,-0.35 L-22.05,1.10 Q-22.05,1.39 -22.19,1.63 Q-22.33,1.87 -22.57,2.01 Q-22.81,2.15 -23.10,2.15 L-26.46,2.16 L-26.46,4.00 L-27.45,4.00 ZM-26.37,1.15 L-23.14,1.15 Q-23.11,1.15 -23.07,1.13 Q-23.05,1.10 -23.05,1.07 L-23.05,-0.31 Q-23.05,-0.35 -23.07,-0.38 Q-23.11,-0.40 -23.14,-0.40 L-26.37,-0.40 Q-26.41,-0.40 -26.43,-0.38 Q-26.46,-0.35 -26.46,-0.31 L-26.46,1.07 Q-26.46,1.10 -26.43,1.13 Q-26.41,1.15 -26.37,1.15 ZM-20.48,4.00 L-20.48,-0.36 Q-20.48,-0.64 -20.34,-0.88 Q-20.19,-1.12 -19.96,-1.26 Q-19.72,-1.40 -19.44,-1.40 L-16.13,-1.40 Q-15.84,-1.40 -15.60,-1.26 Q-15.36,-1.12 -15.22,-0.88 Q-15.08,-0.64 -15.08,-0.36 L-15.08,4.00 L-16.08,4.00 L-16.08,2.19 L-19.49,2.19 L-19.49,4.00 L-20.48,4.00 L-20.48,4.00 ZM-19.49,1.20 L-16.08,1.20 L-16.08,-0.31 Q-16.08,-0.35 -16.11,-0.38 Q-16.14,-0.40 -16.17,-0.40 L-19.40,-0.40 Q-19.44,-0.40 -19.46,-0.38 Q-19.49,-0.35 -19.49,-0.31 L-19.49,1.20 L-19.49,1.20 ZM-13.22,4.00 L-13.22,-1.40 L-12.13,-1.40 L-8.82,2.54 L-8.82,-1.40 L-7.82,-1.40 L-7.82,4.00 L-8.91,4.00 L-12.23,0.05 L-12.23,4.00 L-13.22,4.00 ZM-4.05,4.00 L-4.05,4.00 L-4.05,-0.40 L-6.25,-0.40 L-6.25,-1.40 L-0.85,-1.40 L-0.85,-0.40 L-3.05,-0.40 L-3.05,4.00 L-4.05,4.00 ZM0.72,4.00 L0.72,-1.40 L1.71,-1.40 L1.71,0.80 L5.25,0.80 L5.25,-1.40 L6.24,-1.40 L6.24,4.00 L5.25,4.00 L5.25,1.80 L1.71,1.80 L1.71,4.00 L0.72,4.00 ZM8.11,4.00 L8.11,-1.40 L13.08,-1.40 L13.08,-0.40 L9.10,-0.40 L9.10,0.80 L12.30,0.80 L12.30,1.80 L9.10,1.80 L9.10,3.00 L13.08,3.00 L13.08,4.00 L8.11,4.00 ZM10.11,-1.85 L10.11,-1.85 L10.46,-3.22 L11.45,-3.22 L11.11,-1.85 L10.11,-1.85 ZM15.86,4.00 Q15.58,4.00 15.34,3.86 Q15.11,3.71 14.96,3.48 Q14.82,3.24 14.82,2.96 L14.82,-0.36 Q14.82,-0.64 14.96,-0.88 Q15.11,-1.12 15.34,-1.26 Q15.58,-1.40 15.86,-1.40 L19.18,-1.40 Q19.46,-1.40 19.70,-1.26 Q19.94,-1.12 20.08,-0.88 Q20.22,-0.64 20.22,-0.36 L20.22,2.96 Q20.22,3.24 20.08,3.48 Q19.94,3.71 19.70,3.86 Q19.46,4.00 19.18,4.00 L15.86,4.00 ZM15.90,3.00 L19.13,3.00 Q19.16,3.00 19.19,2.98 Q19.22,2.95 19.22,2.91 L19.22,-0.31 Q19.22,-0.35 19.19,-0.38 Q19.16,-0.40 19.13,-0.40 L15.90,-0.40 Q15.86,-0.40 15.84,-0.38 Q15.81,-0.35 15.81,-0.31 L15.81,2.91 Q15.81,2.95 15.84,2.98 Q15.86,3.00 15.90,3.00 ZM22.05,4.00 L22.05,-1.40 L23.13,-1.40 L26.45,2.54 L26.45,-1.40 L27.45,-1.40 L27.45,4.00 L26.36,4.00 L23.04,0.05 L23.04,4.00 L22.05,4.00 Z"/></g>
    </g>
  </g>
</svg>
