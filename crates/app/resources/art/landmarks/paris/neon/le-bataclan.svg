<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><rect x="-24" y="2" width="48" height="22" fill="#0F1730" stroke="#C9D4FF" stroke-width="1" />
<path d="M -28,2 C -28,-6 28,-6 28,2 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<path d="M -16,-6 C -16,-16 16,-16 16,-6 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1" />
<line x1="0" y1="-16" x2="0" y2="-22" stroke="#C9D4FF" stroke-width="1" />
<rect x="-26" y="22" width="52" height="4" fill="#C9D4FF" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-40" y="-12" width="80" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-36.01,4.00 L-36.01,-1.41 L-35.02,-1.41 L-35.02,3.00 L-30.61,3.00 L-30.61,4.00 L-36.01,4.00 ZM-29.16,4.00 L-29.16,-1.40 L-24.19,-1.40 L-24.19,-0.40 L-28.16,-0.40 L-28.16,0.80 L-24.97,0.80 L-24.97,1.80 L-28.16,1.80 L-28.16,3.00 L-24.19,3.00 L-24.19,4.00 L-29.16,4.00 ZM-19.11,4.00 L-19.11,-1.40 L-14.97,-1.40 Q-14.69,-1.40 -14.45,-1.26 Q-14.21,-1.12 -14.07,-0.88 Q-13.93,-0.64 -13.93,-0.36 L-13.93,0.70 Q-13.93,0.80 -13.94,0.89 Q-13.96,0.98 -14.00,1.06 Q-13.87,1.23 -13.79,1.42 Q-13.71,1.61 -13.71,1.79 L-13.71,2.96 Q-13.71,3.24 -13.85,3.48 Q-14.00,3.71 -14.24,3.86 Q-14.48,4.00 -14.76,4.00 L-19.11,4.00 L-19.11,4.00 ZM-18.03,3.00 L-14.81,3.00 Q-14.77,3.00 -14.74,2.98 Q-14.71,2.95 -14.71,2.91 L-14.71,1.84 Q-14.71,1.80 -14.74,1.78 Q-14.77,1.75 -14.81,1.75 L-18.03,1.75 Q-18.07,1.75 -18.10,1.78 Q-18.12,1.80 -18.12,1.84 L-18.12,2.91 Q-18.12,2.95 -18.10,2.98 Q-18.07,3.00 -18.03,3.00 ZM-18.03,0.75 L-15.02,0.75 Q-14.98,0.75 -14.96,0.73 Q-14.93,0.70 -14.93,0.66 L-14.93,-0.31 Q-14.93,-0.35 -14.96,-0.38 Q-14.98,-0.40 -15.02,-0.40 L-18.03,-0.40 Q-18.07,-0.40 -18.10,-0.38 Q-18.12,-0.35 -18.12,-0.31 L-18.12,0.66 Q-18.12,0.70 -18.10,0.73 Q-18.07,0.75 -18.03,0.75 ZM-11.88,4.00 L-11.88,-0.36 Q-11.88,-0.64 -11.74,-0.88 Q-11.59,-1.12 -11.36,-1.26 Q-11.12,-1.40 -10.84,-1.40 L-7.53,-1.40 Q-7.24,-1.40 -7.00,-1.26 Q-6.76,-1.12 -6.62,-0.88 Q-6.48,-0.64 -6.48,-0.36 L-6.48,4.00 L-7.48,4.00 L-7.48,2.19 L-10.89,2.19 L-10.89,4.00 L-11.88,4.00 L-11.88,4.00 ZM-10.89,1.20 L-7.48,1.20 L-7.48,-0.31 Q-7.48,-0.35 -7.51,-0.38 Q-7.54,-0.40 -7.57,-0.40 L-10.80,-0.40 Q-10.84,-0.40 -10.86,-0.38 Q-10.89,-0.35 -10.89,-0.31 L-10.89,1.20 L-10.89,1.20 ZM-2.69,4.00 L-2.69,4.00 L-2.69,-0.40 L-4.89,-0.40 L-4.89,-1.40 L0.51,-1.40 L0.51,-0.40 L-1.69,-0.40 L-1.69,4.00 L-2.69,4.00 ZM2.08,4.00 L2.08,-0.36 Q2.08,-0.64 2.23,-0.88 Q2.37,-1.12 2.60,-1.26 Q2.84,-1.40 3.13,-1.40 L6.43,-1.40 Q6.72,-1.40 6.96,-1.26 Q7.20,-1.12 7.34,-0.88 Q7.48,-0.64 7.48,-0.36 L7.48,4.00 L6.49,4.00 