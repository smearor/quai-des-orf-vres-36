<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><path d="M -30,16 C -18,8 -10,8 0,16 C 10,8 18,8 30,16 L 30,22 L -30,22 Z" fill="#0F1730" stroke="#C9D4FF" stroke-width="1" />
<path d="M -24,16 C -18,10 -12,10 -6,16 M -6,16 C 0,10 6,10 12,16 M 12,16 C 18,10 24,10 30,16" fill="none" stroke="#C9D4FF" stroke-width="1" />
<path d="M -32,22 Q 0,18 32,22" fill="none" stroke="#C9D4FF" stroke-width="1.2" />
<rect x="-34" y="24" width="68" height="4" fill="#C9D4FF" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-40" y="-12" width="80" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-28.57,4.00 L-28.57,-1.39 L-24.22,-1.39 Q-23.94,-1.39 -23.70,-1.25 Q-23.46,-1.11 -23.32,-0.87 Q-23.17,-0.63 -23.17,-0.35 L-23.17,1.10 Q-23.17,1.39 -23.32,1.63 Q-23.46,1.87 -23.70,2.01 Q-23.94,2.15 -24.22,2.15 L-27.58,2.16 L-27.58,4.00 L-28.57,4.00 ZM-27.49,1.15 L-24.27,1.15 Q-24.23,1.15 -24.20,1.13 Q-24.17,1.10 -24.17,1.07 L-24.17,-0.31 Q-24.17,-0.35 -24.20,-0.38 Q-24.23,-0.40 -24.27,-0.40 L-27.49,-0.40 Q-27.53,-0.40 -27.56,-0.38 Q-27.58,-0.35 -27.58,-0.31 L-27.58,1.07 Q-27.58,1.10 -27.56,1.13 Q-27.53,1.15 -27.49,1.15 ZM-20.61,4.00 Q-20.90,4.00 -21.13,3.86 Q-21.37,3.71 -21.51,3.48 Q-21.66,3.24 -21.66,2.96 L-21.66,-0.36 Q-21.66,-0.64 -21.51,-0.88 Q-21.37,-1.12 -21.13,-1.26 Q-20.90,-1.40 -20.61,-1.40 L-17.30,-1.40 Q-17.01,-1.40 -16.78,-1.26 Q-16.54,-1.12 -16.40,-0.88 Q-16.26,-0.64 -16.26,-0.36 L-16.26,2.96 Q-16.26,3.24 -16.40,3.48 Q-16.54,3.71 -16.78,3.86 Q-17.01,4.00 -17.30,4.00 L-20.61,4.00 ZM-20.58,3.00 L-17.35,3.00 Q-17.31,3.00 -17.28,2.98 Q-17.25,2.95 -17.25,2.91 L-17.25,-0.31 Q-17.25,-0.35 -17.28,-0.38 Q-17.31,-0.40 -17.35,-0.40 L-20.58,-0.40 Q-20.61,-0.40 -20.64,-0.38 Q-20.67,-0.35 -20.67,-0.31 L-20.67,2.91 Q-20.67,2.95 -20.64,2.98 Q-20.61,3.00 -20.58,3.00 ZM-14.43,4.00 L-14.43,-1.40 L-13.34,-1.40 L-10.03,2.54 L-10.03,-1.40 L-9.03,-1.40 L-9.03,4.00 L-10.12,4.00 L-13.44,0.05 L-13.44,4.00 L-14.43,4.00 ZM-5.26,4.00 L-5.26,4.00 L-5.26,-0.40 L-7.46,-0.40 L-7.46,-1.40 L-2.06,-1.40 L-2.06,-0.40 L-4.26,-0.40 L-4.26,4.00 L-5.26,4.00 ZM2.80,4.00 L2.80,-1.40 L3.88,-1.40 L7.20,2.54 L7.20,-1.40 L8.20,-1.40 L8.20,4.00 L7.11,4.00 L3.79,0.05 L3.79,4.00 L2.80,4.00 ZM10.05,4.00 L10.05,-1.40 L15.02,-1.40 L15.02,-0.40 L11.05,-0.40 L11.05,0.80 L14.24,0.80 L14.24,1.80 L11.05,1.80 L11.05,3.00 L15.02,3.00 L15.02,4.00 L10.05,4.00 ZM17.81,4.00 Q17.52,4.00 17.29,3.86 Q17.05,3.71 16.91,3.48 Q16.77,3.24 16.77,2.96 L16.77,-1.40 L17.76,-1.40 L17.76,2.91 Q17.76,2.95 17.78,2.98 Q17.81,3.00 17.85,3.00 L21.07,3.00 Q21.11,3.00 21.14,2.98 Q21.17