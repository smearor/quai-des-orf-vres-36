<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><rect x="-24" y="0" width="48" height="26" fill="#0F1730" stroke="#C9D4FF" stroke-width="1" />
<rect x="-24" y="-24" width="14" height="24" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<rect x="10" y="-24" width="14" height="24" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<circle cx="0" cy="8" r="7" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<circle cx="0" cy="8" r="2" fill="#C9D4FF" />
<line x1="0" y1="0" x2="0" y2="-28" stroke="#C9D4FF" stroke-width="1.2" />
<rect x="-26" y="24" width="52" height="4" fill="#C9D4FF" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-44" y="-12" width="88" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-33.67,4.00 L-33.67,-1.40 L-32.58,-1.40 L-29.27,2.54 L-29.27,-1.40 L-28.27,-1.40 L-28.27,4.00 L-29.36,4.00 L-32.68,0.05 L-32.68,4.00 L-33.67,4.00 ZM-25.40,4.00 Q-25.69,4.00 -25.93,3.86 Q-26.16,3.71 -26.30,3.48 Q-26.45,3.24 -26.45,2.96 L-26.45,-0.36 Q-26.45,-0.64 -26.30,-0.88 Q-26.16,-1.12 -25.93,-1.26 Q-25.69,-1.40 -25.40,-1.40 L-22.09,-1.40 Q-21.80,-1.40 -21.57,-1.26 Q-21.33,-1.12 -21.19,-0.88 Q-21.05,-0.64 -21.05,-0.36 L-21.05,2.96 Q-21.05,3.24 -21.19,3.48 Q-21.33,3.71 -21.57,3.86 Q-21.80,4.00 -22.09,4.00 L-25.40,4.00 ZM-25.37,3.00 L-22.14,3.00 Q-22.10,3.00 -22.07,2.98 Q-22.04,2.95 -22.04,2.91 L-22.04,-0.31 Q-22.04,-0.35 -22.07,-0.38 Q-22.10,-0.40 -22.14,-0.40 L-25.37,-0.40 Q-25.40,-0.40 -25.43,-0.38 Q-25.46,-0.35 -25.46,-0.31 L-25.46,2.91 Q-25.46,2.95 -25.43,2.98 Q-25.40,3.00 -25.37,3.00 ZM-17.29,4.00 L-17.29,4.00 L-17.29,-0.40 L-19.49,-0.40 L-19.49,-1.40 L-14.09,-1.40 L-14.09,-0.40 L-16.29,-0.40 L-16.29,4.00 L-17.29,4.00 ZM-8.22,4.00 L-9.85,2.06 L-8.55,2.06 L-7.14,3.72 L-7.14,4.00 L-8.22,4.00 ZM-12.53,4.00 L-12.53,-1.39 L-8.18,-1.39 Q-7.89,-1.39 -7.65,-1.25 Q-7.41,-1.11 -7.27,-0.87 Q-7.13,-0.63 -7.13,-0.35 L-7.13,1.10 Q-7.13,1.39 -7.27,1.63 Q-7.41,1.87 -7.65,2.01 Q-7.89,2.15 -8.18,2.15 L-11.54,2.16 L-11.54,4.00 L-12.53,4.00 ZM-11.45,1.15 L-8.22,1.15 Q-8.19,1.15 -8.16,1.13 Q-8.13,1.10 -8.13,1.07 L-8.13,-0.31 Q-8.13,-0.35 -8.16,-0.38 Q-8.19,-0.40 -8.22,-0.40 L-11.45,-0.40 Q-11.49,-0.40 -11.51,-0.38 Q-11.54,-0.35 -11.54,-0.31 L-11.54,1.07 Q-11.54,1.10 -11.51,1.13 Q-11.49,1.15 -11.45,1.15 ZM-5.33,4.00 L-5.33,-1.40 L-0.35,-1.40 L-0.35,-0.40 L-4.33,-0.40 L-4.33,0.80 L-1.13,0.80 L-1.13,1.80 L-4.33,1.80 L-4.33,3.00 L-0.35,3.00 L-0.35,4.00 L-5.33,4.00 ZM1.43,2.28 L1.43,2.28 L1.43,1.29 L4.49,1.29 L4.49,2.28 L1.43,2.28 ZM6.30,4.00 L6.30,-1.40 L10.65,-1.40 Q10.93,-1.40 11.17,-1.26 Q11.41,-1.12 11.55,-0.88 Q11.70,-0.64 11.70,-0.36 L11.70,2.96 Q11.70,3.24 11.55,3.48 Q11.41,3.71 11.17,3.86 Q10.93,4.00 10.65,4.00 L6.30,4.00 Z