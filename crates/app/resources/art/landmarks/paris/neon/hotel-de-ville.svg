<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><rect x="-30" y="4" width="60" height="20" fill="#0F1730" stroke="#C9D4FF" stroke-width="1.2" />
<path d="M -12,4 L -12,-16 L 12,-16 L 12,4 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1.2" />
<polygon points="-12,-16 0,-24 12,-16" fill="#C9D4FF" />
<circle cx="0" cy="-6" r="3" fill="#C9D4FF" />
<rect x="-32" y="22" width="64" height="4" fill="#C9D4FF" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-44" y="-12" width="88" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-42.58,4.00 L-42.58,-1.40 L-41.59,-1.40 L-41.59,0.80 L-38.05,0.80 L-38.05,-1.40 L-37.06,-1.40 L-37.06,4.00 L-38.05,4.00 L-38.05,1.80 L-41.59,1.80 L-41.59,4.00 L-42.58,4.00 ZM-34.18,4.00 Q-34.47,4.00 -34.70,3.86 Q-34.94,3.71 -35.08,3.48 Q-35.22,3.24 -35.22,2.96 L-35.22,-0.36 Q-35.22,-0.64 -35.08,-0.88 Q-34.94,-1.12 -34.70,-1.26 Q-34.47,-1.40 -34.18,-1.40 L-30.87,-1.40 Q-30.58,-1.40 -30.34,-1.26 Q-30.11,-1.12 -29.97,-0.88 Q-29.82,-0.64 -29.82,-0.36 L-29.82,2.96 Q-29.82,3.24 -29.97,3.48 Q-30.11,3.71 -30.34,3.86 Q-30.58,4.00 -30.87,4.00 L-34.18,4.00 ZM-34.14,3.00 L-30.92,3.00 Q-30.88,3.00 -30.85,2.98 Q-30.82,2.95 -30.82,2.91 L-30.82,-0.31 Q-30.82,-0.35 -30.85,-0.38 Q-30.88,-0.40 -30.92,-0.40 L-34.14,-0.40 Q-34.18,-0.40 -34.21,-0.38 Q-34.23,-0.35 -34.23,-0.31 L-34.23,2.91 Q-34.23,2.95 -34.21,2.98 Q-34.18,3.00 -34.14,3.00 ZM-33.63,-1.92 L-33.63,-1.92 L-32.87,-3.19 L-32.16,-3.19 L-31.41,-1.92 L-32.25,-1.92 L-32.52,-2.39 L-32.79,-1.92 L-33.63,-1.92 ZM-26.06,4.00 L-26.06,4.00 L-26.06,-0.40 L-28.27,-0.40 L-28.27,-1.40 L-22.87,-1.40 L-22.87,-0.40 L-25.07,-0.40 L-25.07,4.00 L-26.06,4.00 ZM-21.29,4.00 L-21.29,-1.40 L-16.32,-1.40 L-16.32,-0.40 L-20.29,-0.40 L-20.29,0.80 L-17.10,0.80 L-17.10,1.80 L-20.29,1.80 L-20.29,3.00 L-16.32,3.00 L-16.32,4.00 L-21.29,4.00 ZM-14.55,4.00 L-14.55,-1.41 L-13.56,-1.41 L-13.56,3.00 L-9.15,3.00 L-9.15,4.00 L-14.55,4.00 ZM-4.41,4.00 L-4.41,-1.40 L-0.06,-1.40 Q0.23,-1.40 0.47,-1.26 Q0.71,-1.12 0.85,-0.88 Q0.99,-0.64 0.99,-0.36 L0.99,2.96 Q0.99,3.24 0.85,3.48 Q0.71,3.71 0.47,3.86 Q0.23,4.00 -0.06,4.00 L-4.41,4.00 ZM-3.34,3.00 L-0.10,3.00 Q-0.07,3.00 -0.04,2.98 Q-0.01,2.95 -0.01,2.91 L-0.01,-0.31 Q-0.01,-0.35 -0.04,-0.38 Q-0.07,-0.40 -0.10,-0.40 L-3.34,-0.40 Q-3.37,-0.40 -3.40,-0.38 Q-3.43,-0.35 -3.43,-0.31 L-3.43,2.91 Q-3.43,2.95 -3.40,2.98 Q-3.37,3.00 -3.34,3.00 ZM2.85,4.00 L2.85,-1.40 L7.82,-1.40 L7.82,-0.40 L3.85,-0.40 L3.85,0.80 L7.04,0.80 L7.04,1.80 L3.85,1.80 L3.85,3.00 L7.82,3.00 L7.82,4.00 L2