<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><path d="M -36,12 Q 0,20 36,12 L 30,-2 L 20,-12 L -20,-12 L -30,-2 Z" fill="#0F1730" stroke="#C9D4FF" stroke-width="1.2" />
<path d="M -18,-12 L -12,-24 L 12,-24 L 18,-12 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1" />
<line x1="0" y1="-24" x2="0" y2="-30" stroke="#C9D4FF" stroke-width="1.5" />
<circle cx="0" cy="-30" r="2" fill="#C9D4FF" />
<line x1="-8" y1="-18" x2="-8" y2="-12" stroke="#C9D4FF" stroke-width="0.8" />
<line x1="8" y1="-18" x2="8" y2="-12" stroke="#C9D4FF" stroke-width="0.8" />
<path d="M -32,18 Q -16,13 0,18 Q 16,23 32,18" fill="none" stroke="#C9D4FF" stroke-width="1.2" stroke-linecap="round" />
<path d="M -24,24 Q -12,19 0,24 Q 12,29 24,24" fill="none" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" stroke-linecap="round" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-46" y="-12" width="92" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-27.53,4.00 Q-27.80,4.00 -28.02,3.87 Q-28.24,3.73 -28.37,3.51 Q-28.51,3.29 -28.51,3.03 L-28.51,2.64 L-27.58,2.64 L-27.58,2.98 Q-27.58,3.02 -27.56,3.04 Q-27.53,3.07 -27.50,3.07 L-24.48,3.07 Q-24.45,3.07 -24.42,3.04 Q-24.40,3.02 -24.40,2.98 L-24.40,2.03 Q-24.40,1.99 -24.42,1.97 Q-24.45,1.95 -24.48,1.95 L-27.53,1.95 Q-27.80,1.95 -28.02,1.82 Q-28.24,1.68 -28.37,1.46 Q-28.51,1.24 -28.51,0.97 L-28.51,-0.07 Q-28.51,-0.33 -28.37,-0.55 Q-28.24,-0.77 -28.02,-0.91 Q-27.80,-1.04 -27.53,-1.04 L-24.44,-1.04 Q-24.17,-1.04 -23.95,-0.91 Q-23.73,-0.77 -23.60,-0.55 Q-23.47,-0.33 -23.47,-0.07 L-23.47,0.32 L-24.40,0.32 L-24.40,-0.03 Q-24.40,-0.06 -24.42,-0.08 Q-24.45,-0.11 -24.48,-0.11 L-27.50,-0.11 Q-27.53,-0.11 -27.56,-0.08 Q-27.58,-0.06 -27.58,-0.03 L-27.58,0.93 Q-27.58,0.97 -27.56,0.99 Q-27.53,1.01 -27.50,1.01 L-24.44,1.01 Q-24.17,1.01 -23.95,1.14 Q-23.73,1.28 -23.60,1.50 Q-23.47,1.72 -23.47,1.99 L-23.47,3.03 Q-23.47,3.29 -23.60,3.51 Q-23.73,3.73 -23.95,3.87 Q-24.17,4.00 -24.44,4.00 L-27.53,4.00 ZM-21.69,4.00 L-21.69,-1.04 L-17.05,-1.04 L-17.05,-0.11 L-20.76,-0.11 L-20.76,1.01 L-17.78,1.01 L-17.78,1.95 L-20.76,1.95 L-20.76,3.07 L-17.05,3.07 L-17.05,4.00 L-21.69,4.00 ZM-15.44,4.00 L-15.44,-1.04 L-14.52,-1.04 L-14.52,4.00 L-15.44,4.00 ZM-12.84,4.00 L-12.84,-1.04 L-11.83,-1.04 L-8.73,2.64 L-8.73,-1.04 L-7.80,-1.04 L-7.80,4.00 L-8.82,4.00 L-11.92,0.31 L-11.92,4.00 L-12.84,4.00 ZM-6.01,4.00 L-6.01,-1.04 L-1.36,-1.04 L-1.36,-0.11 L-5.07,-0.11 L-5.07,1.01 L-2.09,1.01 L-2.09,1.95 L-5.07,1.95 L-5.07,3.07 L-1.36,3.07 L-1.36,4.00 L-6.01,4.00 ZM3.51,4.00 L3.51,-1.04 L7.37,-1.04 Q7.64,-1.04 7.86,-0.91 Q8.08,-0.77 8.21,-0.55 Q8.34,-0.33 8.34,-0.07 L8.34,0.92 Q8.34,1.01 8.33,1.09 Q8.31,1.18 8.28,1.26 Q8.40,1.42 8.47,1.59 Q8.55,1.77 8.55,1.94 L8.55,3.03 Q8.55,3.29 8.41,3.51 Q8.28,3.73 8.06,3.87 Q7.83,4.00 7.57,4.00 L3.51,4.00 L3.51,4.00 ZM4.51,3.07 L7.52,3.07 Q7.56,3.07 7.59,3.04 Q7.61,3.02 7.61,2.98 L7.61,1.98 Q7.61,1.95 7.59,1.92 Q7.56,1.90 7.5