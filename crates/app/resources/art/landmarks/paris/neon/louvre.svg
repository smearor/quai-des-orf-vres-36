<!-- ============================================================
     STATION MARKER (NEON) — TINTABLE MASTER
     Neon-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent on
       the solid ring, #station-accent-bloom on the wide
       low-alpha bloom ring (stroke substitutions).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the data plaque rect (x/width
       substitution for label length).
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - Grid/panel elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring: fill disc + solid ring + wide bloom (parametrized via #station-accent*) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle id="station-accent" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="3" />
    <circle id="station-accent-bloom" cx="100" cy="100" r="62" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 92)" filter="url(#neonGlow)"><path d="M -42,28 L -42,5 L -35,5 L -35,0 L -25,0 L -25,5 L -8,5 L -8,2 L 8,2 L 8,5 L 25,5 L 25,0 L 35,0 L 35,5 L 42,5 L 42,28 Z" fill="#0F1730" stroke="#C9D4FF" stroke-width="1" />
<path d="M -10,2 L 0,-6 L 10,2 Z" fill="#0B1020" stroke="#C9D4FF" stroke-width="1" />
<rect x="-42" y="24" width="84" height="4" fill="#C9D4FF" />
<polygon points="0,-12 -26,28 26,28" fill="#0F1730" opacity="0.85" />
<polygon points="0,-12 -26,28 26,28" fill="none" stroke="#C9D4FF" stroke-width="1.8" />
<line x1="0" y1="-12" x2="-13" y2="28" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" />
<line x1="0" y1="-12" x2="13" y2="28" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" />
<line x1="-7" y1="0" x2="7" y2="0" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" />
<line x1="-14" y1="10" x2="14" y2="10" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" />
<line x1="-20" y1="19" x2="20" y2="19" stroke="#C9D4FF" stroke-width="0.8" opacity="0.7" /></g>

    <!-- Bottom Data Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 155)">
      <rect id="station-plate" x="-39" y="-12" width="78" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <g id="station-label" fill="#C9D4FF"><path d="M-23.41,4.00 L-23.41,-1.77 L-22.35,-1.77 L-22.35,2.94 L-17.65,2.94 L-17.65,4.00 L-23.41,4.00 ZM-14.59,4.00 Q-14.89,4.00 -15.15,3.85 Q-15.40,3.70 -15.55,3.44 Q-15.70,3.19 -15.70,2.89 L-15.70,-0.65 Q-15.70,-0.95 -15.55,-1.20 Q-15.40,-1.46 -15.15,-1.61 Q-14.89,-1.76 -14.59,-1.76 L-11.05,-1.76 Q-10.75,-1.76 -10.50,-1.61 Q-10.25,-1.46 -10.09,-1.20 Q-9.94,-0.95 -9.94,-0.65 L-9.94,2.89 Q-9.94,3.19 -10.09,3.44 Q-10.25,3.70 -10.50,3.85 Q-10.75,4.00 -11.05,4.00 L-14.59,4.00 ZM-14.55,2.94 L-11.11,2.94 Q-11.07,2.94 -11.04,2.91 Q-11.01,2.88 -11.01,2.84 L-11.01,-0.60 Q-11.01,-0.64 -11.04,-0.67 Q-11.07,-0.70 -11.11,-0.70 L-14.55,-0.70 Q-14.59,-0.70 -14.62,-0.67 Q-14.65,-0.64 -14.65,-0.60 L-14.65,2.84 Q-14.65,2.88 -14.62,2.91 Q-14.59,2.94 -14.55,2.94 ZM-6.47,4.00 Q-6.77,4.00 -7.02,3.85 Q-7.27,3.70 -7.43,3.44 Q-7.58,3.19 -7.58,2.89 L-7.58,-1.76 L-6.52,-1.76 L-6.52,2.84 Q-6.52,2.88 -6.49,2.91 Q-6.47,2.94 -6.43,2.94 L-2.99,2.94 Q-2.95,2.94 -2.91,2.91 Q-2.88,2.88 -2.88,2.84 L-2.88,-1.76 L-1.82,-1.76 L-1.82,2.89 Q-1.82,3.19 -1.97,3.44 Q-2.12,3.70 -2.37,3.85 Q-2.63,4.00 -2.93,4.00 L-6.47,4.00 L-6.47,4.00 ZM3.73,4.00 L3.73,4.00 L0.39,-1.76 L1.63,-1.76 L4.20,2.72 L6.79,-1.76 L8.01,-1.76 L4.67,4.00 L3.73,4.00 ZM14.68,4.00 L12.94,1.93 L14.33,1.93 L15.83,3.70 L15.83,4.00 L14.68,4.00 ZM10.09,4.00 L10.09,-1.75 L14.73,-1.75 Q15.03,-1.75 15.29,-1.60 Q15.54,-1.45 15.69,-1.20 Q15.85,-0.94 15.85,-0.64 L15.85,0.91 Q15.85,1.22 15.69,1.47 Q15.54,1.73 15.29,1.88 Q15.03,2.02 14.73,2.02 L11.14,2.03 L11.14,4.00 L10.09,4.00 ZM11.24,0.96 L14.68,0.96 Q14.72,0.96 14.75,0.94 Q14.78,0.91 14.78,0.87 L14.78,-0.60 Q14.78,-0.64 14.75,-0.67 Q14.72,-0.70 14.68,-0.70 L11.24,-0.70 Q11.20,-0.70 11.17,-0.67 Q11.14,-0.64 11.14,-0.60 L11.14,0.87 Q11.14,0.91 11.17,0.94 Q11.20,0.96 11.24,0.96 ZM18.20,4.00 L18.20,-1.76 L23.51,-1.76 L23.51,-0.70 L19.27,-0.70 L19.27,0.58 L22.67,0.58 L22.67,1.66 L19.27,1.66 L19.27,2.94 L23.51,2.94 L23.51,4.00 L18.20,4.00 Z"/></g>
    </g>
  </g>
</svg>
