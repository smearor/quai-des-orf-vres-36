<!-- ============================================================
     STATION MARKER (COMIC) — TINTABLE MASTER
     Comic-style map pin badge shared by transport station
     markers, landmark anchors and the corbeau reveal marker,
     parametrized per variant.

     Parametrization contract:
     - #station-accent carries the transport/landmark accent
       colour (stroke substitution).
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted.
     - #station-plate carries the label plate path (d/fill
       substitution); #station-pin-inner the pin inner fill.
     - #station-label carries the label (texts + font-size/
       letter-spacing substitutions).
     - #station-shadow allows tuning the hard offset shadow.
     - Paper/ink elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the taxi station marker.
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow id="station-shadow" dx="3" dy="3" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Station Marker Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)">

    <!-- 1. Bottom Anchor Pin / Pointer Triangle (Comic Style) -->
    <polygon points="100,230 82,168 118,168" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" stroke-linejoin="round" />
    <polygon id="station-pin-inner" points="100,220 88,170 112,170" fill="#FBF6E9" />

    <!-- 2. Main Circular Badge Body -->
    <circle cx="100" cy="100" r="82" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.5" />
    <circle cx="100" cy="100" r="74" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- 3. Accent Ring per Transport Kind (parametrized via #station-accent) -->
    <circle id="station-accent" cx="100" cy="100" r="64" fill="none" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="5,4" />

    <!-- 4. Cardinal Ink-Burst / Comic Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 100,16 L 103,24 L 97,24 Z" />
      <path d="M 100,184 L 103,176 L 97,176 Z" />
      <path d="M 16,100 L 24,103 L 24,97 Z" />
      <path d="M 184,100 L 176,103 L 176,97 Z" />
    </g>

    <!-- 5. Central Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 95)"><path d="M -42,28 L -42,5 L -35,5 L -35,0 L -25,0 L -25,5 L -8,5 L -8,2 L 8,2 L 8,5 L 25,5 L 25,0 L 35,0 L 35,5 L 42,5 L 42,28 Z" fill="#1C1917" stroke="#1C1917" stroke-width="1" />
<path d="M -10,2 L 0,-6 L 10,2 Z" fill="#1C1917" stroke="#1C1917" stroke-width="1" />
<rect x="-42" y="24" width="84" height="4" fill="#1C1917" />
<polygon points="0,-12 -26,28 26,28" fill="#1C1917" opacity="0.85" />
<polygon points="0,-12 -26,28 26,28" fill="none" stroke="#1C1917" stroke-width="1.8" />
<line x1="0" y1="-12" x2="-13" y2="28" stroke="#1C1917" stroke-width="0.8" opacity="0.7" />
<line x1="0" y1="-12" x2="13" y2="28" stroke="#1C1917" stroke-width="0.8" opacity="0.7" />
<line x1="-7" y1="0" x2="7" y2="0" stroke="#1C1917" stroke-width="0.8" opacity="0.7" />
<line x1="-14" y1="10" x2="14" y2="10" stroke="#1C1917" stroke-width="0.8" opacity="0.7" />
<line x1="-20" y1="19" x2="20" y2="19" stroke="#1C1917" stroke-width="0.8" opacity="0.7" /></g>

    <!-- 6. Bottom Label / Name Plate Plaque (parametrized via #station-plate/-label) -->
    <g transform="translate(100, 154)">
      <path id="M -35,-10 Q 0,-14 35,-10 Q 35,10 35,10 Q 0,14 -35,10 Z" d="M -38,-10 Q 0,-14 38,-10 Q 38,10 38,10 Q 0,14 -38,10 Z" fill="#F7EFE0" stroke="#1C1917" stroke-width="2.2" stroke-linejoin="round" />
      <text id="station-label" x="0" y="3.5" font-family="&#39;Patrick Hand&#39;, &#39;Comic Neue&#39;, sans-serif" font-size="8" font-weight="bold" fill="#1C1917" text-anchor="middle" letter-spacing="1.5">LOUVRE</text>
    </g>
  </g>
</svg>
