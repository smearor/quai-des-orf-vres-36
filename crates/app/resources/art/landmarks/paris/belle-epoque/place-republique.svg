<!-- ============================================================
     STATION MARKER — TINTABLE MASTER
     Map pin badge shared by all transport station markers and
     landmark anchors, parametrized per variant.

     Parametrization contract:
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted for per-glyph vertical offsets.
     - The label plate path carries id "station-plate" — its `d`
       attribute is substituted for wider/narrower plates.
     - The label lives in <text id="station-label"> — replace its
       character data (texts) and font-size/letter-spacing
       attributes (substitutions) per variant.
     - All ring/filigree/shadow elements are colour-neutral and
       must NOT be tinted.

     Defaults below render the taxi station marker.
     See variants.toml for all variants (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient for Map Marker -->
    <radialGradient id="markerBg" cx="50%" cy="40%" r="60%">
      <stop id="marker-hi" offset="0%" stop-color="#1c2436" />
      <stop id="marker-mid" offset="70%" stop-color="#0d131d" />
      <stop id="marker-lo" offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Ring & Silhouette Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for 3D Map Anchor Depth -->
    <filter id="anchorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow id="station-shadow" dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#anchorShadow)">
    <!-- 1. Bottom Anchor Pin / Pointer Triangle -->
    <polygon points="100,230 85,170 115,170" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <polygon id="station-pin-inner" points="100,222 90,172 110,172" fill="#0d131d" />

    <!-- 2. Main Circular Ornate Badge / Ring -->
    <circle cx="100" cy="100" r="85" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2.5" />
    <circle cx="100" cy="100" r="78" fill="url(#markerBg)" />

    <!-- 3. Inner Filigree Border -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#2c3848" stroke-width="1" stroke-dasharray="4,3" opacity="0.8" />

    <!-- 4. Corner Fleur-de-Lys Accents on Ring -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 100,12 L 103,20 L 100,24 L 97,20 Z" />
      <path d="M 100,188 L 103,180 L 100,176 L 97,180 Z" />
      <path d="M 12,100 L 20,103 L 24,100 L 20,97 Z" />
      <path d="M 188,100 L 180,103 L 176,100 L 180,97 Z" />
    </g>

    <!-- 5. Central Station Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 103)" filter="url(#glowFilter)"><polygon points="-20,28 -14,8 14,8 20,28" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1" />
<rect x="-24" y="26" width="48" height="3" fill="url(#goldAcc)" />
<path d="M -6,8 L -5,-16 L -1,-24 L 2,-24 L 5,-16 L 6,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.2" />
<path d="M -1,-24 C -2,-28 4,-28 3,-24 Z" fill="url(#goldAcc)" />
<line x1="4" y1="-12" x2="12" y2="-18" stroke="url(#goldAcc)" stroke-width="1" stroke-linecap="round" /></g>

    <!-- 6. Bottom Banner / Label Plate on Ring (parametrized via #station-plate + #station-label) -->
    <g transform="translate(100, 155)">
      <path id="M -46,-8 Q 0,-12 46,-8 Q 46,8 46,8 Q 0,12 -46,8 Z" d="M -35,-8 Q 0,-12 35,-8 Q 35,8 35,8 Q 0,12 -35,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1" />
      <g id="station-label" fill="#dfbe6f"><path d="M-31.17,2.47 Q-31.17,2.66 -31.13,2.76 Q-31.09,2.85 -30.96,2.89 Q-30.83,2.93 -30.58,2.93 Q-30.56,2.93 -30.56,2.96 Q-30.56,3.00 -30.58,3.00 Q-30.78,3.00 -31.01,2.99 Q-31.24,2.99 -31.51,2.99 Q-31.74,2.99 -31.94,2.99 Q-32.14,3.00 -32.30,3.00 Q-32.32,3.00 -32.32,2.96 Q-32.32,2.93 -32.30,2.93 Q-32.11,2.93 -32.02,2.89 Q-31.92,2.86 -31.89,2.77 Q-31.86,2.68 -31.86,2.50 L-31.86,-0.37 Q-31.86,-0.55 -31.89,-0.64 Q-31.92,-0.73 -32.02,-0.77 Q-32.11,-0.80 -32.30,-0.80 Q-32.32,-0.80 -32.32,-0.84 Q-32.32,-0.88 -32.30,-0.88 Q-32.14,-0.88 -31.94,-0.87 Q-31.74,-0.86 -31.52,-0.86 Q-31.37,-0.86 -31.13,-0.88 Q-30.89,-0.89 -30.68,-0.89 Q-30.29,-0.89 -29.99,-0.79 Q-29.68,-0.69 -29.50,-0.47 Q-29.33,-0.24 -29.31,0.12 Q-29.30,0.44 -29.41,0.68 Q-29.53,0.91 -29.73,1.07 Q-29.93,1.22 -30.18,1.30 Q-30.42,1.38 -30.66,1.38 Q-30.73,1.38 -30.80,1.37 Q-30.88,1.36 -30.96,1.34 Q-30.97,1.34 -30.97,1.30 Q-30.96,1.26 -30.94,1.26 Q-30.89,1.28 -30.83,1.28 Q-30.76,1.29 -30.73,1.29 Q-30.55,1.29 -30.40,1.18 Q-30.25,1.07 -30.16,0.84 Q-30.06,0.61 -30.06,0.27 Q-30.06,-0.06 -30.16,-0.29 Q-30.25,-0.52 -30.43,-0.64 Q-30.61,-0.76 -30.88,-0.76 Q-30.99,-0.76 -31.05,-0.73 Q-31.12,-0.70 -31.14,-0.61 Q-31.17,-0.52 -31.17,-0.36 L-31.17,2.47 ZM-27.26,-0.37 L-27.26,2.47 Q-27.26,2.62 -27.24,2.70 Q-27.21,2.78 -27.14,2.80 Q-27.06,2.83 -26.91,2.83 L-26.70,2.83 Q-26.21,2.83 -25.86,2.57 Q-25.51,2.31 -25.39,1.87 Q-25.38,1.85 -25.35,1.86 Q-25.32,1.87 -25.32,1.88 Q-25.34,2.09 -25.36,2.38 Q-25.38,2.67 -25.38,2.91 Q-25.38,3.00 -25.47,3.00 L-28.40,3.00 Q-28.41,3.00 -28.41,2.96 Q-28.41,2.93 -28.40,2.93 Q-28.21,2.93 -28.11,2.89 Q-28.02,2.86 -27.98,2.77 Q-27.95,2.68 -27.95,2.50 L-27.95,-0.37 Q-27.95,-0.55 -27.98,-0.64 Q-28.02,-0.73 -28.11,-0.77 Q-28.21,-0.80 -28.40,-0.80 Q-28.41,-0.80 -28.41,-0.84 Q-28.41,-0.88 -28.40,-0.88 Q-28.25,-0.88 -28.04,-0.87 Q-27.83,-0.86 -27.61,-0.86 Q-27.37,-0.86 -27.18,-0.87 Q-26.98,-0.88 -26.82,-0.88 Q-26.80,-0.88 -26.80,-0.84 Q-26.80,-0.80 -26.82,-0.80 Q-27.01,