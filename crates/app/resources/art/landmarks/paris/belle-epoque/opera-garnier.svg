<!-- ============================================================
     STATION MARKER — TINTABLE MASTER
     Map pin badge shared by all transport station markers and
     landmark anchors, parametrized per variant.

     Parametrization contract:
     - The glyph container carries id "station-glyph" — its inner
       markup is replaced per variant (fills), and its transform
       attribute may be substituted for per-glyph vertical offsets.
     - The label plate path carries id "station-plate" — its `d`
       attribute is substituted for wider/narrower plates.
     - The label lives in <text id="station-label"> — replace its
       character data (texts) and font-size/letter-spacing
       attributes (substitutions) per variant.
     - All ring/filigree/shadow elements are colour-neutral and
       must NOT be tinted.

     Defaults below render the taxi station marker.
     See variants.toml for all variants (generated by qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient for Map Marker -->
    <radialGradient id="markerBg" cx="50%" cy="40%" r="60%">
      <stop id="marker-hi" offset="0%" stop-color="#1c2436" />
      <stop id="marker-mid" offset="70%" stop-color="#0d131d" />
      <stop id="marker-lo" offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Ring & Silhouette Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for 3D Map Anchor Depth -->
    <filter id="anchorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow id="station-shadow" dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#anchorShadow)">
    <!-- 1. Bottom Anchor Pin / Pointer Triangle -->
    <polygon points="100,230 85,170 115,170" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <polygon id="station-pin-inner" points="100,222 90,172 110,172" fill="#0d131d" />

    <!-- 2. Main Circular Ornate Badge / Ring -->
    <circle cx="100" cy="100" r="85" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2.5" />
    <circle cx="100" cy="100" r="78" fill="url(#markerBg)" />

    <!-- 3. Inner Filigree Border -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#2c3848" stroke-width="1" stroke-dasharray="4,3" opacity="0.8" />

    <!-- 4. Corner Fleur-de-Lys Accents on Ring -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 100,12 L 103,20 L 100,24 L 97,20 Z" />
      <path d="M 100,188 L 103,180 L 100,176 L 97,180 Z" />
      <path d="M 12,100 L 20,103 L 24,100 L 20,97 Z" />
      <path d="M 188,100 L 180,103 L 176,100 L 180,97 Z" />
    </g>

    <!-- 5. Central Station Glyph (parametrized via #station-glyph) -->
    <g id="station-glyph" transform="translate(100, 103)" filter="url(#glowFilter)"><rect x="-30" y="8" width="60" height="20" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1" />
<path d="M -24,28 L -24,18 C -24,14 -16,14 -16,18 L -16,28 M -8,28 L -8,18 C -8,14 0,14 0,18 L 0,28 M 8,28 L 8,18 C 8,14 16,14 16,18 L 16,28" stroke="url(#goldAcc)" stroke-width="0.8" fill="none" />
<path d="M -28,8 L -28,-4 L 28,-4 L 28,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1" />
<path d="M -18,-4 C -18,-22 18,-22 18,-4 Z" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1.2" />
<path d="M 0,-22 L 0,-28 M -3,-26 L 3,-26" stroke="url(#goldAcc)" stroke-width="1" />
<rect x="-32" y="24" width="64" height="4" fill="url(#goldAcc)" /></g>

    <!-- 6. Bottom Banner / Label Plate on Ring (parametrized via #station-plate + #station-label) -->
    <g transform="translate(100, 155)">
      <path id="M -44,-8 Q 0,-12 44,-8 Q 44,8 44,8 Q 0,12 -44,8 Z" d="M -35,-8 Q 0,-12 35,-8 Q 35,8 35,8 Q 0,12 -35,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1" />
