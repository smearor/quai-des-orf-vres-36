<!-- ============================================================
     PAWN DISC (NEON) — TINTABLE MASTER
     Neon-style detective pawn disc, parametrized per variant.

     Parametrization contract:
     - #tint-mid carries the detective colour on the glowing core
       ring (stroke substitution).
     - Grid/panel/hub elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the blue detective pawn (#2563EB).
     See variants-neon.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Circuit Grid Underlay -->
    <path d="M -40,-20 L 40,-20 M -40,20 L 40,20" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Outer Panel Base -->
    <circle cx="0" cy="0" r="42" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="36" fill="#0F1730" stroke="#16224A" stroke-width="1" />

    <!-- Detective Colour Core Ring (parametrized via #tint-mid) -->
    <circle id="tint-mid" cx="0" cy="0" r="28" fill="#0B1020" stroke="#DC2626" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#16224A" stroke-width="1" stroke-dasharray="4,2" />

    <!-- Inner Core Hub -->
    <circle cx="0" cy="0" r="10" fill="#0F1730" stroke="#F0ABFC" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="3" fill="#C9D4FF" />
  </g>
</svg>
