<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Vintage Parchment Gradient -->
    <radialGradient id="compassBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8e8" />
      <stop offset="70%" stop-color="#f4ebd0" />
      <stop offset="100%" stop-color="#e2d2a9" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <linearGradient id="darkBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542c15" />
      <stop offset="100%" stop-color="#1c120a" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Compass Background Card -->
  <circle cx="200" cy="200" r="185" fill="url(#compassBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#compassShadow)" />
  
  <!-- Outer Ring Ornaments -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#542c15" stroke-width="1" opacity="0.4" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="200" cy="200" r="154" fill="none" stroke="#542c15" stroke-width="0.8" stroke-dasharray="4,4" />

  <!-- Compass Degree Markings (Ticks) -->
  <g stroke="#542c15" stroke-width="1" opacity="0.7" transform="translate(200, 200)">
    <line x1="0" y1="-162" x2="0" y2="-154" stroke-width="2" />
    <line x1="114" y1="-114" x2="108" y2="-108" />
    <line x1="162" y1="0" x2="154" y2="0" stroke-width="2" />
    <line x1="114" y1="114" x2="108" y2="108" />
    <line x1="0" y1="162" x2="0" y2="154" stroke-width="2" />
    <line x1="-114" y1="114" x2="-108" y2="108" />
    <line x1="-162" y1="0" x2="-154" y2="0" stroke-width="2" />
    <line x1="-114" y1="-114" x2="-108" y2="-108" />
  </g>

  <!-- Secondary Star Points (Intercardinal: NE, SE, SW, NW) -->
  <g transform="translate(200, 200) rotate(45)" fill="url(#darkBronze)" opacity="0.7">
    <polygon points="0,0 -15,-15 0,-110 15,-15" />
    <polygon points="0,0 -15,-15 0,110 15,-15" transform="rotate(90)" />
    <polygon points="0,0 -15,-15 0,110 15,-15" transform="rotate(180)" />
    <polygon points="0,0 -15,-15 0,110 15,-15" transform="rotate(270)" />
  </g>

  <!-- Primary Star Points (Cardinal: N, E, S, W) -->
  <g transform="translate(200, 200)" filter="url(#compassShadow)">
    <!-- North -->
    <polygon points="0,0 -18,-18 0,-145 18,-18" fill="url(#goldGrad)" />
    <polygon points="0,0 0,-145 18,-18" fill="#fff" opacity="0.3" />
    
    <!-- South -->
    <polygon points="0,0 -18,18 0,130 18,18" fill="url(#darkBronze)" />
    <polygon points="0,0 0,130 18,18" fill="url(#goldGrad)" opacity="0.7" />

    <!-- East -->
    <polygon points="0,0 18,-18 130,0 18,18" fill="url(#darkBronze)" />
    <polygon points="0,0 130,0 18,18" fill="url(#goldGrad)" opacity="0.7" />

    <!-- West -->
    <polygon points="0,0 -18,-18 -130,0 -18,18" fill="url(#darkBronze)" />
    <polygon points="0,0 -130,0 -18,18" fill="url(#goldGrad)" opacity="0.7" />
  </g>

  <!-- Fleur-de-Lys Symbol on North Pointer -->
  <g transform="translate(200, 52)" fill="url(#goldGrad)" filter="url(#compassShadow)">
    <!-- Central Lily Petal -->
    <path d="M 0,-22 C -6,-15 -10,-8 -10,2 C -10,10 -3,14 0,16 C 3,14 10,10 10,2 C 10,-8 6,-15 0,-22 Z" />
    <!-- Left Petal -->
    <path d="M -8,-2 C -15,-4 -20,2 -16,8 C -14,11 -10,12 -6,8 C -3,5 -5,1 -8,-2 Z" />
    <!-- Right Petal -->
    <path d="M 8,-2 C 15,-4 20,2 16,8 C 14,11 10,12 6,8 C 3,5 5,1 8,-2 Z" />
    <!-- Horizontal Band / Tie -->
    <rect x="-12" y="6" width="24" height="4" rx="1" fill="#542c15" />
    <!-- Stem Base -->
    <path d="M -4,10 L -4,18 L 4,18 L 4,10 Z" />
  </g>

  <!-- Cardinal Letter Labels (N, E, S, W) -->
  <g font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="24" font-weight="bold" fill="#1c120a" text-anchor="middle">
    <!-- N is omitted or shifted slightly because of the Fleur-de-Lys, or placed proudly above -->
    <text x="200" y="32" font-size="18" fill="#542c15" letter-spacing="2">N</text>
    <text x="350" y="208">E</text>
    <text x="200" y="365">S</text>
    <text x="50" y="208">W</text>
  </g>

  <!-- Center Medallion / Rivet -->
  <g transform="translate(200, 200)">
    <circle r="18" fill="#1c120a" stroke="url(#goldGrad)" stroke-width="3" />
    <circle r="10" fill="url(#goldGrad)" />
    <circle r="4" fill="#1c120a" />
  </g>
</svg>