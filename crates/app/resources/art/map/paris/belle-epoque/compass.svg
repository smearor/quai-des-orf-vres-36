    <g><path d="M202.46,-8.21 Q202.46,-7.57 202.78,-7.10 Q203.10,-6.64 203.62,-6.28 Q204.13,-5.92 204.70,-5.57 Q205.30,-5.22 205.85,-4.82 Q206.40,-4.42 206.76,-3.88 Q207.12,-3.34 207.12,-2.58 Q207.12,-1.79 206.71,-1.17 Q206.30,-0.54 205.56,-0.18 Q204.82,0.19 203.78,0.19 Q203.36,0.19 202.94,0.12 Q202.51,0.05 202.13,-0.08 Q201.74,-0.21 201.42,-0.40 Q201.36,-0.45 201.32,-0.51 Q201.28,-0.58 201.28,-0.70 L201.12,-2.99 Q201.10,-3.07 201.19,-3.08 Q201.28,-3.09 201.30,-3.02 Q201.44,-2.53 201.68,-2.02 Q201.92,-1.50 202.26,-1.08 Q202.59,-0.66 203.06,-0.38 Q203.54,-0.11 204.16,-0.11 Q204.59,-0.11 205.00,-0.27 Q205.41,-0.43 205.66,-0.81 Q205.92,-1.18 205.92,-1.86 Q205.92,-2.62 205.58,-3.15 Q205.25,-3.68 204.72,-4.06 Q204.19,-4.45 203.60,-4.80 Q203.04,-5.15 202.52,-5.54 Q202.00,-5.92 201.68,-6.42 Q201.36,-6.93 201.36,-7.65 Q201.36,-8.51 201.82,-9.07 Q202.27,-9.63 202.98,-9.90 Q203.70,-10.18 204.45,-10.18 Q204.94,-10.18 205.46,-10.08 Q205.97,-9.98 206.38,-9.81 Q206.53,-9.74 206.58,-9.67 Q206.62,-9.60 206.62,-9.52 L206.70,-7.52 Q206.70,-7.47 206.62,-7.46 Q206.54,-7.44 206.51,-7.50 Q206.46,-7.78 206.30,-8.18 Q206.14,-8.59 205.87,-8.98 Q205.60,-9.38 205.18,-9.64 Q204.75,-9.90 204.14,-9.90 Q203.58,-9.90 203.22,-9.67 Q202.85,-9.44 202.66,-9.06 Q202.46,-8.69 202.46,-8.21 Z"/></g>
