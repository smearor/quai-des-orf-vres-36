<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Hintergrund-Rasterlinien -->
    <path d="M 0,300 L 800,300 M 400,0 L 400,600" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Äußerer Rahmen -->
    <rect x="20" y="20" width="760" height="560" rx="10" ry="10" fill="#0B1020" stroke="#A78BFA" stroke-width="3" filter="url(#neonGlow)" />
    <rect x="32" y="32" width="736" height="536" rx="6" ry="6" fill="#0F1730" stroke="#16224A" stroke-width="1.5" />

    <!-- Innere gestrichelte Neon-Linie -->
    <rect x="42" y="42" width="716" height="516" rx="4" ry="4" fill="none" stroke="#FFE066" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.8" filter="url(#neonGlow)" />

    <!-- Eck-Terminals (Cyberpunk-Optik) -->
    <circle cx="55" cy="55" r="4" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="745" cy="55" r="4" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="55" cy="545" r="4" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="745" cy="545" r="4" fill="#FFE066" filter="url(#neonGlow)" />

    <!-- Verbindungslinien der Ecken -->
    <path d="M 42,90 L 90,42 M 758,90 L 710,42 M 42,510 L 90,558 M 758,510 L 710,558" fill="none" stroke="#4D7CFE" stroke-width="1" filter="url(#neonGlow)" />

    <!-- Unteres Namensschild / Daten-Plakette -->
    <path d="M 240,505 Q 400,495 560,505 L 550,535 Q 400,525 250,535 Z" fill="#0B1020" stroke="#22D3EE" stroke-width="2" filter="url(#neonGlow)" />
    <line x1="260" y1="520" x2="540" y2="520" stroke="#F0ABFC" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#neonGlow)" />
  </g>
</svg>