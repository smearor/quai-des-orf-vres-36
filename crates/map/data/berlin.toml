name = "berlin"
slogan = "He robbed KaDeWe and vanished into the Nahverkehr. Again."
story = "Dagobert struck again at Wittenbergplatz and vanished into the Nahverkehr. The city is larger, the clock runs longer - the Spree ferries and night lines of the U-Bahn are his escape routes. Hunt him down through Mitte and beyond."
