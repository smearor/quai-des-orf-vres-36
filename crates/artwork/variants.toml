# Artwork variant table for qdo36-artwork.
#
# Each [[asset]] names a parametrized master SVG in masters/ plus an output
# file name template ({name} is replaced by the variant name). Each
# [[asset.variant]] supplies the attribute substitutions and text fills.
#
# Substitution fields:
#   id                - element id in the master (e.g. "tint-mid")
#   attribute         - attribute to replace (e.g. "stop-color", "fill")
#   value             - #rrggbb colour literal
#   lighten_if_below  - optional luminance threshold; darker values are
#                       blended toward white by lighten_factor (default 0.45)
#
# Text fill fields:
#   id                - id of the parametrized <text> element
#   content           - character data written into the element

[[asset]]
master = "pawn-disc.svg"
output = "pawn-disc-ring-rank-letter-{name}.svg"

# Detective pawn palette (style-book colours as mid stop, derived light/dark).
[[asset.variant]]
name = "blue"
substitutions = [
  { id = "tint-light", attribute = "stop-color", value = "#6EA8F0" },
  { id = "tint-mid", attribute = "stop-color", value = "#2563EB" },
  { id = "tint-dark", attribute = "stop-color", value = "#122F6E" },
]
texts = [{ id = "rank-letter", content = "I" }]

