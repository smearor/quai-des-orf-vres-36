<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Comic Ticket Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)">
    
    <!-- Main Ticket Card Body (Paper Cream fill with Thick Ink Stroke) -->
    <rect x="15" y="15" width="370" height="170" rx="10" ry="10" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.5" />
    <rect x="23" y="23" width="354" height="154" rx="6" ry="6" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Inner Dashed Border Line -->
    <rect x="29" y="29" width="342" height="142" rx="4" ry="4" fill="none" stroke="#1C1917" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Corner Rivets / Nails -->
    <circle cx="35" cy="35" r="3" fill="#F5C518" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="365" cy="35" r="3" fill="#F5C518" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="35" cy="165" r="3" fill="#F5C518" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="365" cy="165" r="3" fill="#F5C518" stroke="#1C1917" stroke-width="1.2" />

    <!-- Left & Right Notch Connectors (Black Circles from Reference) -->
    <circle cx="15" cy="100" r="9" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />
    <circle cx="385" cy="100" r="9" fill="#1C1917" stroke="#1C1917" stroke-width="1.5" />

    <!-- Central Taxi Graphic Motif -->
    <g transform="translate(85, 100)" filter="url(#glowFilter)">
      <!-- Car Body Silhouette -->
      <path d="M -28,12 L -24,0 L -14,-10 L 14,-10 L 24,0 L 28,12 Z" fill="#1C1917" stroke="#F5C518" stroke-width="1.5" />
      <path d="M -11,-10 L -9,-18 L 9,-18 L 11,-10 Z" fill="#1C1917" />
      <!-- Roof Sign -->
      <rect x="-6" y="-24" width="12" height="6" rx="1" fill="#F5C518" stroke="#1C1917" stroke-width="1.2" />
      <!-- Headlight -->
      <circle cx="-29" cy="6" r="3" fill="#F5C518" stroke="#1C1917" stroke-width="1" />
      <!-- Bumper / Running Line -->
      <line x1="-34" y1="12" x2="34" y2="12" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" />
      <line x1="-34" y1="12" x2="34" y2="12" stroke="#F5C518" stroke-width="1.5" stroke-linecap="round" />
      <!-- Wheels -->
      <circle cx="-18" cy="16" r="6.5" fill="#F7EFE0" stroke="#1C1917" stroke-width="2.5" />
      <circle cx="18" cy="16" r="6.5" fill="#F7EFE0" stroke="#1C1917" stroke-width="2.5" />
      <circle cx="-18" cy="16" r="2.2" fill="#1C1917" />
      <circle cx="18" cy="16" r="2.2" fill="#1C1917" />
    </g>

    <!-- Horizontal Perforation / Write Line -->
    <line x1="140" y1="115" x2="350" y2="115" stroke="#1C1917" stroke-width="1.8" stroke-dasharray="5,4" stroke-linecap="round" />
  </g>
</svg>