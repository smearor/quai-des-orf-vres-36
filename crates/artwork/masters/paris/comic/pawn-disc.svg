<!-- ============================================================
     PAWN DISC (COMIC) — TINTABLE MASTER
     Comic-style detective pawn disc, parametrized per variant.

     Parametrization contract:
     - #tint-mid carries the flat detective colour (fill
       substitution on the accent disc).
     - Paper/ink elements are colour-neutral and must NOT be
       tinted.

     Defaults below render the blue detective pawn (#2563EB).
     See variants-comic.toml for all variants (generated by
     qdo36-artwork).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Comic Drop Shadow Offset -->
    <filter id="comicShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#1C1917" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Comic Pawn Disc Group with Hard Offset Shadow -->
  <g filter="url(#comicShadow)" transform="translate(50, 50)">

    <!-- Outer Comic Outline / Border (Paper Cream fill with Thick Ink Stroke) -->
    <circle cx="0" cy="0" r="42" fill="#F7EFE0" stroke="#1C1917" stroke-width="3.2" />

    <!-- Inner Panel Background -->
    <circle cx="0" cy="0" r="35" fill="#FBF6E9" stroke="#1C1917" stroke-width="1.8" />

    <!-- Detective Colour Disc (parametrized via #tint-mid) -->
    <circle id="tint-mid" cx="0" cy="0" r="28" fill="#2563EB" stroke="#1C1917" stroke-width="2" />

    <!-- Inner Dashed Stitching / Detail Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F7EFE0" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.9" />

    <!-- Central Inset Core (Dark Ink Core) -->
    <circle cx="0" cy="0" r="12" fill="#1C1917" stroke="#F5C518" stroke-width="1.5" />

    <!-- Comic Action / Ink Burst Cardinal Accents -->
    <g fill="#1C1917" stroke="#1C1917" stroke-width="1">
      <path d="M 0,-42 L 3,-36 L -3,-36 Z" />
      <path d="M 0,42 L 3,36 L -3,36 Z" />
      <path d="M -42,0 L -36,3 L -36,-3 Z" />
      <path d="M 42,0 L 36,3 L 36,-3 Z" />
    </g>

    <!-- Highlight Dot -->
    <circle cx="-4" cy="-4" r="2.5" fill="#F7EFE0" opacity="0.6" />
  </g>
</svg>
