# Artwork variant table for qdo36-artwork — NEON style.
# Generated alongside variants.toml (same schema); masters resolve via
# {city}/{style} to masters/paris/neon/.

city = "paris"
style = "neon"
fonts_dir = "../../../../app/resources/fonts"
outline = true

# Detective pawn discs (neon).
[[asset]]
master = "pawn-disc.svg"
output = "pawn/{city}/{style}/disc-{name}.svg"

[[asset.variant]]
name = "blue"
substitutions = [{ id = "tint-mid", attribute = "stroke", value = "#2563EB" }]

[[asset.variant]]
name = "red"
substitutions = [{ id = "tint-mid", attribute = "stroke", value = "#DC2626" }]

[[asset.variant]]
name = "green"
substitutions = [{ id = "tint-mid", attribute = "stroke", value = "#16A34A" }]

[[asset.variant]]
name = "yellow"
substitutions = [{ id = "tint-mid", attribute = "stroke", value = "#EAB308" }]

[[asset.variant]]
name = "purple"
substitutions = [{ id = "tint-mid", attribute = "stroke", value = "#9333EA" }]


