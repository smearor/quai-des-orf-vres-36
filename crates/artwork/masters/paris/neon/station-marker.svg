<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 20,100 L 180,100 M 100,20 L 100,180" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Pointer Pin Underlay -->
    <polygon points="100,230 84,165 116,165" fill="#0B1020" stroke="#A78BFA" stroke-width="2" filter="url(#neonGlow)" stroke-linejoin="round" />

    <!-- Main Outer Body -->
    <circle cx="100" cy="100" r="82" fill="#0B1020" stroke="#16224A" stroke-width="2" />
    <circle cx="100" cy="100" r="74" fill="#0F1730" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Station Neon Ring (#111A33 fill, glowing ring) -->
    <circle cx="100" cy="100" r="62" fill="#111A33" stroke="#FFE066" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="100" cy="100" r="62" fill="none" stroke="#FFE066" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Neon Taxi Motif -->
    <g transform="translate(100, 92)" filter="url(#neonGlow)">
      <path d="M -26,10 L -20,-2 L -10,-10 L 10,-10 L 20,-2 L 26,10 Z" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
      <rect x="-6" y="-18" width="12" height="6" fill="#FFE066" />
      <line x1="-30" y1="10" x2="30" y2="10" stroke="#FFE066" stroke-width="2" stroke-linecap="round" />
      <circle cx="-16" cy="14" r="5" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
      <circle cx="16" cy="14" r="5" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
    </g>

    <!-- Bottom Data Plaque -->
    <g transform="translate(100, 155)">
      <rect x="-45" y="-12" width="90" height="24" rx="4" fill="#0B1020" stroke="#A78BFA" stroke-width="1.5" filter="url(#neonGlow)" />
      <text x="0" y="4" font-family="&#39;Orbitron&#39;, &#39;Share Tech Mono&#39;, monospace" font-size="8" font-weight="bold" fill="#C9D4FF" text-anchor="middle" letter-spacing="2">
        STATION_01
      </text>
    </g>
  </g>
</svg>