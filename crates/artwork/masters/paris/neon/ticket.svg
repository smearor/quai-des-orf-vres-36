<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Background Grid Hairlines -->
    <path d="M 0,100 L 400,100 M 200,0 L 200,200" fill="none" stroke="#16224A" stroke-width="0.8" />

    <!-- Main Ticket Card Body -->
    <rect x="15" y="15" width="370" height="170" rx="8" ry="8" fill="#0B1020" stroke="#A78BFA" stroke-width="2.5" filter="url(#neonGlow)" />
    <rect x="23" y="23" width="354" height="154" rx="4" ry="4" fill="#0F1730" stroke="#16224A" stroke-width="1.5" />

    <!-- Inner Dashed Neon Border -->
    <rect x="29" y="29" width="342" height="142" rx="2" ry="2" fill="none" stroke="#FFE066" stroke-width="1" stroke-dasharray="6,4" opacity="0.8" filter="url(#neonGlow)" />

    <!-- Circuit Corners -->
    <circle cx="35" cy="35" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="365" cy="35" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="35" cy="165" r="3" fill="#FFE066" filter="url(#neonGlow)" />
    <circle cx="365" cy="165" r="3" fill="#FFE066" filter="url(#neonGlow)" />

    <!-- Side Terminal Slots -->
    <path d="M 15,90 L 23,90 L 23,110 L 15,110 Z" fill="#16224A" stroke="#4D7CFE" stroke-width="1" />
    <path d="M 385,90 L 377,90 L 377,110 L 385,110 Z" fill="#16224A" stroke="#4D7CFE" stroke-width="1" />

    <!-- Central Neon Taxi Icon -->
    <g transform="translate(85, 100)" filter="url(#neonGlow)">
      <path d="M -28,12 L -24,0 L -14,-10 L 14,-10 L 24,0 L 28,12 Z" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
      <rect x="-6" y="-18" width="12" height="6" fill="#FFE066" />
      <line x1="-32" y1="12" x2="32" y2="12" stroke="#FFE066" stroke-width="2" stroke-linecap="round" />
      <circle cx="-18" cy="16" r="5" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
      <circle cx="18" cy="16" r="5" fill="#0B1020" stroke="#FFE066" stroke-width="2" />
    </g>

    <!-- Scanline Perforation Line -->
    <line x1="150" y1="115" x2="350" y2="115" stroke="#4D7CFE" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#neonGlow)" />
    
    <!-- Monospace Ticket Label -->
    <text x="250" y="85" font-family="&#39;Orbitron&#39;, &#39;Share Tech Mono&#39;, monospace" font-size="12" font-weight="bold" fill="#C9D4FF" letter-spacing="3" filter="url(#neonGlow)">
      ACCESS_TAXI
    </text>
  </g>
</svg>