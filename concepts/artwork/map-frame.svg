<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vintage Parchment Gradient (Inner Map Area) -->
    <radialGradient id="mapBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff9eb" />
      <stop offset="70%" stop-color="#f4ebcf" />
      <stop offset="100%" stop-color="#e0cfab" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <linearGradient id="darkBronze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542c15" />
      <stop offset="100%" stop-color="#1c120a" />
    </linearGradient>

    <!-- Drop Shadow for Frame Depth -->
    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Background Container / Frame Base -->
  <rect x="15" y="15" width="770" height="570" rx="4" ry="4" fill="url(#mapBg)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#frameShadow)" />

  <!-- Inner Double Border Lines (Fine Filigree Lines) -->
  <rect x="26" y="26" width="748" height="548" fill="none" stroke="#542c15" stroke-width="1" opacity="0.4" />
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <rect x="38" y="38" width="724" height="524" fill="none" stroke="#542c15" stroke-width="0.75" stroke-dasharray="6,4" opacity="0.6" />

  <!-- === ORNAMENTAL FILIGREE CORNER EMBELLISHMENTS (Art Nouveau / Belle-Époque) === -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#frameShadow)">
    
    <!-- Top-Left Corner Filigree -->
    <g transform="translate(32, 32)">
      <path d="M 0,0 C 0,50 50,0 70,0 M 0,0 C 50,0 0,50 0,70 M 15,15 Q 40,40 75,15 Q 40,40 15,75" stroke-width="1.5" />
      <path d="M 5,5 C 20,20 10,40 30,50" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="url(#goldGrad)" />
    </g>

    <!-- Top-Right Corner Filigree -->
    <g transform="translate(768, 32) scale(-1, 1)">
      <path d="M 0,0 C 0,50 50,0 70,0 M 0,0 C 50,0 0,50 0,70 M 15,15 Q 40,40 75,15 Q 40,40 15,75" stroke-width="1.5" />
      <path d="M 5,5 C 20,20 10,40 30,50" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="url(#goldGrad)" />
    </g>

    <!-- Bottom-Left Corner Filigree -->
    <g transform="translate(32, 568) scale(1, -1)">
      <path d="M 0,0 C 0,50 50,0 70,0 M 0,0 C 50,0 0,50 0,70 M 15,15 Q 40,40 75,15 Q 40,40 15,75" stroke-width="1.5" />
      <path d="M 5,5 C 20,20 10,40 30,50" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="url(#goldGrad)" />
    </g>

    <!-- Bottom-Right Corner Filigree -->
    <g transform="translate(768, 568) scale(-1, -1)">
      <path d="M 0,0 C 0,50 50,0 70,0 M 0,0 C 50,0 0,50 0,70 M 15,15 Q 40,40 75,15 Q 40,40 15,75" stroke-width="1.5" />
      <path d="M 5,5 C 20,20 10,40 30,50" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- === CENTER-EDGE CARTOUCHES / FLOURISHES === -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5">
    <!-- Top Edge Cartouche -->
    <path d="M 360,32 Q 400,18 440,32 M 380,32 Q 400,24 420,32" />
    <circle cx="400" cy="25" r="3" fill="url(#goldGrad)" />

    <!-- Bottom Edge Cartouche -->
    <path d="M 360,568 Q 400,582 440,568 M 380,568 Q 400,576 420,568" />
    <circle cx="400" cy="575" r="3" fill="url(#goldGrad)" />

    <!-- Left Edge Cartouche -->
    <path d="M 32,260 Q 18,300 32,340 M 32,280 Q 24,300 32,320" />
    <circle cx="25" cy="300" r="3" fill="url(#goldGrad)" />

    <!-- Right Edge Cartouche -->
    <path d="M 768,260 Q 782,300 768,340 M 768,280 Q 776,300 768,320" />
    <circle cx="775" cy="300" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Optional Title Banner / Compass Placeholder in Corner or Header -->
  <g transform="translate(400, 535)" filter="url(#frameShadow)">
    <!-- Ornate Banner Plate -->
    <path d="M -160,-16 Q 0,-24 160,-16 Q 160,16 160,16 Q 0,24 -160,16 Z" fill="#1c120a" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="5" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="13" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="4">
      CARTE DE PARIS · QUARTIER GÉNÉRAL
    </text>
  </g>
</svg>