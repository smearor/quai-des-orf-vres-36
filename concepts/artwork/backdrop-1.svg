<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- Map Background Gradient (Midnight Noir Parchment) -->
    <radialGradient id="mapBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121722" />
      <stop offset="60%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Water Surface Gradient (Seine River Dark Bronze-Blue) -->
    <linearGradient id="seineWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182c3d" />
      <stop offset="50%" stop-color="#0f1d2a" />
      <stop offset="100%" stop-color="#09121a" />
    </linearGradient>

    <!-- Ornate Gold/Bronze Gradients for Accents -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Park / Garden Tint Gradient -->
    <radialGradient id="parkTint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3428" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d1812" stop-opacity="0.1" />
    </radialGradient>

    <!-- Subtle Glow Filter for Landmarks -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Outer Frame -->
    <filter id="mapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. MAP BASEBOARD -->
  <rect x="0" y="0" width="600" height="420" fill="url(#mapBg)" />

  <!-- Grid Pattern Overlay (Vintage Cartography Lines) -->
  <g stroke="#1a2433" stroke-width="0.3" stroke-dasharray="2,8" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="350" x2="600" y2="350" />
  </g>

  <!-- 2. PARKS & GREEN ZONES (Soft Ambient Outlines) -->
  <g fill="url(#parkTint)" stroke="#2d4a38" stroke-width="0.5" opacity="0.8">
    <!-- Champ de Mars -->
    <ellipse cx="95" cy="265" rx="14" ry="22" transform="rotate(-25 95 265)" />
    <!-- Jardin des Tuileries -->
    <rect x="185" y="185" width="24" height="14" rx="3" transform="rotate(-10 197 192)" />
    <!-- Jardin du Luxembourg -->
    <rect x="195" y="240" width="20" height="20" rx="4" />
    <!-- Jardin des Plantes -->
    <ellipse cx="312" cy="255" rx="16" ry="10" transform="rotate(15 312 255)" />
    <!-- Parc des Buttes-Chaumont -->
    <circle cx="292" cy="75" r="12" />
    <!-- Parc Monceau -->
    <circle cx="140" cy="100" r="10" />
    <!-- Cimetière du Père Lachaise -->
    <rect x="322" y="148" width="20" height="20" rx="3" transform="rotate(12 332 158)" />
  </g>

  <!-- 3. WATERWAYS (La Seine & Canals) -->
  <!-- Canal Saint-Martin & Bassin de la Villette -->
  <path d="M 330,80 L 300,140 L 292,220" fill="none" stroke="#182c3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 330,80 L 300,140 L 292,220" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.5" />

  <!-- Main Seine River Flow Path -->
  <path d="M 0.0,225.0 
           C 30.0,222.0 50.0,220.0 80.0,215.0 
           C 100.0,220.0 115.0,225.0 160.0,235.0 
           C 185.0,232.0 200.0,230.0 228.0,222.0 
           C 245.0,219.0 262.0,220.0 300.0,225.0 
           C 325.0,230.0 340.0,235.0 400.0,250.0 
           C 440.0,257.0 470.0,260.0 600.0,255.0" fill="none" stroke="url(#seineWater)" stroke-width="22" stroke-linecap="butt" stroke-linejoin="round" />

  <!-- Seine River Golden Bank Outlines -->
  <path d="M 0.0,225.0 C 30.0,222.0 50.0,220.0 80.0,215.0 C 100.0,220.0 115.0,225.0 160.0,235.0 C 185.0,232.0 200.0,230.0 228.0,222.0 C 245.0,219.0 262.0,220.0 300.0,225.0 C 325.0,230.0 340.0,235.0 400.0,250.0 C 440.0,257.0 470.0,260.0 600.0,255.0" fill="none" stroke="url(#goldAcc)" stroke-width="1.2" opacity="0.75" />

  <!-- Seine Islands (Île de la Cité & Île Saint-Louis) -->
  <g fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1">
    <!-- Île de la Cité -->
    <path d="M 244,217 C 250,215 258,216 260,220 C 258,223 248,222 244,217 Z" />
    <!-- Île Saint-Louis -->
    <path d="M 266,225 C 272,224 278,226 276,230 C 270,231 265,228 266,225 Z" />
  </g>

  <!-- Historic Bridges Crossing the Seine -->
  <g stroke="url(#goldAcc)" stroke-width="1.8" stroke-linecap="round">
    <!-- Pont Alexandre III -->
    <line x1="158" y1="188" x2="162" y2="196" />
    <!-- Pont Neuf -->
    <line x1="220" y1="202" x2="224" y2="208" />
    <!-- Pont des Arts -->
    <line x1="233" y1="207" x2="237" y2="213" />
  </g>

  <!-- 4. LANDMARK POSITIONS & ICONS (Belle-Époque Vector Pins) -->
  
  <!-- Anchor Highlight: Tour Eiffel & Station 1 -->
  <g transform="translate(80, 220)" filter="url(#glow)">
    <circle cx="0" cy="0" r="10" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" stroke-dasharray="3,2" />
    <!-- Mini Eiffel Tower Graphic -->
    <path d="M -3,6 L 0,-6 L 3,6 M -2,2 L 2,2" fill="none" stroke="#fef0cd" stroke-width="1.2" />
    <!-- Label -->
    <text x="0" y="-17" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="7" font-weight="bold" fill="#fef0cd" text-anchor="middle" letter-spacing="0.5">
      TOUR EIFFEL (STATION 1)
    </text>
  </g>

  <!-- Arc de Triomphe -->
  <g transform="translate(105, 115)">
    <circle cx="0" cy="0" r="3.5" fill="url(#goldAcc)" />
    <text x="0" y="-6" font-family="&#39;EB Garamond&#39;, serif" font-size="5" fill="#dfbe6f" text-anchor="middle">Arc de Triomphe</text>
  </g>

  <!-- Sacré-Cœur & Butte Montmartre -->
  <g transform="translate(193, 63)">
    <path d="M -8,8 L 0,-2 L 8,8 Z" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" stroke-dasharray="2,2" />
    <circle cx="2" cy="-5" r="3" fill="url(#goldAcc)" />
    <text x="2" y="-10" font-family="&#39;EB Garamond&#39;, serif" font-size="5" fill="#dfbe6f" text-anchor="middle">Sacré-Cœur</text>
  </g>

  <!-- Louvre -->
  <g transform="translate(208, 195)">
    <polygon points="0,-4 -5,4 5,4" fill="none" stroke="url(#goldAcc)" stroke-width="1" />
    <text x="0" y="10" font-family="&#39;EB Garamond&#39;, serif" font-size="5" fill="#dfbe6f" text-anchor="middle">Louvre</text>
  </g>

  <!-- Notre-Dame -->
  <g transform="translate(262, 225)">
    <rect x="-3" y="-3" width="6" height="6" fill="url(#goldAcc)" />
    <text x="0" y="10" font-family="&#39;EB Garamond&#39;, serif" font-size="5" fill="#dfbe6f" text-anchor="middle">Notre-Dame</text>
  </g>

  <!-- Panthéon -->
  <g transform="translate(242, 258)">
    <circle cx="0" cy="0" r="3" fill="url(#goldAcc)" />
    <text x="0" y="8" font-family="&#39;EB Garamond&#39;, serif" font-size="5" fill="#dfbe6f" text-anchor="middle">Panthéon</text>
  </g>

  <!-- Railway Termini (Gares) - Marked with Anchor Square Symbols -->
  <g fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1">
    <!-- Gare du Nord -->
    <rect x="254" y="104" width="8" height="8" rx="1" />
    <!-- Gare de l'Est -->
    <rect x="274" y="116" width="8" height="8" rx="1" />
    <!-- Gare de Lyon -->
    <rect x="318" y="231" width="8" height="8" rx="1" />
    <!-- Gare Montparnasse -->
    <rect x="158" y="266" width="8" height="8" rx="1" />
    <!-- Gare Saint-Lazare -->
    <rect x="156" y="108" width="8" height="8" rx="1" />
  </g>

  <!-- Secondary Landmark Dots (Selected Network Hubs) -->
  <g fill="url(#goldAcc)" opacity="0.75">
    <circle cx="185" cy="140" r="1.8" /> <!-- Opéra Garnier -->
    <circle cx="172" cy="72" r="1.8" />  <!-- Moulin Rouge -->
    <circle cx="292" cy="220" r="1.8" /> <!-- Place de la Bastille -->
    <circle cx="185" cy="190" r="1.8" /> <!-- Place de la Concorde -->
    <circle cx="268" cy="150" r="1.8" /> <!-- Place de la République -->
    <circle cx="8" cy="108" r="1.8" />   <!-- La Défense -->
    <circle cx="8" cy="185" r="1.8" />   <!-- Versailles -->
  </g>

  <!-- 5. MAP BORDER & VINTAGE CORNER FLOURISHES -->
  <!-- Outer Double Border -->
  <rect x="6" y="6" width="588" height="408" fill="none" stroke="url(#goldAcc)" stroke-width="2.5" filter="url(#mapShadow)" />
  <rect x="11" y="11" width="578" height="398" fill="none" stroke="#2c3848" stroke-width="1" />
  <rect x="14" y="14" width="572" height="392" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.7" />

  <!-- Corner Art Nouveau Ornaments -->
  <g fill="none" stroke="url(#goldAcc)" stroke-width="1.2">
    <!-- Top-Left Corner -->
    <path d="M 14,30 C 14,18 18,14 30,14 M 14,38 C 14,22 22,14 38,14" />
    <circle cx="20" cy="20" r="2" fill="url(#goldAcc)" />
    <!-- Top-Right Corner -->
    <path d="M 586,30 C 586,18 582,14 570,14 M 586,38 C 586,22 578,14 562,14" />
    <circle cx="580" cy="20" r="2" fill="url(#goldAcc)" />
    <!-- Bottom-Left Corner -->
    <path d="M 14,390 C 14,402 18,406 30,406 M 14,382 C 14,398 22,406 38,406" />
    <circle cx="20" cy="400" r="2" fill="url(#goldAcc)" />
    <!-- Bottom-Right Corner -->
    <path d="M 586,390 C 586,402 582,406 570,406 M 586,382 C 586,398 578,406 562,406" />
    <circle cx="580" cy="400" r="2" fill="url(#goldAcc)" />
  </g>

  <!-- 6. COMPASS ROSE / CARTOGRAPHY SEAL (Top-Right Angle) -->
  <g transform="translate(530, 65)">
    <circle cx="0" cy="0" r="22" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldAcc)" stroke-width="0.8" stroke-dasharray="3,2" />
    <!-- Compass Star Points -->
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#goldAcc)" />
    <text x="0" y="-20" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="7" font-weight="bold" fill="#fef0cd" text-anchor="middle">N</text>
  </g>

  <!-- 7. TITLE BANNER / MAP HEADER (Bottom-Left Angle) -->
  <g transform="translate(120, 380)">
    <rect x="-90" y="-16" width="180" height="26" rx="4" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.5" />
    <text x="0" y="-2" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="11" font-weight="bold" fill="#fef0cd" text-anchor="middle" letter-spacing="2">
      PARIS · 1900
    </text>
    <text x="0" y="6" font-family="&#39;Courier Prime&#39;, monospace" font-size="6" fill="#dfbe6f" text-anchor="middle" letter-spacing="1">
      QUAI DES ORFÈVRES 36
    </text>
  </g>
</svg>