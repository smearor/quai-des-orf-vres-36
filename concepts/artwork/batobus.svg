<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Ticket Paper Gradient (Vintage River/Parchment Tone) -->
    <linearGradient id="batobusCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8" />
      <stop offset="50%" stop-color="#d4e6ed" />
      <stop offset="100%" stop-color="#b8d2dc" />
    </linearGradient>

    <!-- Ornate Gold/Bronze Accents -->
    <linearGradient id="ticketGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#dfbe6f" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ticket Body with Rounded Corners & Shadow -->
  <rect x="10" y="10" width="380" height="180" rx="8" ry="8" fill="url(#batobusCard)" stroke="url(#ticketGold)" stroke-width="2.5" filter="url(#ticketShadow)" />

  <!-- Perforation Cutouts / Notches on Sides -->
  <circle cx="10" cy="100" r="10" fill="#0d111a" />
  <circle cx="390" cy="100" r="10" fill="#0d111a" />

  <!-- Inner Ornate Border Frame -->
  <rect x="18" y="18" width="364" height="164" rx="4" ry="4" fill="none" stroke="#1c3b48" stroke-width="1" opacity="0.4" />
  <rect x="21" y="21" width="358" height="158" rx="3" ry="3" fill="none" stroke="url(#ticketGold)" stroke-width="1.5" opacity="0.8" />

  <!-- Corner Flourishes -->
  <g fill="url(#ticketGold)" opacity="0.8">
    <circle cx="26" cy="26" r="3" />
    <circle cx="374" cy="26" r="3" />
    <circle cx="26" cy="174" r="3" />
    <circle cx="374" cy="174" r="3" />
  </g>

  <!-- Header: Transport / Company -->
  <text x="200" y="44" font-family="&#39;Times New Roman&#39;, serif" font-size="12" font-weight="bold" fill="#1c3b48" text-anchor="middle" letter-spacing="3">
    NAVIGATION FLUVIALE DE LA SEINE
  </text>
  <line x1="60" y1="52" x2="340" y2="52" stroke="url(#ticketGold)" stroke-width="1" />

  <!-- Central Icon: Classic Paris River Boat / Bateau-Mouche on Waves -->
  <g transform="translate(38, 56)">
    <!-- River Waves under hull -->
    <path d="M 6,42 Q 18,38 30,42 Q 42,46 54,42 Q 66,38 78,42 Q 90,46 94,42" fill="none" stroke="#234e5b" stroke-width="1.5" opacity="0.7" />
    
    <!-- Hull of the classic river boat -->
    <path d="M 12,34 L 22,26 L 74,26 L 84,34 Q 84,38 48,38 Q 12,38 12,34 Z" fill="#1c2d37" />
    <!-- Cabin Structure & Glass Windows -->
    <rect x="26" y="16" width="44" height="12" rx="1" fill="#2a4452" />
    <rect x="30" y="18" width="8" height="8" fill="#f4ebcf" opacity="0.9" />
    <rect x="42" y="18" width="8" height="8" fill="#f4ebcf" opacity="0.9" />
    <rect x="54" y="18" width="8" height="8" fill="#f4ebcf" opacity="0.9" />
    
    <!-- Mast / Flag pole -->
    <line x1="48" y1="16" x2="48" y2="10" stroke="#1c2d37" stroke-width="1" />
    
    <!-- Paddlewheel or Deck Roof Canopy -->
    <rect x="22" y="14" width="52" height="3" rx="1" fill="#dfbe6f" />
  </g>

  <!-- Ticket Main Title -->
  <text x="220" y="92" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="28" font-weight="bold" fill="#1c2d37" letter-spacing="2">
    BATOBUS
  </text>

  <!-- Subtitle / Route description -->
  <text x="220" y="115" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#234e5b" text-anchor="middle" letter-spacing="1">
    NAVETTE FLUVIALE · LA SEINE
  </text>

  <!-- Divider Dashed Line -->
  <line x1="50" y1="130" x2="350" y2="130" stroke="#8c6200" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Footer Info / Serial Number -->
  <text x="35" y="155" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#1c3b48" letter-spacing="1">
    N° 03651
  </text>

  <text x="365" y="155" font-family="&#39;Times New Roman&#39;, serif" font-size="11" font-weight="bold" fill="#b8860b" text-anchor="end" letter-spacing="2">
    QUAI DES ORFÈVRES
  </text>
</svg>