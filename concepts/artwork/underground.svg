<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Dark Underground Stone Gradient -->
    <linearGradient id="sewerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2421" />
      <stop offset="50%" stop-color="#101513" />
      <stop offset="100%" stop-color="#070a09" />
    </linearGradient>

    <!-- Damp Moss / Acid Green & Bronze Accents -->
    <linearGradient id="sewerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b7a57" />
      <stop offset="50%" stop-color="#76c799" />
      <stop offset="100%" stop-color="#3b7a57" />
    </linearGradient>

    <linearGradient id="bronzeAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c7853" />
      <stop offset="50%" stop-color="#c2aa7a" />
      <stop offset="100%" stop-color="#8c7853" />
    </linearGradient>

    <!-- Drop Shadow for Ticket Depth -->
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ticket Body with Rounded Corners & Shadow -->
  <rect x="10" y="10" width="380" height="180" rx="8" ry="8" fill="url(#sewerCard)" stroke="url(#bronzeAcc)" stroke-width="2.5" filter="url(#ticketShadow)" />

  <!-- Perforation Cutouts / Notches on Sides -->
  <circle cx="10" cy="100" r="10" fill="#070a09" />
  <circle cx="390" cy="100" r="10" fill="#070a09" />

  <!-- Inner Ornate Border Frame -->
  <rect x="18" y="18" width="364" height="164" rx="4" ry="4" fill="none" stroke="#2c3a35" stroke-width="1" opacity="0.5" />
  <rect x="21" y="21" width="358" height="158" rx="3" ry="3" fill="none" stroke="url(#bronzeAcc)" stroke-width="1.5" opacity="0.8" />

  <!-- Corner Flourishes -->
  <g fill="url(#bronzeAcc)" opacity="0.8">
    <circle cx="26" cy="26" r="3" />
    <circle cx="374" cy="26" r="3" />
    <circle cx="26" cy="174" r="3" />
    <circle cx="374" cy="174" r="3" />
  </g>

  <!-- Header: Transport / Company -->
  <text x="200" y="44" font-family="&#39;Times New Roman&#39;, serif" font-size="12" font-weight="bold" fill="#76c799" text-anchor="middle" letter-spacing="3">
    RÉSEAU SOUTERRAIN · ÉGOUTS DE PARIS
  </text>
  <line x1="60" y1="52" x2="340" y2="52" stroke="url(#bronzeAcc)" stroke-width="1" />

  <!-- Central Icon: Brick Archway Tunnel with Flowing Water and Manhole Cover -->
  <g transform="translate(42, 55)">
    <!-- Archway Tunnel Silhouette -->
    <path d="M 12,42 L 12,22 Q 12,10 48,10 Q 84,10 84,22 L 84,42 Z" fill="#141a18" stroke="url(#bronzeAcc)" stroke-width="1.2" />
    <path d="M 18,42 L 18,24 Q 18,16 48,16 Q 78,16 78,24 L 78,42 Z" fill="#0b0e0d" />
    
    <!-- Water channel in tunnel floor -->
    <path d="M 36,42 Q 48,38 60,42 Z" fill="#3b7a57" opacity="0.8" />
    
    <!-- Brick Pattern / Vault lines -->
    <line x1="12" y1="28" x2="18" y2="28" stroke="#2c3a35" stroke-width="1" />
    <line x1="78" y1="28" x2="84" y2="28" stroke="#2c3a35" stroke-width="1" />
    <line x1="12" y1="36" x2="18" y2="36" stroke="#2c3a35" stroke-width="1" />
    <line x1="78" y1="36" x2="84" y2="36" stroke="#2c3a35" stroke-width="1" />

    <!-- Small Lantern / Torch glow hanging inside -->
    <circle cx="48" cy="20" r="3" fill="#76c799" />
  </g>

  <!-- Ticket Main Title -->
  <text x="220" y="92" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="28" font-weight="bold" fill="#e2e8f0" letter-spacing="2">
    ÉGOUTS
  </text>

  <!-- Subtitle / Route description -->
  <text x="220" y="115" font-family="&#39;Courier New&#39;, monospace" font-size="11.5" font-weight="bold" fill="#76c799" text-anchor="middle" letter-spacing="1">
    GALERIES SECRÈTES · FUITE
  </text>

  <!-- Divider Dashed Line -->
  <line x1="50" y1="130" x2="350" y2="130" stroke="#3b7a57" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Footer Info / Serial Number -->
  <text x="35" y="155" font-family="&#39;Courier New&#39;, monospace" font-size="10" fill="#64748b" letter-spacing="1">
    N° 03652-SECERT
  </text>

  <text x="365" y="155" font-family="&#39;Times New Roman&#39;, serif" font-size="11" font-weight="bold" fill="url(#bronzeAcc)" text-anchor="end" letter-spacing="2">
    QUAI DES ORFÈVRES
  </text>
</svg>