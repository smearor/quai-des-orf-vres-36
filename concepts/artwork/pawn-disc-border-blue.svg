<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <radialGradient id="tokenBlue" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="70%" stop-color="#1b4f91" />
      <stop offset="100%" stop-color="#0d254a" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="50%" stop-color="#dfbe6f" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>
    <filter id="tokenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <g filter="url(#tokenShadow)">
    <!-- Outer Ring -->
    <circle cx="75" cy="75" r="65" fill="url(#goldRing)" stroke="#1c120a" stroke-width="1.5" />
    <circle cx="75" cy="75" r="59" fill="#0d111a" />
    
    <!-- Tintable Blue Disc -->
    <circle cx="75" cy="75" r="53" fill="url(#tokenBlue)" stroke="url(#goldRing)" stroke-width="2" />
    
    <!-- Internal Star/Cross Accent -->
    <g fill="url(#goldRing)" opacity="0.85" transform="translate(75, 75)">
      <polygon points="0,-25 3,-8 20,0 3,8 0,25 -3,8 -20,0 -3,-8" />
      <circle r="6" fill="#0d111a" stroke="url(#goldRing)" stroke-width="1.5" />
    </g>
  </g>
</svg>