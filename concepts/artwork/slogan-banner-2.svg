<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Deep Noir / Midnight Cardboard Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <!-- Ornate Gold/Bronze Gradients -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for Poster Depth -->
    <filter id="bannerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.85" />
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Card (4:1 Aspect Ratio: 800x200) -->
  <rect x="12" y="12" width="776" height="176" rx="8" ry="8" fill="url(#bannerBg)" stroke="url(#goldAcc)" stroke-width="2.5" filter="url(#bannerShadow)" />

  <!-- Inner Double Border Lines -->
  <rect x="20" y="20" width="760" height="160" rx="5" ry="5" fill="none" stroke="#2c3848" stroke-width="1.2" />
  <rect x="23" y="23" width="754" height="154" rx="4" ry="4" fill="none" stroke="url(#goldAcc)" stroke-width="1" stroke-dasharray="6,4" opacity="0.8" />

  <!-- Corner Flourishes (Art Nouveau / Belle-Époque) -->
  <g fill="none" stroke="url(#goldAcc)" stroke-width="1.2">
    <!-- Top-Left -->
    <path d="M 23,42 C 23,28 26,23 42,23 M 23,48 C 23,32 32,23 48,23" />
    <circle cx="28" cy="28" r="2.5" fill="url(#goldAcc)" />
    <!-- Top-Right -->
    <path d="M 777,42 C 777,28 774,23 758,23 M 777,48 C 777,32 768,23 752,23" />
    <circle cx="772" cy="28" r="2.5" fill="url(#goldAcc)" />
    <!-- Bottom-Left -->
    <path d="M 23,158 C 23,172 26,177 42,177 M 23,152 C 23,168 32,177 48,177" />
    <circle cx="28" cy="172" r="2.5" fill="url(#goldAcc)" />
    <!-- Bottom-Right -->
    <path d="M 777,158 C 777,172 774,177 758,177 M 777,152 C 777,168 768,177 752,177" />
    <circle cx="772" cy="172" r="2.5" fill="url(#goldAcc)" />
  </g>

  <!-- Left Side: Title & Slogan Section -->
  <g transform="translate(240, 100)">
    <!-- Project Name Plate -->
    <text x="0" y="-48" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="10" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="3">
      QUAI DES ORFÈVRES 36 · PARIS
    </text>

    <!-- Main Title (PARIS) -->
    <text x="0" y="-8" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="32" font-weight="bold" fill="#fef0cd" text-anchor="middle" letter-spacing="8" filter="url(#subtleGlow)">
      PARIS
    </text>

    <!-- Slogan -->
    <text x="0" y="24" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-style="italic" font-size="14" fill="#dfbe6f" text-anchor="middle" letter-spacing="1">
      “The city of light holds its breath.”
    </text>
  </g>

  <!-- Vertical Divider separator -->
  <line x1="480" y1="35" x2="480" y2="165" stroke="url(#goldAcc)" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Right Side: Story & Narrative Block -->
  <g transform="translate(635, 100)">
    <text x="0" y="-38" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" fill="#c5d1e0" text-anchor="middle" letter-spacing="0.3">
      Monsieur Corbeau vanished at dawn
    </text>
    <text x="0" y="-22" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" fill="#c5d1e0" text-anchor="middle" letter-spacing="0.3">
      beneath the Eiffel Tower. The detectives
    </text>
    <text x="0" y="-6" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" fill="#c5d1e0" text-anchor="middle" letter-spacing="0.3">
      of Quai des Orfèvres 36 fan out —
    </text>
    <text x="0" y="10" font-family="&#39;Courier Prime&#39;, monospace" font-size="10" fill="#c5d1e0" text-anchor="middle" letter-spacing="0.3">
      every métro gate, every pier is watched.
    </text>
    <text x="0" y="32" font-family="&#39;Courier Prime&#39;, monospace" font-size="10.5" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="0.8">
      Catch him before the last round ends.
    </text>
  </g>

  <!-- Footer Registry Mark -->
  <text x="45" y="166" font-family="&#39;Courier Prime&#39;, monospace" font-size="8.5" fill="#64748b" letter-spacing="1">
    DOSSIER 36-P
  </text>
  <text x="755" y="166" font-family="&#39;Cormorant Garamond&#39;, &#39;EB Garamond&#39;, serif" font-size="8.5" font-weight="bold" fill="url(#goldAcc)" text-anchor="end" letter-spacing="1.5">
    CONFIDENTIEL
  </text>
</svg>