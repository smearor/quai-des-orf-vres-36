<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient for Map Marker -->
    <radialGradient id="markerBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="70%" stop-color="#0d131d" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Ring & Silhouette Gradients -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Drop Shadow for 3D Map Anchor Depth -->
    <filter id="anchorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#anchorShadow)">
    <!-- 1. Bottom Anchor Pin / Pointer Triangle -->
    <polygon points="100,230 85,170 115,170" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2" />
    <polygon points="100,222 90,172 110,172" fill="#0d131d" />

    <!-- 2. Main Circular Ornate Badge / Ring -->
    <circle cx="100" cy="100" r="85" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="2.5" />
    <circle cx="100" cy="100" r="78" fill="url(#markerBg)" />

    <!-- 3. Inner Filigree Border -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="#2c3848" stroke-width="1" stroke-dasharray="4,3" opacity="0.8" />

    <!-- 4. Corner Fleur-de-Lys Accents on Ring -->
    <g fill="url(#goldAcc)" opacity="0.9" stroke="#1c120a" stroke-width="0.5">
      <path d="M 100,12 L 103,20 L 100,24 L 97,20 Z" />
      <path d="M 100,188 L 103,180 L 100,176 L 97,180 Z" />
      <path d="M 12,100 L 20,103 L 24,100 L 20,97 Z" />
      <path d="M 188,100 L 180,103 L 176,100 L 180,97 Z" />
    </g>

    <!-- 5. Central Moulin Rouge Silhouette (Building Structure + Characteristic Windmill Blades) -->
    <g transform="translate(100, 103)" filter="url(#glowFilter)">
      <!-- Building Base -->
      <path d="M -30,30 L -30,6 L -20,6 L -20,2 L 20,2 L 20,6 L 30,6 L 30,30 Z" fill="#141c2b" stroke="url(#goldAcc)" stroke-width="1" />
      <rect x="-32" y="26" width="64" height="4" fill="url(#goldAcc)" />

      <!-- Roof & Windmill Body Structure -->
      <path d="M -16,2 L -10,-12 L 10,-12 L 16,2 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1.2" />

      <!-- Characteristic Windmill Blades (Rotated Cross) -->
      <g stroke="url(#goldAcc)" stroke-width="1.5" stroke-linecap="round" fill="none">
        <line x1="0" y1="-5" x2="-28" y2="-28" />
        <line x1="0" y1="-5" x2="28" y2="18" />
        <line x1="0" y1="-5" x2="28" y2="-28" />
        <line x1="0" y1="-5" x2="-28" y2="18" />
      </g>
      <!-- Central Hub Pin -->
      <circle cx="0" cy="-5" r="3" fill="url(#goldAcc)" stroke="#1c120a" stroke-width="0.8" />
    </g>

    <!-- 6. Bottom Banner / Label Plate on Ring -->
    <g transform="translate(100, 155)">
      <path d="M -44,-8 Q 0,-12 44,-8 Q 44,8 44,8 Q 0,12 -44,8 Z" fill="#0d131d" stroke="url(#goldAcc)" stroke-width="1" />
      <text x="0" y="3" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="7.5" font-weight="bold" fill="#dfbe6f" text-anchor="middle" letter-spacing="1">
        MOULIN ROUGE
      </text>
    </g>
  </g>
</svg>