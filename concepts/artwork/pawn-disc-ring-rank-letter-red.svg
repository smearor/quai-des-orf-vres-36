<!-- ============================================================
     PAWN DISC — TINTABLE MASTER
     Detective pawn token, parametrized for per-player colours.

     Parametrization contract:
     - Disc gradient stops carry ids "tint-light", "tint-mid",
       "tint-dark" — replace their stop-color values per pawn
       colour (see variants.toml, generated by qdo36-artwork).
     - The rank letter lives in <text id="rank-letter"> — replace
       its character data for other ranks (I, II, III, D, ...).
     - All ring/filigree/shadow elements are colour-neutral and
       must NOT be tinted.

     Defaults below render the blue pawn (style-book #2563EB).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Tintable Disc Core Gradient (parametrized via stop ids) -->
    <radialGradient id="pawnDisc" cx="50%" cy="40%" r="60%">
      <stop id="tint-light" offset="0%" stop-color="#F06A6A" />
      <stop id="tint-mid" offset="70%" stop-color="#DC2626" />
      <stop id="tint-dark" offset="100%" stop-color="#6E1212" />
    </radialGradient>

    <!-- Ornate Gold/Bronze Ring Gradients (colour-neutral, never tint) -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef0cd" />
      <stop offset="30%" stop-color="#dfbe6f" />
      <stop offset="70%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#542c15" />
    </linearGradient>

    <!-- Deep Drop Shadow for 3D Token Depth -->
    <filter id="pawnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.75" />
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#pawnShadow)">
    <!-- 1. Outer Ornate Ring (Bronze/Gold Border) -->
    <circle cx="100" cy="100" r="85" fill="url(#goldRing)" stroke="#1c120a" stroke-width="2" />
    <circle cx="100" cy="100" r="78" fill="#0d111a" />

    <!-- 2. Inner Tintable Disc (parametrized gradient) -->
    <circle cx="100" cy="100" r="70" fill="url(#pawnDisc)" stroke="url(#goldRing)" stroke-width="2.5" />

    <!-- 3. Fine Belle-Époque Filigree Ring Details -->
    <circle cx="100" cy="100" r="60" fill="none" stroke="#fef0cd" stroke-width="1" stroke-dasharray="4,3" opacity="0.6" />

    <!-- 4. Corner Fleur-de-Lys / Star Accents on Ring -->
    <g fill="url(#goldRing)" opacity="0.9">
      <path d="M 100,12 L 103,20 L 100,24 L 97,20 Z" />
      <path d="M 100,188 L 103,180 L 100,176 L 97,180 Z" />
      <path d="M 12,100 L 20,103 L 24,100 L 20,97 Z" />
      <path d="M 188,100 L 180,103 L 176,100 L 180,97 Z" />
    </g>

    <!-- 5. Central Rank Letter Badge (parametrized via #rank-letter) -->
    <circle cx="100" cy="100" r="32" fill="#0d111a" stroke="url(#goldRing)" stroke-width="2" filter="url(#innerGlow)" />

    <text id="rank-letter" x="100" y="112" font-family="&#39;Times New Roman&#39;, &#39;Georgia&#39;, serif" font-size="36" font-weight="bold" fill="url(#goldRing)" text-anchor="middle">I</text>
  </g>
</svg>
